		catch (e) { flashStatus(e.message); }

	m.body.append(row, note);

			const pv = document.createElement('a'); pv.href = 'https://mithraeum.studio/privacy'; pv.target = '_blank'; pv.rel = 'noopener'; pv.textContent = 'privacy';

				'&body=' + encodeURIComponent('i would like to try code sessions in hako studio.');

	/* Hosted, the menu always offers chat · code and, at its foot, sign in (or

		if (HASH === '#signin' || INVITE) history.replaceState(null, '', location.pathname);
		window.addEventListener('hashchange', () => {

		else if (PAIR) this.open(null, PAIR);
		else if (SSO_BACK || HASH === '#signin' || INVITE) this.open();      /* one sheet, also back from GitHub or Google */
		window.addEventListener('hako-remote-ready', () => projects());
		if (!REMOTE_ID) show(false);
		else { pick(true); watchRemote(REMOTE_ID); }
	},
};

/* This browser's own agent, started the first time chat is shown, then kept: a
   code session shown in between leaves it running. */
function bootLocal() {
	if (localApi || !HAKO_WASM_MODE) return;
	const worker = new Worker('hako-worker.js', { type: 'module' });
	const ring = [];                       /* events, so a late listener sees them */
	let listeners = [];
	let booted = false;

	const emit = (obj) => {
		ring.push(obj);
		listeners.forEach((fn) => fn(obj));
	};

	let config = { provider: '', model: '', has_key: false };
	let configReady = null;
	const whenConfig = new Promise((r) => { configReady = r; });
	const WORKSPACE = '/workspace';   /* the one visible root in the browser build */
	let workDir = WORKSPACE;
	let curSession = '';
	let folderName = '';
	let agentVersion = '';

	/* A directory handle is a live object, not a path; IndexedDB is the only
	   place that can store one. */
	const idb = (fn) => new Promise((resolve) => {
		const rq = indexedDB.open('hako', 1);
		rq.onupgradeneeded = () => rq.result.createObjectStore('handles');
		rq.onerror = () => resolve(null);
		rq.onsuccess = () => {
			const db = rq.result;
			const tx = db.transaction('handles', 'readwrite');
			const r = fn(tx.objectStore('handles'));
			if (r) { r.onsuccess = () => resolve(r.result); r.onerror = () => resolve(null); }
			else resolve(null);
		};
	});
	const rememberFolder = (h) => idb((st) => st.put(h, 'folder'));
	const recallFolder = () => idb((st) => st.get('folder'));
	const forgetFolder = () => idb((st) => st.delete('folder'));

	async function mountFolder(handle) {
		const r = await ask('mount', { handle });
		workDir = (r && r.path) || '/';
		folderName = handle ? handle.name : '';
		curSession = '';
		return r;
	}

	/* Permission may already be granted; otherwise it needs a click, so hold the
	   handle and let the picker ask. */
	let pendingFolder = null;
	async function restoreFolder() {
		if (!window.showDirectoryPicker) return;
		const h = await recallFolder();
		if (!h) return;
		try {
			if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') {
				await mountFolder(h);
				await refreshState();
			} else {
				pendingFolder = h;
			}
		} catch (e) { /* handle no longer valid: the picker will ask again */ }
	}

	window.hakoPendingFolder = () => (pendingFolder ? pendingFolder.name : '');
	window.hakoReconnectFolder = async () => {
		if (!pendingFolder) return false;
		try {
			if (await pendingFolder.requestPermission({ mode: 'readwrite' }) !== 'granted') return false;
		} catch (e) { return false; }
		const h = pendingFolder;
		pendingFolder = null;
		return !!(await mountFolder(h)).path;
	};
	let pendingKey = null;          /* provider awaiting a pasted key */
	let pendingCode = null;         /* provider awaiting a pasted OAuth code */
	let askAfterTurn = null;        /* a prompt to raise once the turn is finished */
	let pendingPrompt = null;       /* what the user asked before we interrupted */

	worker.onmessage = (ev) => {
		const m = ev.data || {};
		if (m.type === 'ready') {
			booted = true;
			if (m.dir) workDir = m.dir;
			worker.postMessage({ type: 'state' });
			restoreFolder();
			return;
		}
		if (m.type === 'open' && m.path) workDir = m.path;
		if (m.type === 'config') { config = m.config; configReady(); return; }
		if (m.type === 'session') { curSession = m.id; return; }
		if (m.type === 'version') { agentVersion = m.version; return; }
		if (m.type === 'live') {
			const changed = m.provider !== config.provider || m.model !== config.model;
			if (m.provider) config.provider = m.provider;
			if (m.model) config.model = m.model;
			/* The header was already drawn from whatever state said at boot. */
			if (changed && typeof handshake === 'function') handshake();
			return;
		}
		if (m.id !== undefined && asking.has(m.id)) {
			asking.get(m.id)(m);
			asking.delete(m.id);
			return;
		}
		if (m.type === 'out') {
			let obj;
			try { obj = JSON.parse(m.line); } catch (e) { return; }
			if (collecting) {
				if (obj.type === 'message' && obj.role === 'system') { collecting.lines.push(obj.text || ''); return; }
				if (obj.type === 'done') { collecting.finish(); return; }
				return;                       /* a collected command speaks to us, not the transcript */
			}
			emit(obj);
			if (obj.type === 'done' && askAfterTurn) {
				const q = askAfterTurn;
				askAfterTurn = null;
				emit({ type: 'input_request', prompt: q.prompt, hidden: q.hidden });
			}
			return;
		}
		if (m.type === 'log') console.debug('[hako]', m.line);
		if (m.type === 'error') emit({ type: 'error', text: m.error });
	};
	worker.postMessage({ type: 'boot', wasmUrl: 'hako.wasm' });

	const run = (lines) => worker.postMessage({ type: 'run', lines });

	/* Some routes need data only the agent has (its provider table, its model
	   catalog). Rather than copy that into JS — where it would drift the moment
	   hako.c changed — run the command and collect what it prints. */
	/* Request/response over postMessage: routes that read stored state ask the
	   worker and await the matching reply. */
	let askSeq = 0;
	const asking = new Map();
	const ask = (type, extra) => new Promise((resolve) => {
		const id = ++askSeq;
		asking.set(id, resolve);
		worker.postMessage({ type, id, ...extra });
		setTimeout(() => { if (asking.has(id)) { asking.delete(id); resolve(null); } }, 4000);
	});

	/* The agent announces its provider and model in every init event, and only a
	   turn produces one. Run a silent command at boot so the header is right
	   before the user touches anything. */
	whenConfig.then(() => runCollect(':session'));

	let collecting = null;
	const runCollect = (cmd) => new Promise((resolve) => {
		const lines = [];
		collecting = { lines, resolve };
		const done = () => { collecting = null; resolve(lines); };
		const timer = setTimeout(done, 5000);
		collecting.finish = () => { clearTimeout(timer); done(); };
		run([JSON.stringify({ type: 'slash', cmd })]);
	});

	/* The UI's HTTP calls, answered in-page. Same routes, same shapes. */
	const routes = {
		'/api/state': async () => (await whenConfig, {
			awaiting_code: pendingCode ? 1 : 0,
			version: (agentVersion || '') + ' wasm' + (buildId ? ' b' + buildId.slice(-5) : ''),
			dir: workDir, home: folderName ? workDir : WORKSPACE,
			root: folderName ? '' : WORKSPACE, places: [],
			folder: folderName,
			provider: config.provider, model: config.model, session: curSession, turns: 0,
			busy: 0, yolo: 0,
			awaiting_input: (pendingKey || pendingCode) ? 1 : 0,
			input_hidden: pendingKey ? 1 : 0,
			input_prompt: pendingKey ? ('paste your ' + pendingKey + ' API key')
			            : pendingCode ? 'paste the code shown on that page' : '',
			caps: ['prompt', 'slash', 'input', 'events', 'models', 'providers', 'sessions',
			       'history', 'rename', 'delete', 'mark', 'dirs', 'files', 'open', 'mkdir',
			       'upload', 'save', 'image', 'wasm']
			      .concat(window.showDirectoryPicker ? ['pickfolder'] : []),
		}),
		'/api/sessions': async () => {
			const r = await ask('sessions');
			return { dir: workDir, current: curSession,
			         sessions: (r && r.sessions) || [] };
		},
		'/api/dirs': async (query) => {
			const r = await ask('dirs', { path: query.get('path') || workDir });
			return r || { path: workDir, dirs: [], files: [] };
		},
		'/api/models': async () => {
			const lines = await runCollect(':models list');

			const nl = body.indexOf('\n');

			const id = query.get('id') || '';
			const r = await ask('history', { session: id });

const fmtDur = (s) => s < 60 ? s + 's' : Math.floor(s / 60) + 'm ' + (s % 60 ? s % 60 + 's' : '');
function paintWork(w) {
	const secs = Math.round((Date.now() - w.t0) / 1000), live = w.el.classList.contains('live');
	w.lbl.textContent = (live ? 'working' : 'worked' + (w.timed && secs >= 1 ? ' ' + fmtDur(secs).trim() : ''))
		+ ' \u00b7 ' + w.steps + (w.steps === 1 ? ' step' : ' steps');
	if (w.fails) w.lbl.appendChild(Object.assign(document.createElement('span'), { className: 'bad', textContent: ' \u00b7 ' + w.fails + ' failed' }));
}
function closeWork() {
	if (!work) return;
	work.el.classList.remove('live');
	work.now.textContent = '';
	paintWork(work);
	work = null;
}
function workRow() {
	const last = spinEl ? spinEl.previousElementSibling : log.lastElementChild;
	if (work && work.el === last) return work;
	closeWork();
	setLanding(false);
	const el = document.createElement('div');
	el.className = 'work live';
	const head = document.createElement('button');
	head.type = 'button'; head.className = 'whead'; head.setAttribute('aria-expanded', 'false');
	const car = Object.assign(document.createElement('span'), { className: 'car', textContent: '\u203a' });
	const lbl = Object.assign(document.createElement('span'), { className: 'lbl' });
	const now = Object.assign(document.createElement('span'), { className: 'now' });
	head.append(car, lbl, now);
	const body = Object.assign(document.createElement('div'), { className: 'wbody' });
	el.append(head, body);
	head.addEventListener('click', () => { const o = el.classList.toggle('open'); head.setAttribute('aria-expanded', String(o)); });
	if (spinEl) log.insertBefore(el, spinEl); else log.appendChild(el);
	work = { el, lbl, now, body, steps: 0, fails: 0, t0: Date.now(), timed: !replaying };
	paintWork(work);
	return work;
}
function addTool(cls, text, step) {
	const w = workRow();
	const el = add(cls, '', text, w.body);
	if (step) { w.steps++; w.now.textContent = text; }
	if (/\bfail\b/.test(cls)) w.fails++;
	paintWork(w);
	return el;
}

function add(cls, who, text, parent) {
	if (CONVERSATION.test(cls)) setLanding(false);
	const stick = atBottom();
	const el = document.createElement('div');
	el.className = cls;
	if (who) {
		const w = document.createElement('span');
		w.className = 'who'; w.textContent = who; el.appendChild(w);
	}
	/* A bare URL in the transcript is useless on a phone — the login flow hands
	   one over and expects you to open it. Only http(s), only as text nodes. */
	const parts = String(text).split(/(https?:\/\/[^\s]+)/g);
	parts.forEach((part, i) => {
		if (i % 2 === 1) {
			const a = document.createElement('a');
			a.href = part; a.target = '_blank'; a.rel = 'noopener noreferrer';
			a.textContent = part;
			el.appendChild(a);
		} else if (part) el.appendChild(document.createTextNode(part));
	});
	if (parent) parent.appendChild(el);
	else if (spinEl) log.insertBefore(el, spinEl);   /* keep the spinner last */
	else log.appendChild(el);
	if (stick) log.scrollTop = log.scrollHeight;
	return el;
}
let metaHold = 0;                     /* a flashStatus word is showing until then */
/* The header's status word: the turn, or a word for a moment. Provider and model
   live under the composer now. */
function renderMeta() {
	if (Date.now() < metaHold) return;
	meta.textContent = state.turns ? 'turn ' + state.turns : '';
	renderChrome();
}
/* ---------- thinking indicator ----------
   A local turn can run for minutes with nothing streamed back, so without this
   the page looks dead. Elapsed time is the part that actually reassures. */
const SPINNERS = {
	braille: ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'],
	dots:    ['·  ','·· ','···',' ··','  ·','   '],
	bar:     ['▁','▃','▄','▅','▆','▇','▆','▅','▄','▃'],
	moon:    ['◐','◓','◑','◒'],
	arc:     ['◜','◝','◞','◟'],
	none:    null
};
let spinTimer = null, spinEl = null, spinStart = 0;

function startThinking() {
	if (spinEl) return;
	const frames = SPINNERS[settings.spinner];
	const stick = atBottom();
	spinEl = document.createElement('div');
	spinEl.className = 'thinking';
	const f = document.createElement('span');
	f.className = 'frame';
	const label = document.createTextNode(' thinking ');
	const t = document.createElement('span');
	t.className = 'elapsed';
	spinEl.append(f, label, t);
	log.appendChild(spinEl);
	if (stick) log.scrollTop = log.scrollHeight;

	spinStart = Date.now();
	let i = 0;
	const tick = () => {
		if (!spinEl) return;
		if (frames) f.textContent = frames[i++ % frames.length];
		const s = Math.floor((Date.now() - spinStart) / 1000);
		t.textContent = s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's';
	};
	tick();
	spinTimer = setInterval(tick, frames ? 90 : 1000);
}
function stopThinking() {
	if (spinTimer) { clearInterval(spinTimer); spinTimer = null; }
	if (spinEl) { spinEl.remove(); spinEl = null; }
}
function setBusy(v) {
	busy = v;
	syncSend();
	if (v) startThinking(); else stopThinking();
}
/* A core that can be interrupted turns the send button into a stop button —
   on a phone there is no Ctrl-C to fall back on. Older cores just grey out.
   Something typed mid-turn waits for the turn (queue); a command goes now. */
function syncSend() {
	const t = input.value.trim(), typed = busy && !!t;
	send.disabled = busy && !typed && !caps.has('stop');
	send.textContent = !busy ? 'send' : typed ? (/^[:/]/.test(t) ? 'send' : 'queue') : caps.has('stop') ? 'stop' : '…';
	send.dataset.act = send.textContent === '…' ? 'wait' : send.textContent;
}

/* Said while a turn runs: held on this page, then sent as one message when the
   turn ends. "send now" puts it into the running turn (hako reads it after the
   tools it is running, as the user's); a core without steer stops the turn and
   its done sends them. */
const queued = [];
function renderQueued() {
	const q = $('queued');
	q.textContent = '';
	q.hidden = !queued.length;
	queued.forEach((t, i) => {
		const chip = document.createElement('span');
		chip.className = 'chip';
		const nm = document.createElement('span');
		nm.className = 'nm';
		nm.textContent = t;
		nm.title = 'sends when this turn ends';
		chip.append(nm);
		if (caps.has('steer') || caps.has('stop')) {
			const go = document.createElement('button'), steer = caps.has('steer');
			go.className = 'go'; go.type = 'button'; go.textContent = 'send now';
			go.title = steer ? 'into this turn: read at its next step' : 'stop this turn and send';
			go.addEventListener('click', () => {
				if (!busy) return flushQueued();
				if (!steer) return post('/api/stop', '');
				queued.splice(queued.indexOf(t), 1); renderQueued();   /* shows in the chat where the turn reads it */
				post('/api/steer', t);
			});
			chip.append(go);
		}
		const rm = document.createElement('button');
		rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×'; rm.title = 'remove';
		rm.addEventListener('click', () => { queued.splice(i, 1); renderQueued(); });
		chip.append(rm);
		q.appendChild(chip);
	});
}
function flushQueued() {
	if (busy || !queued.length) return;
	const t = queued.splice(0).join('\n\n');
	renderQueued();
	sendText(t);
}

/* hako announces provider/model changes in its normal output:
     "provider: anthropic (saved)"
     "model: claude-sonnet-4-6 (saved)"
     "model → claude-haiku-4-5 (prior model not valid for anthropic…)"
   Read the real values off the stream rather than assuming what we asked for
   stuck — a provider switch can silently reassign the model. */
function sniffState(text) {
	let m, hit = false;
	if ((m = text.match(/^provider:\s*([^\s(]+)/))) { state.provider = m[1]; hit = true; }
	if ((m = text.match(/^model:\s*([^\s(]+)/)))    { state.model = m[1];    hit = true; }
	if ((m = text.match(/^model\s*→\s*([^\s(]+)/))) { state.model = m[1];    hit = true; }
	if (hit) renderMeta();
	return hit;
}
async function post(path, body) {
	try { return await fetch(path, { method: 'POST', body }); }
	catch (e) { add('turn error', '', 'send failed: ' + e.message); setBusy(false); }
}

/* ---------- generic modal ---------- */
function modal(title) {
	const scrim = document.createElement('div');
	scrim.className = 'scrim';
	const box = document.createElement('div');
	box.className = 'modal';
	const h = document.createElement('h2');
	h.textContent = title;
	const body = document.createElement('div');
	body.className = 'body';
	const foot = document.createElement('div');
	foot.className = 'foot';
	box.append(h, body, foot);
	scrim.appendChild(box);
	const m = { scrim, box, title: h, body, foot, onclose: null };
	m.close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); if (m.onclose) m.onclose(); };
	function onKey(e) { if (e.key === 'Escape') m.close(); }
	document.addEventListener('keydown', onKey);
	scrim.addEventListener('click', (e) => { if (e.target === scrim) m.close(); });
	document.body.appendChild(scrim);
	return m;
}

/* A word in the header's status line for a moment, never in the chat. */
function flashStatus(text) {
	meta.textContent = text;
	metaHold = Date.now() + 2500;
	setTimeout(() => { metaHold = 0; renderMeta(); }, 2500);
}
function optionRow(label, sub, tag, onClick, current) {
	const b = document.createElement('button');
	b.className = 'opt' + (current ? ' sel' : '');
	b.appendChild(document.createTextNode((current ? '◎ ' : '  ') + label));
	if (tag) {
		const s = document.createElement('span');
		s.className = 'tag'; s.textContent = '  ' + tag; b.appendChild(s);
	}
	if (sub) {
		const s = document.createElement('span');
		s.className = 'sub'; s.textContent = '  ' + sub; b.appendChild(s);
	}
	b.addEventListener('click', onClick);
	return b;
}
function groupLabel(text) {
	const d = document.createElement('div');
	d.className = 'grouplabel'; d.textContent = text;
	return d;
}
/* One line of choices, one of them on: light or dark, a background, an indicator.
   `keep` leaves the mark to the caller (a choice that can be cancelled, a picture). */
function segRow(opts, cur, onPick, keep) {
	const d = document.createElement('div');
	d.className = 'seg'; d.setAttribute('role', 'radiogroup');
	d.mark = (k) => { for (const b of d.children) { b.classList.toggle('sel', b.dataset.k === k); b.setAttribute('aria-checked', b.dataset.k === k); } };
	for (const [k, label, title] of opts) {
		const b = document.createElement('button');
		b.type = 'button'; b.dataset.k = k; b.textContent = label; b.setAttribute('role', 'radio');
		if (title) { b.title = title; b.setAttribute('aria-label', title); }
		b.addEventListener('click', () => { onPick(k); if (!keep || k !== 'image') d.mark(k); });
		d.appendChild(b);
	}
	d.mark(cur);
	return d;
}
/* A setting that is on or off: its words, and a switch at the end of the row. */
function switchRow(label, sub, on, onFlip) {
	const b = document.createElement('button');
	b.type = 'button'; b.className = 'opt swrow'; b.setAttribute('role', 'switch');
	const words = document.createElement('span');
	words.className = 'words';
	words.append(document.createTextNode(label));
	if (sub) words.append(Object.assign(document.createElement('span'), { className: 'sub', textContent: sub }));
	const sw = Object.assign(document.createElement('span'), { className: 'sw' });
	b.append(words, sw);
	const set = (v) => { on = v; b.classList.toggle('on', v); b.setAttribute('aria-checked', v); };
	set(!!on);
	b.addEventListener('click', () => { set(!on); onFlip(on); });
	return b;
}
function mb(label, cls, fn) {
	const b = document.createElement('button');
	if (cls) b.className = cls;
	b.textContent = label;
	b.addEventListener('click', fn);
	return b;
}
const fmtGB = (n) => (n / 1073741824).toFixed(1) + ' GB';

/* ---------- approvals ---------- */
const ALWAYS_LABEL = { write: 'always write in this project', shell: 'always run exactly this', read: 'always read in this project' };
const VERDICT = { y: 'allowed once', n: 'denied', a: 'allowed for this session' };

function askApproval(m) {
	const stick = atBottom();
	const box = document.createElement('div');
	box.className = 'ask';
	const head = document.createElement('span');
	head.className = 'head'; head.textContent = '● ' + (m.name || 'tool');
	const subj = document.createElement('span');
	subj.className = 'subj'; subj.textContent = m.subject || '';
	const row = document.createElement('div');
	row.className = 'row';
	const mk = (cls, label, ans) => row.appendChild(mb(label, cls, () => { settle(box, ans); post('/api/approve', ans); }));
	mk('primary', 'allow once', 'y');
	mk('', 'deny', 'n');
	mk('', ALWAYS_LABEL[m.kind] || 'always allow', 'a');
	box.append(head, subj, row);
	box.tool = true;
	if (spinEl) log.insertBefore(box, spinEl);   /* in order, above the spinner */
	else log.appendChild(box);
	if (m.id) askBoxes.set(String(m.id), box);
	if (stick) log.scrollTop = log.scrollHeight;
}
/* The core asks to pick one: a picker command or the model's ask_user. It
   waits for the answer, so the box must always answer or be settled. */
function askChoice(m) {
	const stick = atBottom();
	const box = document.createElement('div');
	box.className = 'ask';
	const head = document.createElement('span');
	head.className = 'head'; head.textContent = '● ' + (m.question || 'choose one');
	const row = document.createElement('div');
	row.className = 'row';
	(m.options || []).forEach((o, i) => row.appendChild(mb(o, i ? '' : 'primary', () => {
		settle(box, o); post('/api/approve', String(i + 1));
	})));
	row.appendChild(mb('cancel', '', () => { settle(box, 'cancelled'); post('/api/approve', '0'); }));
	box.append(head, row);
	if (spinEl) log.insertBefore(box, spinEl);
	else log.appendChild(box);
	if (m.id) askBoxes.set('c' + m.id, box);
	if (stick) log.scrollTop = log.scrollHeight;
}
function settleOpenChoices() {
	for (const [k, box] of askBoxes)
		if (k[0] === 'c' && !box.classList.contains('settled')) settle(box, 'closed');
}

/* The core asks for a line of text — an OAuth code, a yes/no. Without this the
   agent would be waiting on a terminal the browser does not have. */
let pendingInput = null;

/* Dismissing the box must not strand the turn: the request stays pending and a
   banner offers it back. Only an explicit cancel answers (empty), which is what
   actually unparks the agent. */
function renderPending() {
	let bar = document.getElementById('pending');
	if (!pendingInput) { if (bar) bar.remove(); return; }
	if (!bar) {
		bar = document.createElement('button');
		bar.id = 'pending';
		bar.type = 'button';
		bar.className = 'pending';
		bar.addEventListener('click', () => askInput(pendingInput));
		form.parentNode.insertBefore(bar, form);
	}
	bar.textContent = '● the agent is waiting: ' + (pendingInput.prompt || 'input needed') + ' — tap to answer';
}

function askInput(m) {
	pendingInput = m;
	renderPending();
	const box = modal(m.prompt || 'input needed');
	const n = document.createElement('div');
	n.className = 'note';
	n.textContent = m.hidden
		? 'Open the link above, sign in, then paste what it gives you. It is sent straight to the agent on this machine and stored by hako, not by this page.'
		: 'The agent is waiting on this.';
	box.body.appendChild(n);

	const wrap = document.createElement('div');
	wrap.style.padding = '.35rem .55rem';
	const inp = document.createElement('input');
	inp.type = m.hidden ? 'password' : 'text';
	inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
	inp.placeholder = m.hidden ? 'paste here' : '';
	wrap.appendChild(inp);
	box.body.appendChild(wrap);

	const send_ = () => {
		pendingInput = null; renderPending();
		box.close();
		post('/api/input', inp.value);
	};
	inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && inp.value) send_(); });
	const g = document.createElement('div'); g.className = 'grow';
	/* Closing without answering would leave the turn parked, so cancel answers. */
	box.foot.append(g, mb('cancel', '', () => {
		pendingInput = null; renderPending();
		box.close();
		post('/api/input', '');       /* an unanswered prompt would park the turn forever */
	}), mb('send', 'primary', send_));
	setTimeout(() => inp.focus(), 50);
}

/* The core's display string sometimes already carries its own arrow. */
const arrowed = (mark, text) => /^\s*[→←]/.test(text) ? text.trim() : mark + ' ' + text;

function settle(box, ans) {
	box.classList.add('settled');
	const v = document.createElement('span');
	v.className = 'verdict'; v.textContent = VERDICT[ans] || ans;
	box.appendChild(v);
	/* an answered tool call joins its turn's row, so the rest of the turn lands in that row too */
	if (box.tool && work && box.parentNode === log && box.previousElementSibling === work.el) work.body.appendChild(box);
}

/* ---------- provider picker ----------
   Reads /api/providers. The old version scraped the printed `:providers` table,
   whose rows are columns of prose — the scrape matched nothing, so the picker
   always came up empty while typing a name by hand worked fine. */
async function openProviderPicker(onPicked, only) {
	const m = modal(only === 'oauth' ? 'sign in' : only === 'key' ? 'API key' : 'provider');
	m.body.appendChild(Object.assign(document.createElement('div'),
		{ className: 'note', textContent: 'loading…' }));
	let j = { providers: [] };
	try { j = await (await fetch('/api/providers')).json(); } catch (e) {}
	m.body.textContent = '';

	const groups = [['signed in', (p) => p.saved],
	                ['local — no account', (p) => !p.saved && p.kind === 'local'],
	                ['sign in', (p) => !p.saved && p.kind === 'oauth'],
	                ['api key', (p) => !p.saved && p.kind === 'key']];

	let shown = 0;
	groups.forEach(([label, filter]) => {
		const rows = (j.providers || []).filter((p) => (!only || p.kind === only) && filter(p));
		if (!rows.length) return;
		shown += rows.length;
		m.body.appendChild(groupLabel(label));
		rows.forEach((p) => m.body.appendChild(optionRow(
			p.name, p.desc, p.saved ? 'ready' : (p.kind === 'oauth' ? 'login' : ''),
			async () => {
				m.close();
				state.provider = p.name; state.model = ''; renderMeta();
				await post('/api/slash', ':provider ' + p.name);
				/* Not signed in yet? The next thing you need is the login, so run it. */
				if (!p.saved && p.kind !== 'local') await post('/api/slash', ':login ' + p.name);
				/* Switching fetches the provider's catalog, which takes seconds. A
				   fixed delay raced it and the model list arrived for the provider
				   we just left. Wait for the agent to say it has moved. */
				await settledOnProvider(p.name);
				if (onPicked) onPicked();
			}, p.active)));
	});

	if (!shown) m.body.appendChild(Object.assign(document.createElement('div'), { className: 'note',
		textContent: only === 'oauth' ? 'signing in needs hako running on a computer (hako --serve). here, :login api takes a key.'
		                              : 'no providers returned' }));
	const g = document.createElement('div'); g.className = 'grow';
	m.foot.append(g, mb('cancel', '', m.close));
}

/* The agent is the authority on which provider is live; poll until it agrees,
   or give up and let the caller show whatever is current. */
async function settledOnProvider(name, ms = 12000) {
	const want = String(name || '').replace(/-api$/, '');
	const until = Date.now() + ms;
	while (Date.now() < until) {
		try {
			const j = await (await fetch('/api/state')).json();
			if (j.provider && (j.provider === want || j.provider === name)) {
				state.provider = j.provider;
				state.model = j.model || '';
				renderMeta();
				return true;
			}
		} catch (e) { /* keep waiting */ }
		await new Promise((r) => setTimeout(r, 350));
	}
	return false;
}

/* ---------- model picker ---------- */
function setModel(id, localModel) {
	/* Provider first: switching providers resets the model in hako. */
	if (localModel && state.provider !== 'mithraeum') {
		post('/api/slash', ':provider mithraeum');
		state.provider = 'mithraeum';
	}
	post('/api/slash', ':model ' + id);
	state.model = id;                 /* optimistic — hako emits no state event */
	renderMeta();
}
async function openModelPicker() {
	/* No provider means the model list is meaningless — ask the question that
	   actually needs answering first, then come back here. */
	if (!state.provider || state.provider === 'none') {
		openProviderPicker(() => openModelPicker());
		return;
	}

	const m = modal('model · ' + state.provider);
	m.body.appendChild(Object.assign(document.createElement('div'),
		{ className: 'note', textContent: 'loading…' }));
	let j = { installed: [], found: [], known: [], catalog: [] };
	const q = '/api/models?search=' + encodeURIComponent(settings.modelPaths.join(','));
	try {
		j = await (await fetch(q)).json();
		/* The answer says which provider it is for. If that is not the one we are
		   on, the switch was still in flight — ask again rather than list another
		   provider's models under this provider's heading. */
		if (j.provider && state.provider && j.provider !== state.provider) {
			await settledOnProvider(state.provider, 8000);
			j = await (await fetch(q)).json();
		}
	} catch (e) {}
	m.body.textContent = '';

	const local = state.provider === 'mithraeum';

	/* The provider you are on decides what is offered first. Everything else is
	   noise you have to scroll past. */
	if (!local && (j.catalog || []).length) {
		m.body.appendChild(groupLabel(state.provider + ' models'));
		j.catalog.forEach((id) => m.body.appendChild(
			optionRow(id, '', '', () => { m.close(); setModel(id, false); }, id === state.model)));
	}

	if (local || (j.installed || []).length) {
		const installed = j.installed || [];
		if (installed.length) {
			m.body.appendChild(groupLabel(local ? 'installed' : 'on this machine — switches to mithraeum'));
			installed.forEach((x) => m.body.appendChild(
				optionRow(x.id, fmtGB(x.bytes), 'ready',
					() => { m.close(); setModel(x.id, true); }, x.id === state.model)));
		}

		const installedIds = new Set(installed.map((x) => x.id));
		const found = (j.found || []).filter((x) => !installedIds.has(x.id));
		if (found.length) {
			m.body.appendChild(groupLabel('found on this device — link to use'));
			found.forEach((x) => m.body.appendChild(
				optionRow(x.id, x.path, 'link', async () => {
					m.close();
					add('turn system', '', 'linking ' + x.id + ' from ' + x.path);
					const r = await post('/api/link', x.path);
					if (r && r.ok) setModel(x.id, true);
					else add('turn error', '', 'could not link ' + x.path);
				})));
		}

		const missing = (j.known || []).filter((id) => !installedIds.has(id) && !found.some((f) => f.id === id));
		if (missing.length) {
			m.body.appendChild(groupLabel('available to download'));
			missing.forEach((id) => m.body.appendChild(
				optionRow(id, 'from huggingface.co/mithraeum', 'pull', () => {
					m.close();
					add('turn system', '', 'downloading ' + id + ' — multi-GB, runs on the machine hosting hako.');
					post('/api/slash', ':pull ' + id);
				})));
		}
	}

	if (!m.body.children.length)
		m.body.appendChild(Object.assign(document.createElement('div'),
			{ className: 'note', textContent: 'no models listed for ' + state.provider + ' — type one below' }));

	const inp = document.createElement('input');
	inp.placeholder = 'or type a model id';
	inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
	inp.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && inp.value.trim()) { m.close(); setModel(inp.value.trim(), local); }
	});
	const g = document.createElement('div'); g.className = 'grow'; g.appendChild(inp);
	m.foot.append(g, mb('provider', '', () => { m.close(); openProviderPicker(() => openModelPicker()); }),
	              mb('close', '', m.close));
}

/* ---------- attachments ----------
   Chips carry PATHS, not bytes: the agent already has the filesystem, so it only
   needs to be told where to look. Sent as a trailing line, which reads naturally
   in the transcript and gives the model something it can act on. */
const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                     : n >= 1024    ? Math.round(n / 1024) + ' KB' : n + ' B';

/* Two kinds of attachment: a PATH already on the machine (nothing to transfer),
   and a FILE picked off this device, which is held here and only uploaded when
   you actually send. Removing a chip therefore leaves nothing behind — uploading
   on pick meant a file you changed your mind about was already in the project. */
const attached = [];
function renderTray() {
	tray.textContent = '';
	tray.hidden = !attached.length;
	attached.forEach((a, i) => {
		const chip = document.createElement('span');
		chip.className = 'chip';
		const nm = document.createElement('span');
		nm.className = 'nm';
		const img = a.file && isImage(a.file) && caps.has('image');
		nm.textContent = (img ? '▣ ' : a.file ? '↑ ' : '') + a.name.split('/').pop();
		nm.title = img ? a.name + ' — the model sees it with your message' : a.file ? a.name + ' — uploads when you send' : a.name;
		const rm = document.createElement('button');
		rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×';
		rm.title = 'remove';
		rm.addEventListener('click', () => { attached.splice(i, 1); renderTray(); });
		chip.append(nm, rm);
		tray.appendChild(chip);
	});
}
function attach(name, file) {
	if (!attached.some((a) => a.name === name && !!a.file === !!file)) attached.push({ name, file });
	renderTray();
	input.focus();
}

const isImage = (f) => /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp|heic)$/i.test(f.name);
/* A phone photo is 3 to 12 MB; providers scale anything past 1568 px down anyway. */
async function shrinkImage(file) {
	if (file.size < 1.5e6 && /^image\/(png|jpeg|gif|webp)$/.test(file.type)) return file;
	const bmp = await createImageBitmap(file);
	const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
	const c = document.createElement('canvas');
	c.width = Math.max(1, Math.round(bmp.width * s));
	c.height = Math.max(1, Math.round(bmp.height * s));
	c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
	if (bmp.close) bmp.close();
	return new Promise((ok, no) => c.toBlob((b) => (b ? ok(b) : no(new Error('could not shrink it'))), 'image/jpeg', 0.85));
}

/* Upload anything picked off the device, then hand back every path to mention
   and every [image #N] the core gave an image. */
async function flushAttachments() {
	const paths = [], marks = [];
	for (const a of attached) {
		if (!a.file) { paths.push(a.name); continue; }
		if (isImage(a.file)) {
			if (!caps.has('image')) { add('turn error', '', a.name + ': images reach the agent in a code session or hako --serve, not this browser’s own agent yet'); continue; }
			try {
				const r = await fetch('/api/image', { method: 'POST', body: await shrinkImage(a.file) });
				const j = await r.json();
				if (j.ok) marks.push(j.marker);
				else add('turn error', '', a.name + ' not attached: ' + (j.error || 'no answer'));
			} catch (e) { add('turn error', '', a.name + ' not attached: ' + e.message); }
			continue;
		}
		if (!caps.has('upload')) { add('turn error', '', 'this agent cannot accept uploads'); continue; }
		add('turn system', '', 'sending ' + a.name + ' (' + fmtSize(a.file.size) + ') …');
		try {
			const r = await fetch('/api/upload?name=' + encodeURIComponent(a.name), { method: 'POST', body: a.file });
			const j = await r.json();
			if (j.ok) paths.push(a.name);
			else add('turn error', '', 'could not send ' + a.name);
		} catch (e) { add('turn error', '', 'could not send ' + a.name + ': ' + e.message); }
	}
	attached.length = 0;
	renderTray();
	return { paths, marks };
}

/* A file the agent wrote is only useful if it can leave. The browser's download
   is the one exit every platform has, including iOS, where it lands in Files. */
async function saveOut(path, name) {
	const r = await fetch('/api/file?path=' + encodeURIComponent(path));
	if (!r.ok) return;
	const blob = new Blob([await r.text()], { type: 'application/octet-stream' });
	const url = URL.createObjectURL(blob);
	const a = document.createElement('a');
	a.href = url;
	a.download = name;
	document.body.appendChild(a);
	a.click();
	a.remove();
	setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* ---------- folder picker ---------- */
/* Said once, before anything is typed. Where the work lives is the first thing
   a person needs to know about this build, not something to discover when it
   disappears. */
function browserNotice() {
	if (!isWasmNow() || settings.browser_notice || LINK || PAIR || INVITE || SSO_BACK || HASH === '#signin') return;
	const m = modal('this runs in your browser');

		'The agent runs on <b>this device</b>. Nothing is sent to a server of ours — '
		+ 'your key goes straight to the model provider, and your files never leave here.'

		+ '<b>Work is kept in this browser\u2019s storage.</b> Clearing site data, or '

function consentNotice(onOk) {

	const m = modal('before you open a folder');

		'<b>The agent gets read and write access to the folder you choose.</b> It can create, ' +
		'modify and delete files there, and every one of those actions asks your permission first ' +
		'unless you pick “always”.<br><br>' +
		'<b>Nothing is stored by us.</b> There is no account and no server holding your data. ' +
		'Your files stay on this machine. Conversations and settings are written to ' +
		'<code>~/.hako/</code> and your browser’s local storage on this device — the same ' +
		'files the hako CLI uses, which is why sessions are shared between them.<br><br>' +
		'What you send to a <b>cloud</b> model does go to that provider, using your own API key.';
	m.body.appendChild(n);
	m.foot.append(document.createElement('div'), mb('cancel', '', m.close), mb('understood', 'primary', () => {
		settings.consented = true; saveSettings(); m.close(); onOk();
	}));

}

/* One browser for both jobs. Two modals listing the same directory — one showing
   folders, one showing files, different buttons — was the jankiest thing here.
   Now: walk anywhere, tap a file to attach it, open the folder as the project,
   or pull a file off the device you are holding. */
async function openBrowser() {
	/* a code session lives in its folder: its files, never another folder */
	const inSession = !!REMOTE_ID;
	const m = modal(inSession ? 'files' : 'choose a working folder');
	/* A directory picker is a navigation surface, not a menu — give it the whole
	   screen so a deep path is browsable with a thumb. */
	m.box.classList.add('sheet');
	let path = state.dir || '.';

	const openBtn = mb('open this folder', 'primary', () => consentNotice(async () => {
		m.close();
		clearLog();
		add('turn system', '', 'opening ' + path + ' …');
		await post('/api/open', path);
		state.session = '';
		await loadSessions();
	}));

	/* Tapping "../" repeatedly to climb four levels is the worst part of a picker
	   on a phone. Crumbs make every ancestor one tap away. */
	const crumbs = document.createElement('div');
	crumbs.className = 'crumbs';

	const drawCrumbs = () => {
		crumbs.textContent = '';
		const seg = path.split('/').filter(Boolean);
		const mk = (label, target) => {
			const b = document.createElement('button');
			b.type = 'button';
			b.className = 'crumb';
			b.textContent = label;
			b.addEventListener('click', () => draw(target));
			return b;
		};
		crumbs.appendChild(mk('/', '/'));
		let acc = '';
		seg.forEach((sgm) => {
			acc += '/' + sgm;
			crumbs.appendChild(mk(sgm, acc));
		});
	};

	const draw = async (p) => {
		if (isWasmNow() && !state.folder && !state.dir) {
			m.body.textContent = '';
			m.title.textContent = 'no folder open';
			const remembered = window.hakoPendingFolder && window.hakoPendingFolder();
			if (remembered) {
				m.body.appendChild(optionRow(remembered, 'reconnect', '', async () => {
					if (await window.hakoReconnectFolder()) { m.close(); await refreshState(); }
					else draw(p);
				}));
			}
			const n = document.createElement('div');
			n.className = 'note';
			n.innerHTML = caps.has('pickfolder')
				? 'Choose any folder on this machine to work in — a repo, notes, a '
				  + 'scratch directory, a synced folder. The agent reads and writes those '
				  + 'files in place, and nothing is copied anywhere else.'
				: 'This web instance of hako studio runs entirely in your browser, and '
				  + 'uses your browser\u2019s storage to keep your settings, your sessions '
				  + 'and the files the agent writes.<br><br>'
				  + 'Its working directory is <code>' + (state.dir || '/workspace').replace(/[&<>"']/g, (c) => '&#' + c.charCodeAt(0) + ';') + '</code> '
				  + '\u2014 a folder inside that storage, not a folder on your device. It will '
				  + 'not appear in Files, and clearing this site\u2019s data erases it. Save '
				  + 'anything you want to keep from the files list.<br><br>'
				  + 'Opening a real folder on your device needs an API your browser does not '
				  + 'provide; Chromium-based browsers on desktop do. For real folders here, '
				  + 'run <code>hako --serve</code> on a machine and open that address.';
			m.body.appendChild(n);
			m.foot.querySelectorAll('button').forEach((b) => {
				if (!/choose folder|close/.test(b.textContent)) b.style.display = 'none';
			});
			return;
		}
		let j;
		try {
			const r = await fetch('/api/dirs?path=' + encodeURIComponent(p));
			j = await r.json();
		} catch (e) {
			m.body.textContent = '';
			m.body.appendChild(Object.assign(document.createElement('div'),
				{ className: 'note', textContent: 'cannot read ' + p }));
			return;
		}
		path = j.path || p;
		m.title.textContent = path;
		m.body.textContent = '';
		drawCrumbs();
		m.body.appendChild(crumbs);

		/* One tap to the folders people actually use. iCloud Drive's real path is
		   unmemorable, which made it the hardest folder on the machine to open. */
		if ((state.places || []).length) {
			const row = document.createElement('div');
			row.className = 'crumbs places';
			state.places.forEach((pl) => {
				const b = document.createElement('button');
				b.type = 'button';
				b.className = 'crumb place';
				b.textContent = pl.label;
				b.addEventListener('click', () => draw(pl.path));
				row.appendChild(b);
			});
			m.body.appendChild(row);
		}

		/* Quiet, but always there: people need to know where this lives, and the
		   one-time notice at first run is long forgotten by now. */
		if (isWasmNow() && !state.folder) {
			const w = document.createElement('div');
			w.className = 'note';
			w.style.opacity = '.72';
			w.style.fontSize = '.78rem';
			w.textContent = 'Stored in this browser on this device \u2014 not in Files, and not on any server. '
			              + 'Clearing site data erases it. Save files out from the sidebar to keep them.';
			m.body.appendChild(w);
		}

		openBtn.textContent = (path === state.dir) ? 'current project' : 'open this folder';
		openBtn.disabled = (path === state.dir);
		if (inSession) m.title.textContent = 'files \u00b7 ' + (path.split('/').filter(Boolean).pop() || path);

		const dirs = (j.dirs || []).sort();
		const files = (j.files || []).sort((a, b) => a.name.localeCompare(b.name));

		const floor = state.root || '/';
		if (path !== floor && path !== '/') m.body.appendChild(optionRow('../', '', '',
			() => {
				const up = path.replace(/\/[^/]+$/, '') || '/';
				draw(up.startsWith(floor) ? up : floor);
			}));

		const removable = isWasmNow() && !state.folder;
		const withRemove = (row, full, label) => {
			if (!removable) return row;
			const wrap = document.createElement('div');
			wrap.className = 'sessrow';
			wrap.appendChild(row);
			const x = document.createElement('button');
			x.className = 'act del';
			x.textContent = '×';
			x.title = 'delete ' + label;
			x.addEventListener('click', async (e) => {
				e.stopPropagation();
				if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
				await post('/api/file/delete', full);
				draw(path);
				loadFiles();
			});
			wrap.appendChild(x);
			return wrap;
		};

		dirs.forEach((d) => {
			const full = (path === '/' ? '' : path) + '/' + d;
			const row = optionRow(d + '/', '', '', () => draw(full));
			m.body.appendChild(withRemove(row, full, d + '/'));
		});

		if (!dirs.length) m.body.appendChild(Object.assign(document.createElement('div'),
			{ className: 'note', textContent: 'no subfolders here' }));

		if (files.length) {
			m.body.appendChild(groupLabel(files.length + ' file' + (files.length === 1 ? '' : 's') + ' here'));
			const savable = isWasmNow() && !state.folder && caps.has('save');
			files.slice(0, 40).forEach((f) => {
				const full = (path === '/' ? '' : path) + '/' + f.name;
				/* on a computer the file is already where the agent can read it: a tap names it in the next message */
				const rel = state.dir && full.startsWith(state.dir.replace(/\/$/, '') + '/') ? full.slice(state.dir.replace(/\/$/, '').length + 1) : full;
				const row = optionRow(f.name, fmtSize(f.bytes), savable ? 'save' : 'add',
					savable ? () => saveOut(full, f.name) : () => { m.close(); attach(rel); });
				m.body.appendChild(withRemove(row, full, f.name));
			});
			if (files.length > 40) m.body.appendChild(Object.assign(document.createElement('div'),
				{ className: 'note', textContent: '… and ' + (files.length - 40) + ' more' }));
		}
	};

	const inp = document.createElement('input');
	inp.placeholder = caps.has('mkdir') ? 'a folder path, or a name to create' : 'or paste a folder path';
	inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
	inp.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && inp.value.trim()) draw(inp.value.trim().replace(/^~/, state.home || '~'));
	});
	const g = document.createElement('div'); g.className = 'grow'; g.appendChild(inp);

	/* Native folder dialogs, in order of what the browser actually allows:

	   1. showDirectoryPicker() — Chromium desktop only. Returns a HANDLE: folder
	      name and contents, never a path. Firefox refuses to ship it; Safari does
	      not implement it on any platform.
	   2. <input webkitdirectory> — desktop Safari and Firefox. Prompts with the
	      real OS folder dialog, then hands over a flat list of the files inside.
	      We ignore the files entirely and read webkitRelativePath for the folder
	      name — the upload never happens.

	   Either way the browser refuses to disclose a path, so the server resolves
	   name + one child to a real directory. On phones neither exists and no
	   button is shown. */
	const resolveFolder = async (folderName, child) => {
		m.body.textContent = '';
		m.body.appendChild(Object.assign(document.createElement('div'), { className: 'note',
			textContent: 'locating "' + folderName + '" on the machine running hako…' }));
		let j = { candidates: [] };
		try {
			j = await (await fetch('/api/find?name=' + encodeURIComponent(folderName) +
			                       '&child=' + encodeURIComponent(child || ''))).json();
		} catch (e) {}
		const hits = j.candidates || [];
		if (hits.length === 1) { draw(hits[0]); return; }
		m.body.textContent = '';
		m.body.appendChild(crumbs);
		if (!hits.length) {
			m.body.appendChild(Object.assign(document.createElement('div'), { className: 'note',
				textContent: '"' + folderName + '" was not found on the machine running hako. ' +
				             'If the agent runs on another computer, browse to the folder there instead.' }));
		} else {
			m.body.appendChild(groupLabel('which "' + folderName + '"?'));
			hits.forEach((h) => m.body.appendChild(optionRow(h, '', '', () => draw(h))));
		}
	};

	let sysBtn = null;
	if (isWasmNow()) {
		if (caps.has('pickfolder')) {
			sysBtn = mb('choose folder…', '', async () => {
				let handle;
				try { handle = await window.showDirectoryPicker({ mode: 'readwrite' }); }
				catch (e) { return; }
				m.body.textContent = '';
				m.body.appendChild(Object.assign(document.createElement('div'),
					{ className: 'note', textContent: 'reading ' + handle.name + '…' }));
				const ok = await window.hakoMountFolder(handle);
				if (ok) { m.close(); await refreshState(); }
				else m.body.appendChild(Object.assign(document.createElement('div'),
					{ className: 'note', textContent: 'could not open that folder' }));
			});
		}
	} else if (!caps.has('find')) {
		/* a remote device: hako keeps it inside the project, so no picker */
	} else if (window.showDirectoryPicker) {
		sysBtn = mb('system picker…', '', async () => {
			let handle;
			try { handle = await window.showDirectoryPicker(); } catch (e) { return; }
			let child = '';
			try { for await (const [nm] of handle.entries()) { child = nm; break; } } catch (e) {}
			resolveFolder(handle.name, child);
		});
	} else if ('webkitdirectory' in document.createElement('input')
	           && window.matchMedia('(hover: hover)').matches) {
		const dirInput = document.createElement('input');
		dirInput.type = 'file';
		dirInput.webkitdirectory = true;
		dirInput.multiple = true;
		dirInput.style.display = 'none';
		dirInput.addEventListener('change', () => {
			const f = (dirInput.files || [])[0];
			dirInput.value = '';
			if (!f) return;
			const rel = (f.webkitRelativePath || '').split('/');
			if (rel.length < 2) return;
			resolveFolder(rel[0], rel[1]);      /* nothing is uploaded — names only */
		});
		m.body.appendChild(dirInput);
		sysBtn = mb('system picker…', '', () => dirInput.click());
	}

	const mkdirBtn = caps.has('mkdir') ? mb('new folder', '', async () => {
		const name = (inp.value || '').trim().replace(/^\/+|\/+$/g, '');
		if (!name) { inp.placeholder = 'name the folder, then press new folder'; inp.focus(); return; }
		const target = (path === '/' ? '' : path) + '/' + name;
		const r = await post('/api/mkdir', target);
		inp.value = '';
		if (r && r.ok) draw(target); else inp.placeholder = 'could not create that folder';
	}) : null;

	const foot = [g];
	if (sysBtn) foot.push(sysBtn);
	if (mkdirBtn) foot.push(mkdirBtn);
	foot.push(mb('home', '', () => draw(state.home || '~')), mb('close', '', m.close));
	if (!inSession) foot.push(openBtn);
	m.foot.append(...foot);
	await draw(path);
}

/* ---------- settings ---------- */
let settingsTab = 'look';
function openSettings() {
	const m = modal('settings');
	m.box.classList.add('settings');      /* one height for every tab, so switching never jumps */
	/* three tabs, so nothing needs a long scroll: how it looks, the agent, what is kept */
	const panes = { look: document.createElement('div'), hako: document.createElement('div'), data: document.createElement('div') };
	m.body.appendChild(segRow([['look', 'look'], ['hako', 'hako'], ['data', 'your data']], settingsTab, (k) => {
		settingsTab = k;
		for (const [n, el] of Object.entries(panes)) el.hidden = n !== k;
		m.body.scrollTop = 0;
	}));
	m.body.lastChild.classList.add('stabs');
	for (const [n, el] of Object.entries(panes)) { el.className = 'spane'; el.dataset.pane = n; el.hidden = n !== settingsTab; m.body.appendChild(el); }
	let pane = panes.hako;

	pane.appendChild(groupLabel('model'));
	pane.appendChild(optionRow(state.model || '(none)', 'change', '', () => {
		m.close(); openModelPicker();
	}));
	pane.appendChild(optionRow(state.provider || '(none)', 'provider', '', () => {
		m.close(); openProviderPicker();
	}));

	pane = panes.look;
	/* Tapping through themes previews them; closing settings keeps the last one,
	   says so in the status line, and (under --serve) keeps the CLI in step. */
	pane.appendChild(groupLabel('theme'));
	const themeWas = themeShown;
	m.onclose = () => {
		if (themeShown === themeWas) return;
		if (!HAKO_WASM_MODE) post('/api/theme', settings.theme);
		flashStatus('theme: ' + settings.theme);
	};
	/* mithraeum first (the default), terminal, then the presets, then the rc's own theme if it is a custom one;
	   a grid of small previews, each in its own colors, so twenty fit on a phone's screen */
	const names = themeNames();
	if (state.theme && !names.includes(state.theme) && state.theme_slots) names.push(state.theme);
	const tiles = document.createElement('div');
	tiles.className = 'tiles';
	names.forEach((name) => {
		const t = themeVars(name, name === state.theme ? state.theme_slots : null);
		const b = document.createElement('button');
		b.type = 'button'; b.className = 'tile' + (themeShown === name ? ' sel' : ''); b.dataset.theme = name;
		b.title = name === 'mithraeum' ? 'paper by day, night in the dark' : name === 'terminal' ? 'plain black and white' : name;
		const pv = document.createElement('span');
		pv.className = 'pv'; pv.style.background = t.bg; pv.style.color = t.bone;
		pv.append(Object.assign(document.createElement('b'), { textContent: 'Aa' }));
		for (const k of ['gold', 'phos']) { const sw = document.createElement('span'); sw.className = 'swatch'; sw.style.background = t[k]; pv.appendChild(sw); }
		b.append(pv, Object.assign(document.createElement('span'), { className: 'nm', textContent: name }));
		b.addEventListener('click', () => {

/* ---------- resume ----------
   `:resume` reloads the conversation into hako's context but replays nothing to
   the front end, so the pane would come back empty. Render the stored transcript
   ourselves — it's the same jsonl the CLI reads. */
/* Stored transcripts predate the dialect repair (and always contain whatever the
   model actually emitted), so clean them for display only — the file on disk is
   never rewritten. */
/* Turn a stored assistant message into the same shapes the live stream produces:
   prose as prose, tool calls as chips. A transcript that shows raw XML while the
   live view shows chips reads like two different apps. */
function replayAssistant(raw) {
	const text = String(raw || '');
	const calls = [];
	const subjectOf = (body) => {
		const json = body.match(/"(?:path|file_path|command|script|dir|directory)"\s*:\s*"([^"]*)"/);
		if (json) return json[1];
		const param = body.match(/<parameter name="(?:path|dir|command)">([\s\S]*?)<\/parameter>/);
		return param ? param[1].trim() : '';
	};

	/* Three dialects reach the transcript: the correct <tool name="x">, the
	   near-miss <tool_name="x"> from before the normalizer, and Qwen's
	   <tool_call>{"name":…,"arguments":…}</tool_call>. All render as one chip. */
	const tagged = /<tool(?:_name="|\s+name=")([a-z_]+)"\s*>([\s\S]*?)<\/tool(?:_name)?>/gi;
	let mm;
	while ((mm = tagged.exec(text)) !== null)
		calls.push({ name: mm[1], subject: subjectOf(mm[2]) });

	const called = /<tool_call>([\s\S]*?)<\/tool_call>/gi;
	while ((mm = called.exec(text)) !== null) {
		const nm = mm[1].match(/"name"\s*:\s*"([^"]*)"/);
		calls.push({ name: nm ? nm[1] : 'tool', subject: subjectOf(mm[1]) });
	}

	/* Claude's own XML: <function_calls><invoke name="x"><parameter …> */
	const invoked = /<invoke name="([^"]+)">([\s\S]*?)<\/invoke>/gi;
	while ((mm = invoked.exec(text)) !== null)
		calls.push({ name: mm[1], subject: subjectOf(mm[2]) });
	return { prose: stripTools(text), calls };
}

function stripTools(text) {
	return String(text)
		.replace(/<observation[^>]*>[\s\S]*?<\/observation>/g, '')
		.replace(/<tool_call>[\s\S]*?<\/tool_call>/g, '')
		.replace(/<tool_name=[^>]*>[\s\S]*?<\/tool_name>/g, '')
		.replace(/<tool\b[^>]*>[\s\S]*?<\/tool>/g, '')
		.replace(/<write_file[^>]*>[\s\S]*?<\/write_file>/g, '')
		.replace(/<parameter[^>]*>[\s\S]*?<\/parameter>/g, '')
		.replace(/<\/?(invoke|function_calls|tool_call|tool_name|tool)[^>]*>/g, '')
		/* A response cut off mid-call leaves an unterminated block. Every rule
		   above needs a closing tag, so without this the truncated tail — and
		   everything after it — renders as raw markup. */
		.replace(/<(?:function_calls|invoke|tool_call|tool_name|tool|parameter|observation|write_file)\b[\s\S]*$/, '')
		.replace(/\n{3,}/g, '\n\n')
		.trim();
}

async function renderHistory(id) {
	try {
		const r = await fetch('/api/history?id=' + encodeURIComponent(id));
		const j = await r.json();
		(j.messages || []).forEach((msg) => {
			if (msg.role === 'user') {
				if (msg.content) { add('turn user', 'you', msg.content); if (!/^[:/]/.test(msg.content)) hist.push(msg.content); }
				return;
			}
			if (msg.role === 'assistant') {
				/* Same shapes the live stream produces: chips for calls, prose for
				   prose. A transcript that shows raw XML while the live view shows
				   chips reads like two different applications. */
				const { prose, calls } = replayAssistant(msg.content);
				calls.forEach((c) => add('tool', '', '→ ' + c.name + '(' + (c.subject || '') + ')'));
				if (prose) addModel(prose);
				return;
			}
			if (msg.role === 'tool') {
				/* Same chip the live stream draws, so a reloaded transcript shows
				   the work and not just the conclusion. */
				if (msg.content) add('tool', '', '→ ' + msg.content);
				return;
			}
			if (msg.content) add('turn system', '', msg.content);
		});
		if ((j.messages || []).length) {
			const sep = add('turn system', '', '── end of saved history ──');
			sep.style.color = 'var(--faint)';
		}

	} catch (e) { add('turn error', '', 'could not load history for ' + id); }
}

function when(ts) {

	return d.toLocaleDateString([], { month: 'short', day: 'numeric' });

const RECENT_N = 12;
const searchQuery = () => { const box = $('search'); return box && !$('searchbox').hidden ? (box.value || '').trim().toLowerCase() : ''; };

/* ---------- quiet commands ----------

   the answer shows in the status line for a moment. */

/* ---------- read aloud ----------
   The browser's own speech (speechSynthesis), and only a voice that runs on this
   device (localService): the text never leaves it. Code blocks are skipped. */
const voice = {

	btn: null,
	on() { return this.ok && (!!settings.voice || state.voice === 1); },
	async voices() {
		let vs = speechSynthesis.getVoices() || [];
		if (!vs.length) {            /* Chrome fills the list a moment after load */
			await new Promise((r) => { speechSynthesis.addEventListener('voiceschanged', r, { once: true }); setTimeout(r, 1200); });
			vs = speechSynthesis.getVoices() || [];

		const local = vs.filter((v) => v.localService);
		const lang = (navigator.language || 'en-US').toLowerCase(), base = lang.split('-')[0];
		const by = (l) => l.find((v) => (v.lang || '').toLowerCase() === lang) || l.find((v) => (v.lang || '').toLowerCase().startsWith(base));
		return by(local) || local.find((v) => v.default) || local[0] || null;
	},
	text(raw) {
		return String(raw)
			.replace(/```[\s\S]*?(```|$)/g, ' ')            /* code blocks: skipped */
			.replace(/<(tool|write_file|tool_call)\b[\s\S]*?(<\/\1>|$)/g, ' ')
			.replace(/`([^`\n]*)`/g, '$1')

			.replace(/^\s*(#+|>|[-*+]|\d+\.)\s+/gm, '')

	chunks(t) {

			let cur = '';
			for (const s of para.match(/[^.!?;:]+[.!?;:]*\s*/g) || [para]) {
				if ((cur + s).length > 220 && cur) { out.push(cur.trim()); cur = ''; }
				cur += s;
			}

		}
		return out.filter(Boolean);
	},
	async speak(raw, btn) {
		if (!this.ok) return;
		this.stop();
		const parts = this.chunks(this.text(raw));
		if (!parts.length) return;
		this.mark(btn);
		const vs = await this.voices();
		if (this.btn !== (btn || null)) return;           /* stopped while the voices loaded */
		const v = this.pick(vs);
		if (!v && vs.length) { this.done(); flashStatus('no on-device voice in this browser'); return; }

			const u = new SpeechSynthesisUtterance(p);

	},
	mark(btn) {
		this.btn = btn || null;
		if (btn) { btn.classList.add('on'); btn.innerHTML = ICO.stop; btn.title = 'stop reading'; }
	},
	stop() {
		if (!this.ok) return;
		try { speechSynthesis.cancel(); } catch (e) {}
		this.done();
	},
	done() {
		const b = this.btn;
		this.btn = null;
		if (b) { b.classList.remove('on'); b.innerHTML = ICO.speak; b.title = 'read aloud'; }
	},
};

	if (!voice.ok || !el || !el.querySelector) return;

   the screen put the sheets' buttons and the composer out of sight.
   With the keyboard up iOS also lets the DOCUMENT scroll (a swipe on the chat
   that ran past its end, or on the header), and the fixed page did not follow:
   the bar went to the top with a keyboard's height of blank under it. So the
   document never scrolls (any scroll is undone at once), a swipe outside the
   scrolling parts does nothing, and every change re-pans. */
if (window.visualViewport) {
	const vv = window.visualViewport;
	document.body.classList.toggle('app', navigator.standalone === true);
	const isOpen = () => vv.height < window.innerHeight - 80;
	/* How far a fixed layer really reaches: on iOS 26 the window can claim the whole
	   screen while fixed layers stop short, which hid the composer once. */
	const reach = () => {
		const p = document.createElement('div');
		p.style.cssText = 'position:fixed;top:0;bottom:0;visibility:hidden';
		document.body.appendChild(p);
		const h = p.getBoundingClientRect().height;
		p.remove();
		return h;
	};
	const pan = () => {
		if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
		document.documentElement.style.setProperty('--vt', (isOpen() ? vv.offsetTop : 0) + 'px');
	};
	const sync = () => {
		const open = isOpen();
		document.documentElement.style.setProperty('--vh', (open ? vv.height : Math.min(window.innerHeight, reach())) + 'px');
		pan();
		document.body.classList.toggle('kb', open);
		if (open && !landing) log.scrollTop = log.scrollHeight;
	};
	vv.addEventListener('resize', sync);
	vv.addEventListener('scroll', pan);
	window.addEventListener('resize', sync);
	window.addEventListener('scroll', pan, { passive: true });
	/* A swipe that starts outside anything that scrolls would move the page itself. */
	const SCROLLS = '#log, .recents, .modal .body, .cmdmenu, .below, textarea, .tool.result, .hello';
	document.addEventListener('touchmove', (e) => {
		const t = e.target && e.target.closest ? e.target.closest(SCROLLS) : null;
		if (!t && document.body.classList.contains('kb')) e.preventDefault();
	}, { passive: false });
	sync();
}
input.addEventListener('focus', () => setTimeout(() => { if (!landing) log.scrollTop = log.scrollHeight; }, 250));

handshake().then(() => { loadSessions(); loadAgents(true); browserNotice(); });
renderChrome();
window.hakoAccount.boot();
</script>
</body>
