		if (!relay.acct && !invited) btn('request access', () => {
			location.href = 'mailto:contact@mithraeum.studio?subject=' + encodeURIComponent('hako code access') +
				'&body=' + encodeURIComponent('i would like to try code sessions in hako studio.');
		});
		const g = document.createElement('span'); g.className = 'grow'; m.foot.appendChild(g);
		btn('close', m.close);
	},
	/* Hosted, the menu always offers chat · code and, at its foot, sign in (or
	   who is signed in). New accounts still need an invite (#invite=); a computer
	   sends people here with #link= or #signin, a session is #remote=. */
	async boot() {
		if (!HAKO_WASM_MODE) return;
		/* chat is this browser's own agent; code is a session on one of your computers */
		$('mode-chat').classList.toggle('on', !REMOTE_ID);
		$('mode-code').classList.toggle('on', !!REMOTE_ID);
		const go = (id) => { location.hash = '#remote=' + id; location.reload(); };
		const pick = (code) => { $('mode-chat').classList.toggle('on', !code); $('mode-code').classList.toggle('on', code); };
		/* the open code sessions (each a shared folder), right in the menu */
		const row = (label, sub, cls, fn) => {
			const b = document.createElement('button');
			b.className = 'sess' + cls;
			b.textContent = label;
			if (sub) b.appendChild(Object.assign(document.createElement('span'), { className: 'when', textContent: sub }));
			b.addEventListener('click', fn);
			return b;
		};
		const projects = async () => {
			const list = await codeSessions(), el = $('project-list');
			el.textContent = '';
			for (const c of list) el.appendChild(row(c.name, c.host, ' k-code' + (c.id === REMOTE_ID ? ' cur' : ''), () => { closeNav(); if (c.id !== REMOTE_ID) go(c.id); }));
			el.appendChild(row('+ add a device', '', '', () => { closeNav(); this.addDevice(); }));
			$('projects').hidden = false;
		};
		/* signed in, chat shows both, code sessions above this browser's chats; code shows
		   code only (inside a session, that folder's chats are code too) */
		const show = async (code) => {
			pick(code);
			$('here').hidden = code && !REMOTE_ID;
			if (code) return projects();
			if (!(await kvGet('k'))) { $('projects').hidden = true; return; }
			try { await relay.signIn(); await projects(); } catch (e) { $('projects').hidden = true; }
		};
		this.show = show;
		$('mode-chat').addEventListener('click', () => {
			if (REMOTE_ID) { location.hash = ''; location.reload(); return; }
			show(false);
		});
		$('mode-code').addEventListener('click', async () => {
			try { await relay.signIn(); } catch (e) { closeNav(); return this.open(); }
			if (!relay.acct || !(await kvGet('k'))) { closeNav(); return this.open(); }
			await show(true);
		});
		$('modes').hidden = false;
		this.renderAcct();
		if (await kvGet('acct')) relay.signIn().then(async () => { try { await settleKey(); } catch (e) {} this.renderAcct(); }, () => {});
		/* a code session lives in its folder: no browsing to another one from here */
		if (REMOTE_ID) $('btn-dir').hidden = true;
		if (HASH === '#signin' || INVITE) history.replaceState(null, '', location.pathname);
		window.addEventListener('hashchange', () => { if (/^#(signin|invite=|link=|pair=|remote=)/.test(location.hash)) location.reload(); });
		window.addEventListener('hako-remote-lost', (e) => {
			const m = modal('the connection dropped');
			const n = document.createElement('div'); n.className = 'note'; n.textContent = e.detail || ''; m.body.appendChild(n);
			const b = document.createElement('button'); b.textContent = 'reconnect'; b.addEventListener('click', () => location.reload()); m.foot.appendChild(b);
		});
		window.addEventListener('hako-remote-retry', (e) => { meta.textContent = 'reconnecting: ' + e.detail; });
		window.addEventListener('hako-remote-back', () => refreshState());
		if (LINK) this.open(LINK);
		else if (PAIR) this.open(null, PAIR);
		else if (SSO_BACK || HASH === '#signin' || INVITE) this.open();      /* one sheet, also back from GitHub or Google */
		if (!REMOTE_ID) show(false);
		if (REMOTE_ID) {
			remote.ready.then(() => { projects(); window.dispatchEvent(new Event('hako-remote-ready')); })
				.catch((e) => { const m = modal('could not reach that computer'); const n = document.createElement('div'); n.className = 'note'; n.textContent = e.message; m.body.appendChild(n);
					const b = document.createElement('button'); b.textContent = 'back to this browser'; b.addEventListener('click', () => { location.hash = ''; location.reload(); }); m.foot.appendChild(b); });
		}
	},
};

if (HAKO_WASM_MODE && !REMOTE_ID) {
	const worker = new Worker('hako-worker.js', { type: 'module' });
	const ring = [];                       /* events, so a late listener sees them */
	let listeners = [];
	let booted = false;

	const emit = (obj) => {
		ring.push(obj);
		listeners.forEach((fn) => fn(obj));
	};

	let config = { provider: '', model: '', has_key: false };
	let configReady = null;
	const whenConfig = new Promise((r) => { configReady = r; });
	const WORKSPACE = '/workspace';   /* the one visible root in the browser build */
	let workDir = WORKSPACE;
	let curSession = '';
	let folderName = '';
	let agentVersion = '';

	/* A directory handle is a live object, not a path; IndexedDB is the only
	   place that can store one. */
	const idb = (fn) => new Promise((resolve) => {
		const rq = indexedDB.open('hako', 1);
		rq.onupgradeneeded = () => rq.result.createObjectStore('handles');
		rq.onerror = () => resolve(null);
		rq.onsuccess = () => {
			const db = rq.result;
			const tx = db.transaction('handles', 'readwrite');
			const r = fn(tx.objectStore('handles'));
			if (r) { r.onsuccess = () => resolve(r.result); r.onerror = () => resolve(null); }
			else resolve(null);
		};
	});
	const rememberFolder = (h) => idb((st) => st.put(h, 'folder'));
	const recallFolder = () => idb((st) => st.get('folder'));
	const forgetFolder = () => idb((st) => st.delete('folder'));

	async function mountFolder(handle) {
		const r = await ask('mount', { handle });
		workDir = (r && r.path) || '/';
		folderName = handle ? handle.name : '';
		curSession = '';
		return r;
	}

	/* Permission may already be granted; otherwise it needs a click, so hold the
	   handle and let the picker ask. */
	let pendingFolder = null;
	async function restoreFolder() {
		if (!window.showDirectoryPicker) return;
		const h = await recallFolder();
		if (!h) return;
		try {
			if (await h.queryPermission({ mode: 'readwrite' }) === 'granted') {
				await mountFolder(h);
				await refreshState();
			} else {
				pendingFolder = h;
			}
		} catch (e) { /* handle no longer valid: the picker will ask again */ }
	}

	window.hakoPendingFolder = () => (pendingFolder ? pendingFolder.name : '');
	window.hakoReconnectFolder = async () => {
		if (!pendingFolder) return false;
		try {
			if (await pendingFolder.requestPermission({ mode: 'readwrite' }) !== 'granted') return false;
		} catch (e) { return false; }
		const h = pendingFolder;
		pendingFolder = null;
		return !!(await mountFolder(h)).path;
	};
	let pendingKey = null;          /* provider awaiting a pasted key */
	let pendingCode = null;         /* provider awaiting a pasted OAuth code */
	let askAfterTurn = null;        /* a prompt to raise once the turn is finished */
	let pendingPrompt = null;       /* what the user asked before we interrupted */

	worker.onmessage = (ev) => {
		const m = ev.data || {};
		if (m.type === 'ready') {
			booted = true;
			if (m.dir) workDir = m.dir;
			worker.postMessage({ type: 'state' });
			restoreFolder();
			return;
		}
		if (m.type === 'open' && m.path) workDir = m.path;
		if (m.type === 'config') { config = m.config; configReady(); return; }
		if (m.type === 'session') { curSession = m.id; return; }
		if (m.type === 'version') { agentVersion = m.version; return; }
		if (m.type === 'live') {
			const changed = m.provider !== config.provider || m.model !== config.model;
			if (m.provider) config.provider = m.provider;
			if (m.model) config.model = m.model;
			/* The header was already drawn from whatever state said at boot. */
			if (changed && typeof handshake === 'function') handshake();
			return;
		}
		if (m.id !== undefined && asking.has(m.id)) {
			asking.get(m.id)(m);
			asking.delete(m.id);
			return;
		}
		if (m.type === 'out') {
			let obj;
			try { obj = JSON.parse(m.line); } catch (e) { return; }
			if (collecting) {
				if (obj.type === 'message' && obj.role === 'system') { collecting.lines.push(obj.text || ''); return; }
				if (obj.type === 'done') { collecting.finish(); return; }
				return;                       /* a collected command speaks to us, not the transcript */
			}
			emit(obj);
			if (obj.type === 'done' && askAfterTurn) {
				const q = askAfterTurn;
				askAfterTurn = null;
				emit({ type: 'input_request', prompt: q.prompt, hidden: q.hidden });
			}
			return;
		}
		if (m.type === 'log') console.debug('[hako]', m.line);
		if (m.type === 'error') emit({ type: 'error', text: m.error });
	};
	worker.postMessage({ type: 'boot', wasmUrl: 'hako.wasm' });

	const run = (lines) => worker.postMessage({ type: 'run', lines });

	/* Some routes need data only the agent has (its provider table, its model
	   catalog). Rather than copy that into JS — where it would drift the moment
	   hako.c changed — run the command and collect what it prints. */
	/* Request/response over postMessage: routes that read stored state ask the
	   worker and await the matching reply. */
	let askSeq = 0;
	const asking = new Map();
	const ask = (type, extra) => new Promise((resolve) => {
		const id = ++askSeq;
		asking.set(id, resolve);
		worker.postMessage({ type, id, ...extra });
		setTimeout(() => { if (asking.has(id)) { asking.delete(id); resolve(null); } }, 4000);
	});

	/* The agent announces its provider and model in every init event, and only a
	   turn produces one. Run a silent command at boot so the header is right
	   before the user touches anything. */
	whenConfig.then(() => runCollect(':session'));

	let collecting = null;
	const runCollect = (cmd) => new Promise((resolve) => {
		const lines = [];
		collecting = { lines, resolve };
		const done = () => { collecting = null; resolve(lines); };
		const timer = setTimeout(done, 5000);
		collecting.finish = () => { clearTimeout(timer); done(); };
		run([JSON.stringify({ type: 'slash', cmd })]);
	});

	/* The UI's HTTP calls, answered in-page. Same routes, same shapes. */
	const routes = {
		'/api/state': async () => (await whenConfig, {
			awaiting_code: pendingCode ? 1 : 0,
			version: (agentVersion || '') + ' wasm' + (buildId ? ' b' + buildId.slice(-5) : ''),
			dir: workDir, home: folderName ? workDir : WORKSPACE,
			root: folderName ? '' : WORKSPACE, places: [],
			folder: folderName,
			provider: config.provider, model: config.model, session: curSession, turns: 0,
			busy: 0, yolo: 0,
			awaiting_input: (pendingKey || pendingCode) ? 1 : 0,
			input_hidden: pendingKey ? 1 : 0,
			input_prompt: pendingKey ? ('paste your ' + pendingKey + ' API key')
			            : pendingCode ? 'paste the code shown on that page' : '',
			caps: ['prompt', 'slash', 'input', 'events', 'models', 'providers', 'sessions',
			       'history', 'rename', 'delete', 'dirs', 'files', 'open', 'mkdir',
			       'upload', 'save', 'wasm']
			      .concat(window.showDirectoryPicker ? ['pickfolder'] : []),
		}),
		'/api/sessions': async () => {
			const r = await ask('sessions');
			return { dir: workDir, current: curSession,
			         sessions: (r && r.sessions) || [] };
		},
		'/api/dirs': async (query) => {
			const r = await ask('dirs', { path: query.get('path') || workDir });
			return r || { path: workDir, dirs: [], files: [] };
		},
		'/api/models': async () => {
			const lines = await runCollect(':models list');
			const catalog = lines
				.map((l) => l.trim().replace(/^[◎●*>]\s*/, ''))
				.filter((l) => l && !/\s/.test(l));
			return { installed: [], found: [], known: [], catalog, provider: config.provider, model: config.model };
		},
		'/api/providers': async () => {
			const lines = await runCollect(':providers list');
			const providers = [];
			for (const l of lines) {
				const m = l.match(/^\s*([◎*\s]*)\s*([a-z][a-z0-9-]+)\s{2,}(.+)$/);
				if (m) providers.push({
					name: m[2], desc: m[3].trim(), kind: 'key',
					saved: m[1].includes('*'), active: m[1].includes('◎'),
				});
			}
			return { active: config.provider, providers };
		},
	};

	const origFetch = window.fetch.bind(window);
	window.fetch = async (input, init) => {
		const url = typeof input === 'string' ? input : input.url;
		if (!url.startsWith('/api/')) return origFetch(input, init);
		const path = url.split('?')[0];
		const query = new URLSearchParams(url.split('?')[1] || '');
		const body = init && init.body ? String(init.body) : '';

		if (path === '/api/prompt') {
			emit({ type: 'message', role: 'user', text: body });   /* the agent never replays it */
			if (!config.has_key) { pendingPrompt = body; needKey(config.provider || 'gemini'); return json({ ok: true }); }
			run([JSON.stringify({ type: 'prompt', text: body })]);
			return json({ ok: true });
		}
		if (path === '/api/slash') {
			/* `:login` opens an OAuth loopback the browser cannot host, so in this
			   build it becomes what it can be: paste a key. The key is written to
			   the agent's own ~/.hakorc in OPFS and never touches this page again. */
			/* Switching sessions is navigation, not conversation. */
			if (!/^[:/](resume|session)\b/.test(body)) emit({ type: 'message', role: 'user', text: body });
			const m = body.match(/^[:/]login\s+(\S+)(?:\s+(.*))?$/);
			if (m) {
				const p = m[1], rest = (m[2] || '').trim();

				/* OAuth cannot complete from a web page for any provider here: the
				   token endpoints refuse cross-origin requests. Anthropic's allows
				   only console.anthropic.com; GitHub's device endpoint sends no CORS
				   headers at all. The key-paste variants have no such problem. */
				const OAUTH_BLOCKED = {
					anthropic: 'anthropic-api',
					chatgpt: 'openai',
					codex: 'openai',
					openrouter: 'openrouter-api',
					copilot: null,
					'github-models': null,
				};
				if (p in OAUTH_BLOCKED) {
					const alt = OAUTH_BLOCKED[p];
					emit({ type: 'message', role: 'system',
					       text: p + ' signs in with OAuth, and its token endpoint refuses requests from a '
					           + 'web page. Run `hako --serve` on a machine to use it there.'
					           + (alt ? ' Here, `:login ' + alt + '` takes an API key.' : '') });
					endTurn();
					return json({ ok: true });
				}
				needKey(p);
				return json({ ok: true });
			}
			const res = body.match(/^[:/]resume\s+(\S+)/);
			if (res) { await ask('session-use', { session: res[1] }); curSession = res[1]; endTurn(); return json({ ok: true }); }
			if (/^[:/]session\s+new\b/.test(body)) {
				await ask('session-use', { session: null });
				curSession = '';
				emit({ type: 'message', role: 'system', text: 'new session' });
				endTurn();
				return json({ ok: true });
			}
			run([JSON.stringify({ type: 'slash', cmd: body })]);
			return json({ ok: true });
		}
		if (path === '/api/input') {
			if (pendingCode) {
				const provider = pendingCode;
				pendingCode = null;
				if (body) run([JSON.stringify({ type: 'slash', cmd: ':login ' + provider + ' ' + body })]);
				else { emit({ type: 'message', role: 'system', text: '(no code entered)' }); endTurn(); }
				return json({ ok: true });
			}
			if (pendingKey) {
				const provider = pendingKey;
				pendingKey = null;
				if (body) {
					/* Config first, then the provider switch, then whatever the user
					   was originally trying to do — in one run, so the key is in
					   place before the turn that needs it. */
					worker.postMessage({ type: 'config', patch: { ai_provider: provider, ai_api_key: body } });
					emit({ type: 'message', role: 'system', text: 'key saved for ' + provider + ' — stored on this device only' });
					const lines = [JSON.stringify({ type: 'slash', cmd: ':provider ' + provider })];
					if (pendingPrompt) { lines.push(JSON.stringify({ type: 'prompt', text: pendingPrompt })); pendingPrompt = null; }
					run(lines);
				} else {
					pendingPrompt = null;
					emit({ type: 'message', role: 'system', text: '(no key entered)' });
					endTurn();
				}
			}
			return json({ ok: true });
		}
		if (path === '/api/events') return sse();
		if (path === '/api/session/delete') {
			await ask('session-delete', { session: body });
			if (curSession === body) curSession = '';
			return json({ ok: true });
		}
		if (path === '/api/session/rename') {
			const nl = body.indexOf('\n');
			await ask('session-rename', { session: body.slice(0, nl), title: body.slice(nl + 1) });
			return json({ ok: true });
		}
		if (path === '/api/upload') {
			/* Text only: the store holds strings. */
			const name = (query.get('name') || 'file').split('/').pop();
			const into = query.get('dir') || workDir;
			const buf = new Uint8Array(await init.body.arrayBuffer());
			if (buf.includes(0)) {
				emit({ type: 'message', role: 'system',
				       text: name + ' looks binary — the browser build stores text files only' });
				return json({ ok: false });
			}
			const text = new TextDecoder().decode(buf);
			const r = await ask('file-write', { path: into.replace(/\/$/, '') + '/' + name, text });
			if (r && r.ok) emit({ type: 'message', role: 'system',
			                      text: 'added ' + name + ' (' + buf.length + ' bytes) to ' + into });
			return json({ ok: !!(r && r.ok) });
		}
		if (path === '/api/find') return json({ candidates: [] });
		if (path === '/api/file/delete') {
			const r = await ask('file-delete', { path: body });
			return json({ ok: !!(r && r.ok) });
		}
		if (path === '/api/file') {
			const r = await ask('file-read', { path: query.get('path') || '' });
			if (!r || r.text === null || r.text === undefined) return new Response('', { status: 404 });
			return new Response(r.text, { headers: { 'Content-Type': 'text/plain' } });
		}
		if (path === '/api/mkdir') {
			await ask('mkdir', { path: body });
			return json({ ok: true });
		}
		if (path === '/api/open') {
			const target = body || '/work';
			const r = await ask('open', { path: target });
			workDir = (r && r.path) || target;
			/* Re-announce, so the header and sessions reflect the new folder. */
			run([JSON.stringify({ type: 'slash', cmd: ':sessions' })]);
			return json({ ok: true });
		}
		if (path.startsWith('/api/history')) {
			const id = query.get('id') || '';
			const r = await ask('history', { session: id });
			return json({ messages: (r && r.messages) || [] });
		}
		const fn = routes[path];
		return json(fn ? await fn(query) : { ok: true });
	};

	/* No HTTP body can carry a directory handle, so this is not a route. */
	window.hakoMountFolder = async (handle) => {
		const r = await mountFolder(handle);
		if (handle) await rememberFolder(handle); else await forgetFolder();
		return !!(r && r.path);
	};

	const json = (o) => new Response(JSON.stringify(o), { headers: { 'Content-Type': 'application/json' } });

	/* Ask for a key using the same box the native build uses for OAuth codes. */
	/* Where each provider hands out a key. The native build opens this in a
	   browser; here the page is the browser, so it goes in the message. */
	const KEY_URL = {
		gemini: 'https://aistudio.google.com/apikey',
		openai: 'https://platform.openai.com/api-keys',
		'anthropic-api': 'https://console.anthropic.com/settings/keys',
		anthropic: 'https://console.anthropic.com/settings/keys',
		groq: 'https://console.groq.com/keys',
		deepseek: 'https://platform.deepseek.com/api_keys',
		mistral: 'https://console.mistral.ai/api-keys',
		cerebras: 'https://cloud.cerebras.ai',
		openrouter: 'https://openrouter.ai/keys',
		nous: 'https://portal.nousresearch.com',
		xai: 'https://console.x.ai',
		together: 'https://api.together.ai/settings/api-keys',
		fireworks: 'https://fireworks.ai/api-keys',
	};

	/* Anything that answers without running the agent must still end the turn:
	   the UI's spinner stops on `done`, and without one it spins forever. */
	const endTurn = () => emit({ type: 'done', turn: 0, in: 0, out: 0, session: '' });

	const needKey = (provider) => {
		if (!provider || provider === 'none') {
			emit({ type: 'message', role: 'system',
			       text: 'This runs entirely in your browser, so it needs a provider and your own API key. '
			           + 'Pick a provider first: :provider, or settings.' });
			endTurn();
			return;
		}
		pendingKey = provider;
		const url = KEY_URL[provider];
		emit({ type: 'message', role: 'system',
		       text: 'This runs entirely in your browser, so it needs your own API key. '
		           + 'It is stored on this device and sent only to ' + provider + '.' });
		if (url) emit({ type: 'message', role: 'system', text: 'Get one here: ' + url });
		emit({ type: 'input_request', prompt: 'paste your ' + provider + ' API key', hidden: 1 });
		endTurn();
	};

	/* EventSource wants a stream; give it one fed by the worker. */
	const sse = () => new Response(new ReadableStream({
		start(controller) {
			const enc = new TextEncoder();
			const push = (o) => controller.enqueue(enc.encode('data: ' + JSON.stringify(o) + '\n\n'));
			ring.forEach(push);
			listeners.push(push);
		},
	}), { headers: { 'Content-Type': 'text/event-stream' } });

	/* EventSource itself cannot be intercepted by patching fetch, so give the UI
	   one that reads from the same in-page stream. */
	window.EventSource = class {
		constructor() {
			this.onopen = null; this.onmessage = null; this.onerror = null;
			setTimeout(() => {
				if (this.onopen) this.onopen();
				ring.forEach((o) => this.onmessage && this.onmessage({ data: JSON.stringify(o) }));
				listeners.push((o) => this.onmessage && this.onmessage({ data: JSON.stringify(o) }));
			}, 0);
		}
		close() {}
	};
}
</script>
<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), meta = $('meta'), dot = $('dot'), form = $('form');
const input = $('input'), send = $('send'), sessionsEl = $('sessions'), dirEl = $('dir');
const filesEl = $('files');
const tray = $('tray');

/* ---------- settings: on this device only, never sent anywhere ---------- */
const SETTINGS_KEY = 'hako.studio.settings';
const defaults = { theme: 'washi', modelPaths: [], consented: false, spinner: 'braille' };
let settings = Object.assign({}, defaults);
try { Object.assign(settings, JSON.parse(localStorage.getItem(SETTINGS_KEY) || '{}')); } catch (e) {}
function saveSettings() {
	try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
}

/* ---------- themes: applied in the page, instantly ---------- */

/* ---------- state ---------- */
let busy = false;
let state = { provider: '', model: '', turns: 0, session: '', dir: '', version: '',
              home: '', places: [], folder: '', root: '' };
const askBoxes = new Map();

/* ---------- capability handshake ----------
   This UI updates over the air; the core it is talking to does not necessarily
   move with it (an app's native code ships at release cadence, and a browser tab
   can outrun the binary serving it). So ask what this core supports and degrade,
   never assume a version. */
let caps = new Set();
const isWasm = !!document.querySelector('meta[name="hako-mode"][content="wasm"]') && !REMOTE_ID;
/* Shown in the header so "is this the new build?" has an answer. */
const buildId = (document.querySelector('meta[name="hako-build"]') || {}).content || '';
async function handshake() {
	try {
		const j = await (await fetch('/api/state')).json();
		caps = new Set(j.caps || []);
		state.provider = j.provider || ''; state.model = j.model || '';
		state.turns = j.turns || 0; state.dir = j.dir || ''; state.version = j.version || '';
		state.home = j.home || '';
		state.places = j.places || [];
		state.folder = j.folder || '';
		state.root = j.root || '';
		renderMeta();
		/* A reload mid-prompt: the core still wants an answer, so ask again. */
		if (j.awaiting_input) askInput({ prompt: j.input_prompt, hidden: j.input_hidden });
		if (j.busy) setBusy(true);                      /* a reload mid-turn: still running there */
		else { pendingInput = null; renderPending(); }
	} catch (e) { caps = new Set(); }
}
async function refreshState() {
	await handshake();
	await loadSessions();
}
const closeNav = () => document.body.classList.remove('nav');

function clearLog() { stopThinking(); log.textContent = ''; askBoxes.clear(); live = null; }
/* The reply as it streams. The finished message replaces it; a tool call or the
   turn's end drops what is left (a withdrawn tool block, never the answer). */
let live = null;
function dropLive() { if (live) { live.remove(); live = null; } }
function atBottom() { return log.scrollHeight - log.scrollTop - log.clientHeight < 40; }
function add(cls, who, text) {
	const stick = atBottom();
	const el = document.createElement('div');
	el.className = cls;
	if (who) {
		const w = document.createElement('span');
		w.className = 'who'; w.textContent = who; el.appendChild(w);
	}
	/* A bare URL in the transcript is useless on a phone — the login flow hands
	   one over and expects you to open it. Only http(s), only as text nodes. */
	const parts = String(text).split(/(https?:\/\/[^\s]+)/g);
	parts.forEach((part, i) => {
		if (i % 2 === 1) {
			const a = document.createElement('a');
			a.href = part; a.target = '_blank'; a.rel = 'noopener noreferrer';
			a.textContent = part;
			el.appendChild(a);
		} else if (part) el.appendChild(document.createTextNode(part));
	});
	if (spinEl) log.insertBefore(el, spinEl);   /* keep the spinner last */
	else log.appendChild(el);
	if (stick) log.scrollTop = log.scrollHeight;
	return el;
}
let metaHold = 0;                     /* a flashStatus word is showing until then */
function renderMeta() {
	if (Date.now() < metaHold) return;
	meta.textContent = '';
	if (state.provider) {
		const b = document.createElement('b');
		b.textContent = state.provider + (state.model ? '/' + state.model : '');
		meta.appendChild(b);
	}
	if (state.turns) meta.appendChild(document.createTextNode(' · turn ' + state.turns));
	if (!meta.textContent) meta.textContent = 'ready';
}
/* ---------- thinking indicator ----------
   A local turn can run for minutes with nothing streamed back, so without this
   the page looks dead. Elapsed time is the part that actually reassures. */
const SPINNERS = {
	braille: ['⠋','⠙','⠹','⠸','⠼','⠴','⠦','⠧','⠇','⠏'],
	dots:    ['·  ','·· ','···',' ··','  ·','   '],
	bar:     ['▁','▃','▄','▅','▆','▇','▆','▅','▄','▃'],
	moon:    ['◐','◓','◑','◒'],
	arc:     ['◜','◝','◞','◟'],
	none:    null
};
let spinTimer = null, spinEl = null, spinStart = 0;

function startThinking() {
	if (spinEl) return;
	const frames = SPINNERS[settings.spinner];
	const stick = atBottom();
	spinEl = document.createElement('div');
	spinEl.className = 'thinking';
	const f = document.createElement('span');
	f.className = 'frame';
	const label = document.createTextNode(' thinking ');
	const t = document.createElement('span');
	t.className = 'elapsed';
	spinEl.append(f, label, t);
	log.appendChild(spinEl);
	if (stick) log.scrollTop = log.scrollHeight;

	spinStart = Date.now();
	let i = 0;
	const tick = () => {
		if (!spinEl) return;
		if (frames) f.textContent = frames[i++ % frames.length];
		const s = Math.floor((Date.now() - spinStart) / 1000);
		t.textContent = s >= 60 ? Math.floor(s / 60) + 'm ' + (s % 60) + 's' : s + 's';
	};
	tick();
	spinTimer = setInterval(tick, frames ? 90 : 1000);
}
function stopThinking() {
	if (spinTimer) { clearInterval(spinTimer); spinTimer = null; }
	if (spinEl) { spinEl.remove(); spinEl = null; }
}
function setBusy(v) {
	busy = v;
	/* A core that can be interrupted turns the send button into a stop button —
	   on a phone there is no Ctrl-C to fall back on. Older cores just grey out. */
	send.disabled = v && !caps.has('stop');
	send.textContent = v ? (caps.has('stop') ? 'stop' : '…') : 'send';
	if (v) startThinking(); else stopThinking();
}

/* hako announces provider/model changes in its normal output:
     "provider: anthropic (saved)"
     "model: claude-sonnet-4-6 (saved)"
     "model → claude-haiku-4-5 (prior model not valid for anthropic…)"
   Read the real values off the stream rather than assuming what we asked for
   stuck — a provider switch can silently reassign the model. */
function sniffState(text) {
	let m, hit = false;
	if ((m = text.match(/^provider:\s*([^\s(]+)/))) { state.provider = m[1]; hit = true; }
	if ((m = text.match(/^model:\s*([^\s(]+)/)))    { state.model = m[1];    hit = true; }
	if ((m = text.match(/^model\s*→\s*([^\s(]+)/))) { state.model = m[1];    hit = true; }
	if (hit) renderMeta();
	return hit;
}
async function post(path, body) {
	try { return await fetch(path, { method: 'POST', body }); }
	catch (e) { add('turn error', '', 'send failed: ' + e.message); setBusy(false); }
}

/* ---------- generic modal ---------- */
function modal(title) {
	const scrim = document.createElement('div');
	scrim.className = 'scrim';
	const box = document.createElement('div');
	box.className = 'modal';
	const h = document.createElement('h2');
	h.textContent = title;
	const body = document.createElement('div');
	body.className = 'body';
	const foot = document.createElement('div');
	foot.className = 'foot';
	box.append(h, body, foot);
	scrim.appendChild(box);
	const m = { scrim, box, title: h, body, foot, onclose: null };
	m.close = () => { scrim.remove(); document.removeEventListener('keydown', onKey); if (m.onclose) m.onclose(); };
	function onKey(e) { if (e.key === 'Escape') m.close(); }
	document.addEventListener('keydown', onKey);
	scrim.addEventListener('click', (e) => { if (e.target === scrim) m.close(); });
	document.body.appendChild(scrim);
	return m;
}

/* A word in the header's status line for a moment, never in the chat. */
function flashStatus(text) {
	meta.textContent = text;
	metaHold = Date.now() + 2500;
	setTimeout(() => { metaHold = 0; renderMeta(); }, 2500);
}
function optionRow(label, sub, tag, onClick, current) {
	const b = document.createElement('button');
	b.className = 'opt' + (current ? ' sel' : '');
	b.appendChild(document.createTextNode((current ? '◎ ' : '  ') + label));
	if (tag) {
		const s = document.createElement('span');
		s.className = 'tag'; s.textContent = '  ' + tag; b.appendChild(s);
	}
	if (sub) {
		const s = document.createElement('span');
		s.className = 'sub'; s.textContent = '  ' + sub; b.appendChild(s);
	}
	b.addEventListener('click', onClick);
	return b;
}
function groupLabel(text) {
	const d = document.createElement('div');
	d.className = 'grouplabel'; d.textContent = text;
	return d;
}
function mb(label, cls, fn) {
	const b = document.createElement('button');
	if (cls) b.className = cls;
	b.textContent = label;
	b.addEventListener('click', fn);
	return b;
}
const fmtGB = (n) => (n / 1073741824).toFixed(1) + ' GB';

/* ---------- approvals ---------- */
const ALWAYS_LABEL = { write: 'always write in this project', shell: 'always run exactly this', read: 'always read in this project' };
const VERDICT = { y: 'allowed once', n: 'denied', a: 'allowed for this session' };

function askApproval(m) {
	const stick = atBottom();
	const box = document.createElement('div');
	box.className = 'ask';
	const head = document.createElement('span');
	head.className = 'head'; head.textContent = '● ' + (m.name || 'tool');
	const subj = document.createElement('span');
	subj.className = 'subj'; subj.textContent = m.subject || '';
	const row = document.createElement('div');
	row.className = 'row';
	const mk = (cls, label, ans) => row.appendChild(mb(label, cls, () => { settle(box, ans); post('/api/approve', ans); }));
	mk('primary', 'allow once', 'y');
	mk('', 'deny', 'n');
	mk('', ALWAYS_LABEL[m.kind] || 'always allow', 'a');
	box.append(head, subj, row);
	if (spinEl) log.insertBefore(box, spinEl);   /* in order, above the spinner */
	else log.appendChild(box);
	if (m.id) askBoxes.set(String(m.id), box);
	if (stick) log.scrollTop = log.scrollHeight;
}
/* The core asks to pick one: a picker command or the model's ask_user. It
   waits for the answer, so the box must always answer or be settled. */
function askChoice(m) {
	const stick = atBottom();
	const box = document.createElement('div');
	box.className = 'ask';
	const head = document.createElement('span');
	head.className = 'head'; head.textContent = '● ' + (m.question || 'choose one');
	const row = document.createElement('div');
	row.className = 'row';
	(m.options || []).forEach((o, i) => row.appendChild(mb(o, i ? '' : 'primary', () => {
		settle(box, o); post('/api/approve', String(i + 1));
	})));
	row.appendChild(mb('cancel', '', () => { settle(box, 'cancelled'); post('/api/approve', '0'); }));
	box.append(head, row);
	if (spinEl) log.insertBefore(box, spinEl);
	else log.appendChild(box);
	if (m.id) askBoxes.set('c' + m.id, box);
	if (stick) log.scrollTop = log.scrollHeight;
}
function settleOpenChoices() {
	for (const [k, box] of askBoxes)
		if (k[0] === 'c' && !box.classList.contains('settled')) settle(box, 'closed');
}

/* The core asks for a line of text — an OAuth code, a yes/no. Without this the
   agent would be waiting on a terminal the browser does not have. */
let pendingInput = null;

/* Dismissing the box must not strand the turn: the request stays pending and a
   banner offers it back. Only an explicit cancel answers (empty), which is what
   actually unparks the agent. */
function renderPending() {
	let bar = document.getElementById('pending');
	if (!pendingInput) { if (bar) bar.remove(); return; }
	if (!bar) {
		bar = document.createElement('button');
		bar.id = 'pending';
		bar.type = 'button';
		bar.className = 'pending';
		bar.addEventListener('click', () => askInput(pendingInput));
		form.parentNode.insertBefore(bar, form);
	}
	bar.textContent = '● the agent is waiting: ' + (pendingInput.prompt || 'input needed') + ' — tap to answer';
}

function askInput(m) {
	pendingInput = m;
	renderPending();
	const box = modal(m.prompt || 'input needed');
	const n = document.createElement('div');
	n.className = 'note';
	n.textContent = m.hidden
		? 'Open the link above, sign in, then paste what it gives you. It is sent straight to the agent on this machine and stored by hako, not by this page.'
		: 'The agent is waiting on this.';
	box.body.appendChild(n);

	const wrap = document.createElement('div');
	wrap.style.padding = '.35rem .55rem';
	const inp = document.createElement('input');
	inp.type = m.hidden ? 'password' : 'text';
	inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
	inp.placeholder = m.hidden ? 'paste here' : '';
	wrap.appendChild(inp);
	box.body.appendChild(wrap);

	const send_ = () => {
		pendingInput = null; renderPending();
		box.close();
		post('/api/input', inp.value);
	};
	inp.addEventListener('keydown', (e) => { if (e.key === 'Enter' && inp.value) send_(); });
	const g = document.createElement('div'); g.className = 'grow';
	/* Closing without answering would leave the turn parked, so cancel answers. */
	box.foot.append(g, mb('cancel', '', () => {
		pendingInput = null; renderPending();
		box.close();
		post('/api/input', '');       /* an unanswered prompt would park the turn forever */
	}), mb('send', 'primary', send_));
	setTimeout(() => inp.focus(), 50);
}

/* The core's display string sometimes already carries its own arrow. */
const arrowed = (mark, text) => /^\s*[→←]/.test(text) ? text.trim() : mark + ' ' + text;

function settle(box, ans) {
	box.classList.add('settled');
	const v = document.createElement('span');
	v.className = 'verdict'; v.textContent = VERDICT[ans] || ans;
	box.appendChild(v);
}

/* ---------- provider picker ----------
   Reads /api/providers. The old version scraped the printed `:providers` table,
   whose rows are columns of prose — the scrape matched nothing, so the picker
   always came up empty while typing a name by hand worked fine. */
async function openProviderPicker(onPicked, only) {
	const m = modal(only === 'oauth' ? 'sign in' : only === 'key' ? 'API key' : 'provider');
	m.body.appendChild(Object.assign(document.createElement('div'),
		{ className: 'note', textContent: 'loading…' }));
	let j = { providers: [] };
	try { j = await (await fetch('/api/providers')).json(); } catch (e) {}
	m.body.textContent = '';

	const groups = [['signed in', (p) => p.saved],
	                ['local — no account', (p) => !p.saved && p.kind === 'local'],
	                ['sign in', (p) => !p.saved && p.kind === 'oauth'],
	                ['api key', (p) => !p.saved && p.kind === 'key']];

	let shown = 0;
	groups.forEach(([label, filter]) => {
		const rows = (j.providers || []).filter((p) => (!only || p.kind === only) && filter(p));
		if (!rows.length) return;
		shown += rows.length;
		m.body.appendChild(groupLabel(label));
		rows.forEach((p) => m.body.appendChild(optionRow(
			p.name, p.desc, p.saved ? 'ready' : (p.kind === 'oauth' ? 'login' : ''),
			async () => {
				m.close();
				state.provider = p.name; state.model = ''; renderMeta();
				await post('/api/slash', ':provider ' + p.name);
				/* Not signed in yet? The next thing you need is the login, so run it. */
				if (!p.saved && p.kind !== 'local') await post('/api/slash', ':login ' + p.name);
				/* Switching fetches the provider's catalog, which takes seconds. A
				   fixed delay raced it and the model list arrived for the provider
				   we just left. Wait for the agent to say it has moved. */
				await settledOnProvider(p.name);
				if (onPicked) onPicked();
			}, p.active)));
	});

	if (!shown) m.body.appendChild(Object.assign(document.createElement('div'), { className: 'note',
		textContent: only === 'oauth' ? 'signing in needs hako running on a computer (hako --serve). here, :login api takes a key.'
		                              : 'no providers returned' }));
	const g = document.createElement('div'); g.className = 'grow';
	m.foot.append(g, mb('cancel', '', m.close));
}

/* The agent is the authority on which provider is live; poll until it agrees,
   or give up and let the caller show whatever is current. */
async function settledOnProvider(name, ms = 12000) {
	const want = String(name || '').replace(/-api$/, '');
	const until = Date.now() + ms;
	while (Date.now() < until) {
		try {
			const j = await (await fetch('/api/state')).json();
			if (j.provider && (j.provider === want || j.provider === name)) {
				state.provider = j.provider;
				state.model = j.model || '';
				renderMeta();
				return true;
			}
		} catch (e) { /* keep waiting */ }
		await new Promise((r) => setTimeout(r, 350));
	}
	return false;
}

/* ---------- model picker ---------- */
function setModel(id, localModel) {
	/* Provider first: switching providers resets the model in hako. */
	if (localModel && state.provider !== 'mithraeum') {
		post('/api/slash', ':provider mithraeum');
		state.provider = 'mithraeum';
	}
	post('/api/slash', ':model ' + id);
	state.model = id;                 /* optimistic — hako emits no state event */
	renderMeta();
}
async function openModelPicker() {
	/* No provider means the model list is meaningless — ask the question that
	   actually needs answering first, then come back here. */
	if (!state.provider || state.provider === 'none') {
		openProviderPicker(() => openModelPicker());
		return;
	}

	const m = modal('model · ' + state.provider);
	m.body.appendChild(Object.assign(document.createElement('div'),
		{ className: 'note', textContent: 'loading…' }));
	let j = { installed: [], found: [], known: [], catalog: [] };
	const q = '/api/models?search=' + encodeURIComponent(settings.modelPaths.join(','));
	try {
		j = await (await fetch(q)).json();
		/* The answer says which provider it is for. If that is not the one we are
		   on, the switch was still in flight — ask again rather than list another
		   provider's models under this provider's heading. */
		if (j.provider && state.provider && j.provider !== state.provider) {
			await settledOnProvider(state.provider, 8000);
			j = await (await fetch(q)).json();
		}
	} catch (e) {}
	m.body.textContent = '';

	const local = state.provider === 'mithraeum';

	/* The provider you are on decides what is offered first. Everything else is
	   noise you have to scroll past. */
	if (!local && (j.catalog || []).length) {
		m.body.appendChild(groupLabel(state.provider + ' models'));
		j.catalog.forEach((id) => m.body.appendChild(
			optionRow(id, '', '', () => { m.close(); setModel(id, false); }, id === state.model)));
	}

	if (local || (j.installed || []).length) {
		const installed = j.installed || [];
		if (installed.length) {
			m.body.appendChild(groupLabel(local ? 'installed' : 'on this machine — switches to mithraeum'));
			installed.forEach((x) => m.body.appendChild(
				optionRow(x.id, fmtGB(x.bytes), 'ready',
					() => { m.close(); setModel(x.id, true); }, x.id === state.model)));
		}

		const installedIds = new Set(installed.map((x) => x.id));
		const found = (j.found || []).filter((x) => !installedIds.has(x.id));
		if (found.length) {
			m.body.appendChild(groupLabel('found on this device — link to use'));
			found.forEach((x) => m.body.appendChild(
				optionRow(x.id, x.path, 'link', async () => {
					m.close();
					add('turn system', '', 'linking ' + x.id + ' from ' + x.path);
					const r = await post('/api/link', x.path);
					if (r && r.ok) setModel(x.id, true);
					else add('turn error', '', 'could not link ' + x.path);
				})));
		}

		const missing = (j.known || []).filter((id) => !installedIds.has(id) && !found.some((f) => f.id === id));
		if (missing.length) {
			m.body.appendChild(groupLabel('available to download'));
			missing.forEach((id) => m.body.appendChild(
				optionRow(id, 'from huggingface.co/mithraeum', 'pull', () => {
					m.close();
					add('turn system', '', 'downloading ' + id + ' — multi-GB, runs on the machine hosting hako.');
					post('/api/slash', ':pull ' + id);
				})));
		}
	}

	if (!m.body.children.length)
		m.body.appendChild(Object.assign(document.createElement('div'),
			{ className: 'note', textContent: 'no models listed for ' + state.provider + ' — type one below' }));

	const inp = document.createElement('input');
	inp.placeholder = 'or type a model id';
	inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
	inp.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && inp.value.trim()) { m.close(); setModel(inp.value.trim(), local); }
	});
	const g = document.createElement('div'); g.className = 'grow'; g.appendChild(inp);
	m.foot.append(g, mb('provider', '', () => { m.close(); openProviderPicker(() => openModelPicker()); }),
	              mb('close', '', m.close));
}

/* ---------- attachments ----------
   Chips carry PATHS, not bytes: the agent already has the filesystem, so it only
   needs to be told where to look. Sent as a trailing line, which reads naturally
   in the transcript and gives the model something it can act on. */
const fmtSize = (n) => n >= 1048576 ? (n / 1048576).toFixed(1) + ' MB'
                     : n >= 1024    ? Math.round(n / 1024) + ' KB' : n + ' B';

/* Two kinds of attachment: a PATH already on the machine (nothing to transfer),
   and a FILE picked off this device, which is held here and only uploaded when
   you actually send. Removing a chip therefore leaves nothing behind — uploading
   on pick meant a file you changed your mind about was already in the project. */
const attached = [];
function renderTray() {
	tray.textContent = '';
	tray.hidden = !attached.length;
	attached.forEach((a, i) => {
		const chip = document.createElement('span');
		chip.className = 'chip';
		const nm = document.createElement('span');
		nm.className = 'nm';
		const img = a.file && isImage(a.file) && caps.has('image');
		nm.textContent = (img ? '▣ ' : a.file ? '↑ ' : '') + a.name.split('/').pop();
		nm.title = img ? a.name + ' — the model sees it with your message' : a.file ? a.name + ' — uploads when you send' : a.name;
		const rm = document.createElement('button');
		rm.className = 'rm'; rm.type = 'button'; rm.textContent = '×';
		rm.title = 'remove';
		rm.addEventListener('click', () => { attached.splice(i, 1); renderTray(); });
		chip.append(nm, rm);
		tray.appendChild(chip);
	});
}
function attach(name, file) {
	if (!attached.some((a) => a.name === name && !!a.file === !!file)) attached.push({ name, file });
	renderTray();
	input.focus();
}

const isImage = (f) => /^image\//.test(f.type) || /\.(png|jpe?g|gif|webp|heic)$/i.test(f.name);
/* A phone photo is 3 to 12 MB; providers scale anything past 1568 px down anyway. */
async function shrinkImage(file) {
	if (file.size < 1.5e6 && /^image\/(png|jpeg|gif|webp)$/.test(file.type)) return file;
	const bmp = await createImageBitmap(file);
	const s = Math.min(1, 1568 / Math.max(bmp.width, bmp.height));
	const c = document.createElement('canvas');
	c.width = Math.max(1, Math.round(bmp.width * s));
	c.height = Math.max(1, Math.round(bmp.height * s));
	c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
	if (bmp.close) bmp.close();
	return new Promise((ok, no) => c.toBlob((b) => (b ? ok(b) : no(new Error('could not shrink it'))), 'image/jpeg', 0.85));
}

/* Upload anything picked off the device, then hand back every path to mention
   and every [image #N] the core gave an image. */
async function flushAttachments() {
	const paths = [], marks = [];
	for (const a of attached) {
		if (!a.file) { paths.push(a.name); continue; }
		if (isImage(a.file)) {
			if (!caps.has('image')) { add('turn error', '', a.name + ': images reach the agent in a code session or hako --serve, not this browser’s own agent yet'); continue; }
			try {
				const r = await fetch('/api/image', { method: 'POST', body: await shrinkImage(a.file) });
				const j = await r.json();
				if (j.ok) marks.push(j.marker);
				else add('turn error', '', a.name + ' not attached: ' + (j.error || 'no answer'));
			} catch (e) { add('turn error', '', a.name + ' not attached: ' + e.message); }
			continue;
		}
		if (!caps.has('upload')) { add('turn error', '', 'this agent cannot accept uploads'); continue; }
		add('turn system', '', 'sending ' + a.name + ' (' + fmtSize(a.file.size) + ') …');
		try {
			const r = await fetch('/api/upload?name=' + encodeURIComponent(a.name), { method: 'POST', body: a.file });
			const j = await r.json();
			if (j.ok) paths.push(a.name);
			else add('turn error', '', 'could not send ' + a.name);
		} catch (e) { add('turn error', '', 'could not send ' + a.name + ': ' + e.message); }
	}
	attached.length = 0;
	renderTray();
	return { paths, marks };
}

/* A file the agent wrote is only useful if it can leave. The browser's download
   is the one exit every platform has, including iOS, where it lands in Files. */
async function saveOut(path, name) {
	const r = await fetch('/api/file?path=' + encodeURIComponent(path));
	if (!r.ok) return;
	const blob = new Blob([await r.text()], { type: 'application/octet-stream' });
	const url = URL.createObjectURL(blob);
	const a = document.createElement('a');
	a.href = url;
	a.download = name;
	document.body.appendChild(a);
	a.click();
	a.remove();
	setTimeout(() => URL.revokeObjectURL(url), 10000);
}

/* ---------- folder picker ---------- */
/* Said once, before anything is typed. Where the work lives is the first thing
   a person needs to know about this build, not something to discover when it
   disappears. */
function browserNotice() {
	if (!isWasm || settings.browser_notice || LINK || PAIR || INVITE || SSO_BACK || HASH === '#signin') return;
	const m = modal('this runs in your browser');
	const n = document.createElement('div');
	n.className = 'note';
	n.innerHTML =
		'The agent runs on <b>this device</b>. Nothing is sent to a server of ours — '
		+ 'your key goes straight to the model provider, and your files never leave here.'
		+ '<br><br>'
		+ '<b>Work is kept in this browser\u2019s storage.</b> Clearing site data, or '
		+ '\u201cclear history\u201d in some browsers, <b>erases your sessions and files</b>. '
		+ 'Anything you want to keep, save out from the files list.'
		+ '<br><br>'
		+ 'For real folders on a disk, a shell, and local hako models, run '
		+ '<code>hako --serve</code> or the desktop app.';
	m.body.appendChild(n);
	const ok = document.createElement('button');
	ok.textContent = 'understood';
	ok.addEventListener('click', () => { settings.browser_notice = true; saveSettings(); m.close(); });
	m.foot.appendChild(ok);
}

function consentNotice(onOk) {
	if (settings.consented) return onOk();
	const m = modal('before you open a folder');
	const n = document.createElement('div');
	n.className = 'note';
	n.innerHTML =
		'<b>The agent gets read and write access to the folder you choose.</b> It can create, ' +
		'modify and delete files there, and every one of those actions asks your permission first ' +
		'unless you pick “always”.<br><br>' +
		'<b>Nothing is stored by us.</b> There is no account and no server holding your data. ' +
		'Your files stay on this machine. Conversations and settings are written to ' +
		'<code>~/.hako/</code> and your browser’s local storage on this device — the same ' +
		'files the hako CLI uses, which is why sessions are shared between them.<br><br>' +
		'What you send to a <b>cloud</b> model does go to that provider, using your own API key.';
	m.body.appendChild(n);
	m.foot.append(document.createElement('div'), mb('cancel', '', m.close), mb('understood', 'primary', () => {
		settings.consented = true; saveSettings(); m.close(); onOk();
	}));
