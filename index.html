}

/* One browser for both jobs. Two modals listing the same directory — one showing
   folders, one showing files, different buttons — was the jankiest thing here.
   Now: walk anywhere, tap a file to attach it, open the folder as the project,
   or pull a file off the device you are holding. */
async function openBrowser() {
	const m = modal('choose a working folder');
	/* A directory picker is a navigation surface, not a menu — give it the whole
	   screen so a deep path is browsable with a thumb. */
	m.box.classList.add('sheet');
	let path = state.dir || '.';

	const openBtn = mb('open this folder', 'primary', () => consentNotice(async () => {
		m.close();
		clearLog();
		add('turn system', '', 'opening ' + path + ' …');
		await post('/api/open', path);
		state.session = '';
		await loadSessions();
	}));

	/* Tapping "../" repeatedly to climb four levels is the worst part of a picker
	   on a phone. Crumbs make every ancestor one tap away. */
	const crumbs = document.createElement('div');
	crumbs.className = 'crumbs';

	const drawCrumbs = () => {
		crumbs.textContent = '';
		const seg = path.split('/').filter(Boolean);
		const mk = (label, target) => {
			const b = document.createElement('button');
			b.type = 'button';
			b.className = 'crumb';
			b.textContent = label;
			b.addEventListener('click', () => draw(target));
			return b;
		};
		crumbs.appendChild(mk('/', '/'));
		let acc = '';
		seg.forEach((sgm) => {
			acc += '/' + sgm;
			crumbs.appendChild(mk(sgm, acc));
		});
	};

	const draw = async (p) => {
		if (isWasm && !state.folder && !state.dir) {
			m.body.textContent = '';
			m.title.textContent = 'no folder open';
			const remembered = window.hakoPendingFolder && window.hakoPendingFolder();
			if (remembered) {
				m.body.appendChild(optionRow(remembered, 'reconnect', '', async () => {
					if (await window.hakoReconnectFolder()) { m.close(); await refreshState(); }
					else draw(p);
				}));
			}
			const n = document.createElement('div');
			n.className = 'note';
			n.innerHTML = caps.has('pickfolder')
				? 'Choose any folder on this machine to work in — a repo, notes, a '
				  + 'scratch directory, a synced folder. The agent reads and writes those '
				  + 'files in place, and nothing is copied anywhere else.'
				: 'This web instance of hako studio runs entirely in your browser, and '
				  + 'uses your browser\u2019s storage to keep your settings, your sessions '
				  + 'and the files the agent writes.<br><br>'
				  + 'Its working directory is <code>' + (state.dir || '/workspace') + '</code> '
				  + '\u2014 a folder inside that storage, not a folder on your device. It will '
				  + 'not appear in Files, and clearing this site\u2019s data erases it. Save '
				  + 'anything you want to keep from the files list.<br><br>'
				  + 'Opening a real folder on your device needs an API your browser does not '
				  + 'provide; Chromium-based browsers on desktop do. For real folders here, '
				  + 'run <code>hako --serve</code> on a machine and open that address.';
			m.body.appendChild(n);
			m.foot.querySelectorAll('button').forEach((b) => {
				if (!/choose folder|close/.test(b.textContent)) b.style.display = 'none';
			});
			return;
		}
		let j;
		try {
			const r = await fetch('/api/dirs?path=' + encodeURIComponent(p));
			j = await r.json();
		} catch (e) {
			m.body.textContent = '';
			m.body.appendChild(Object.assign(document.createElement('div'),
				{ className: 'note', textContent: 'cannot read ' + p }));
			return;
		}
		path = j.path || p;
		m.title.textContent = path;
		m.body.textContent = '';
		drawCrumbs();
		m.body.appendChild(crumbs);

		/* One tap to the folders people actually use. iCloud Drive's real path is
		   unmemorable, which made it the hardest folder on the machine to open. */
		if ((state.places || []).length) {
			const row = document.createElement('div');
			row.className = 'crumbs places';
			state.places.forEach((pl) => {
				const b = document.createElement('button');
				b.type = 'button';
				b.className = 'crumb place';
				b.textContent = pl.label;
				b.addEventListener('click', () => draw(pl.path));
				row.appendChild(b);
			});
			m.body.appendChild(row);
		}

		/* Quiet, but always there: people need to know where this lives, and the
		   one-time notice at first run is long forgotten by now. */
		if (isWasm && !state.folder) {
			const w = document.createElement('div');
			w.className = 'note';
			w.style.opacity = '.72';
			w.style.fontSize = '.78rem';
			w.textContent = 'Stored in this browser on this device \u2014 not in Files, and not on any server. '
			              + 'Clearing site data erases it. Save files out from the sidebar to keep them.';
			m.body.appendChild(w);
		}

		openBtn.textContent = (path === state.dir) ? 'current project' : 'open this folder';
		openBtn.disabled = (path === state.dir);

		const dirs = (j.dirs || []).sort();
		const files = (j.files || []).sort((a, b) => a.name.localeCompare(b.name));

		const floor = state.root || '/';
		if (path !== floor && path !== '/') m.body.appendChild(optionRow('../', '', '',
			() => {
				const up = path.replace(/\/[^/]+$/, '') || '/';
				draw(up.startsWith(floor) ? up : floor);
			}));

		const removable = isWasm && !state.folder;
		const withRemove = (row, full, label) => {
			if (!removable) return row;
			const wrap = document.createElement('div');
			wrap.className = 'sessrow';
			wrap.appendChild(row);
			const x = document.createElement('button');
			x.className = 'act del';
			x.textContent = '×';
			x.title = 'delete ' + label;
			x.addEventListener('click', async (e) => {
				e.stopPropagation();
				if (!confirm('Delete ' + label + '? This cannot be undone.')) return;
				await post('/api/file/delete', full);
				draw(path);
				loadFiles();
			});
			wrap.appendChild(x);
			return wrap;
		};

		dirs.forEach((d) => {
			const full = (path === '/' ? '' : path) + '/' + d;
			const row = optionRow(d + '/', '', '', () => draw(full));
			m.body.appendChild(withRemove(row, full, d + '/'));
		});

		if (!dirs.length) m.body.appendChild(Object.assign(document.createElement('div'),
			{ className: 'note', textContent: 'no subfolders here' }));

		if (files.length) {
			m.body.appendChild(groupLabel(files.length + ' file' + (files.length === 1 ? '' : 's') + ' here'));
			const savable = isWasm && !state.folder && caps.has('save');
			files.slice(0, 40).forEach((f) => {
				const full = (path === '/' ? '' : path) + '/' + f.name;
				const row = optionRow(f.name, fmtSize(f.bytes), savable ? 'save' : '',
					savable ? () => saveOut(full, f.name) : () => {});
				if (!savable) row.disabled = true;
				m.body.appendChild(withRemove(row, full, f.name));
			});
			if (files.length > 40) m.body.appendChild(Object.assign(document.createElement('div'),
				{ className: 'note', textContent: '… and ' + (files.length - 40) + ' more' }));
		}
	};

	const inp = document.createElement('input');
	inp.placeholder = caps.has('mkdir') ? 'a folder path, or a name to create' : 'or paste a folder path';
	inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
	inp.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && inp.value.trim()) draw(inp.value.trim().replace(/^~/, state.home || '~'));
	});
	const g = document.createElement('div'); g.className = 'grow'; g.appendChild(inp);

	/* Native folder dialogs, in order of what the browser actually allows:

	   1. showDirectoryPicker() — Chromium desktop only. Returns a HANDLE: folder
	      name and contents, never a path. Firefox refuses to ship it; Safari does
	      not implement it on any platform.
	   2. <input webkitdirectory> — desktop Safari and Firefox. Prompts with the
	      real OS folder dialog, then hands over a flat list of the files inside.
	      We ignore the files entirely and read webkitRelativePath for the folder
	      name — the upload never happens.

	   Either way the browser refuses to disclose a path, so the server resolves
	   name + one child to a real directory. On phones neither exists and no
	   button is shown. */
	const resolveFolder = async (folderName, child) => {
		m.body.textContent = '';
		m.body.appendChild(Object.assign(document.createElement('div'), { className: 'note',
			textContent: 'locating "' + folderName + '" on the machine running hako…' }));
		let j = { candidates: [] };
		try {
			j = await (await fetch('/api/find?name=' + encodeURIComponent(folderName) +
			                       '&child=' + encodeURIComponent(child || ''))).json();
		} catch (e) {}
		const hits = j.candidates || [];
		if (hits.length === 1) { draw(hits[0]); return; }
		m.body.textContent = '';
		m.body.appendChild(crumbs);
		if (!hits.length) {
			m.body.appendChild(Object.assign(document.createElement('div'), { className: 'note',
				textContent: '"' + folderName + '" was not found on the machine running hako. ' +
				             'If the agent runs on another computer, browse to the folder there instead.' }));
		} else {
			m.body.appendChild(groupLabel('which "' + folderName + '"?'));
			hits.forEach((h) => m.body.appendChild(optionRow(h, '', '', () => draw(h))));
		}
	};

	let sysBtn = null;
	if (isWasm) {
		if (caps.has('pickfolder')) {
			sysBtn = mb('choose folder…', '', async () => {
				let handle;
				try { handle = await window.showDirectoryPicker({ mode: 'readwrite' }); }
				catch (e) { return; }
				m.body.textContent = '';
				m.body.appendChild(Object.assign(document.createElement('div'),
					{ className: 'note', textContent: 'reading ' + handle.name + '…' }));
				const ok = await window.hakoMountFolder(handle);
				if (ok) { m.close(); await refreshState(); }
				else m.body.appendChild(Object.assign(document.createElement('div'),
					{ className: 'note', textContent: 'could not open that folder' }));
			});
		}
	} else if (!caps.has('find')) {
		/* a remote device: hako keeps it inside the project, so no picker */
	} else if (window.showDirectoryPicker) {
		sysBtn = mb('system picker…', '', async () => {
			let handle;
			try { handle = await window.showDirectoryPicker(); } catch (e) { return; }
			let child = '';
			try { for await (const [nm] of handle.entries()) { child = nm; break; } } catch (e) {}
			resolveFolder(handle.name, child);
		});
	} else if ('webkitdirectory' in document.createElement('input')
	           && window.matchMedia('(hover: hover)').matches) {
		const dirInput = document.createElement('input');
		dirInput.type = 'file';
		dirInput.webkitdirectory = true;
		dirInput.multiple = true;
		dirInput.style.display = 'none';
		dirInput.addEventListener('change', () => {
			const f = (dirInput.files || [])[0];
			dirInput.value = '';
			if (!f) return;
			const rel = (f.webkitRelativePath || '').split('/');
			if (rel.length < 2) return;
			resolveFolder(rel[0], rel[1]);      /* nothing is uploaded — names only */
		});
		m.body.appendChild(dirInput);
		sysBtn = mb('system picker…', '', () => dirInput.click());
	}

	const mkdirBtn = caps.has('mkdir') ? mb('new folder', '', async () => {
		const name = (inp.value || '').trim().replace(/^\/+|\/+$/g, '');
		if (!name) { inp.placeholder = 'name the folder, then press new folder'; inp.focus(); return; }
		const target = (path === '/' ? '' : path) + '/' + name;
		const r = await post('/api/mkdir', target);
		inp.value = '';
		if (r && r.ok) draw(target); else inp.placeholder = 'could not create that folder';
	}) : null;

	const foot = [g];
	if (sysBtn) foot.push(sysBtn);
	if (mkdirBtn) foot.push(mkdirBtn);
	foot.push(mb('home', '', () => draw(state.home || '~')), mb('close', '', m.close), openBtn);
	m.foot.append(...foot);
	await draw(path);
}

/* ---------- settings ---------- */
function openSettings() {
	const m = modal('settings');

	m.body.appendChild(groupLabel('model'));
	m.body.appendChild(optionRow(state.model || '(none)', 'change', '', () => {
		m.close(); openModelPicker();
	}));
	m.body.appendChild(optionRow(state.provider || '(none)', 'provider', '', () => {
		m.close(); openProviderPicker();
	}));

	/* Tapping through themes previews them; closing settings keeps the last one,
	   says so in the status line, and (under --serve) keeps the CLI in step. */
	m.body.appendChild(groupLabel('theme'));
	const themeWas = settings.theme, themeRows = [];
	m.onclose = () => {
		if (settings.theme === themeWas) return;
		if (!HAKO_WASM_MODE) post('/api/theme', settings.theme);
		flashStatus('theme: ' + settings.theme);
	};
	Object.keys(THEMES).forEach((name) => {
		const t = THEMES[name];
		const b = optionRow(name, '', '', () => {
			applyTheme(name);
			for (const [n, row, label] of themeRows) {
				row.classList.toggle('sel', n === name);
				label.nodeValue = (n === name ? '\u25ce ' : '  ') + n;
			}
		}, settings.theme === name);
		themeRows.push([name, b, b.firstChild]);
		['bg', 'gold', 'phos', 'bone'].reverse().forEach((k) => {
			const sw = document.createElement('span');
			sw.className = 'swatch';
			sw.style.background = t[k];
			b.insertBefore(sw, b.firstChild);
		});
		m.body.appendChild(b);
	});

	m.body.appendChild(groupLabel('thinking indicator'));
	Object.keys(SPINNERS).forEach((name) => {
		const f = SPINNERS[name];
		m.body.appendChild(optionRow(name, f ? f.slice(0, 5).join(' ') : 'no animation', '', () => {
			settings.spinner = name; saveSettings();
			m.close(); openSettings();
		}, settings.spinner === name));
	});

	/* The browser build has no engine and no disk to search: only --serve can use this. */
	if (!isWasm) {
	m.body.appendChild(groupLabel('where to look for model weights'));
	const note = document.createElement('div');
	note.className = 'note';
	note.innerHTML = '<code>~/.hako/models</code> and <code>~/Downloads</code> are always searched. ' +
	                 'Add folders here — a weight found elsewhere is <b>symlinked</b> into place, never copied or moved.';
	m.body.appendChild(note);
	settings.modelPaths.forEach((p, i) => {
		m.body.appendChild(optionRow(p, '', 'remove', () => {
			settings.modelPaths.splice(i, 1); saveSettings(); m.close(); openSettings();
		}));
	});
	const addWrap = document.createElement('div');
	addWrap.style.padding = '.35rem .55rem';
	const addInp = document.createElement('input');
	addInp.placeholder = 'add a folder path, press enter';
	addInp.addEventListener('keydown', (e) => {
		if (e.key === 'Enter' && addInp.value.trim()) {
			settings.modelPaths.push(addInp.value.trim()); saveSettings(); m.close(); openSettings();
		}
	});
	addWrap.appendChild(addInp);
	m.body.appendChild(addWrap);
	}

	m.body.appendChild(groupLabel('your data'));
	const priv = document.createElement('div');
	priv.className = 'note';
	priv.innerHTML = 'These settings live in this browser’s local storage, on this device. ' +
	                 'Conversations live in <code>~/.hako/projects/</code> on the machine running the agent. ' +
	                 'We keep nothing — there is no account and no server-side copy.';
	m.body.appendChild(priv);
	m.body.appendChild(optionRow('forget settings on this device', '', '', () => {
		try { localStorage.removeItem(SETTINGS_KEY); } catch (e) {}
		settings = Object.assign({}, defaults);
		applyTheme(settings.theme);
		m.close();
	}));

	const g = document.createElement('div'); g.className = 'grow';
	m.foot.append(g, mb('done', 'primary', m.close));
}

/* ---------- resume ----------
   `:resume` reloads the conversation into hako's context but replays nothing to
   the front end, so the pane would come back empty. Render the stored transcript
   ourselves — it's the same jsonl the CLI reads. */
/* Stored transcripts predate the dialect repair (and always contain whatever the
   model actually emitted), so clean them for display only — the file on disk is
   never rewritten. */
/* Turn a stored assistant message into the same shapes the live stream produces:
   prose as prose, tool calls as chips. A transcript that shows raw XML while the
   live view shows chips reads like two different apps. */
function replayAssistant(raw) {
	const text = String(raw || '');
	const calls = [];
	const subjectOf = (body) => {
		const json = body.match(/"(?:path|file_path|command|script|dir|directory)"\s*:\s*"([^"]*)"/);
		if (json) return json[1];
		const param = body.match(/<parameter name="(?:path|dir|command)">([\s\S]*?)<\/parameter>/);
		return param ? param[1].trim() : '';
	};

	/* Three dialects reach the transcript: the correct <tool name="x">, the
	   near-miss <tool_name="x"> from before the normalizer, and Qwen's
	   <tool_call>{"name":…,"arguments":…}</tool_call>. All render as one chip. */
	const tagged = /<tool(?:_name="|\s+name=")([a-z_]+)"\s*>([\s\S]*?)<\/tool(?:_name)?>/gi;
	let mm;
	while ((mm = tagged.exec(text)) !== null)
		calls.push({ name: mm[1], subject: subjectOf(mm[2]) });

	const called = /<tool_call>([\s\S]*?)<\/tool_call>/gi;
	while ((mm = called.exec(text)) !== null) {
		const nm = mm[1].match(/"name"\s*:\s*"([^"]*)"/);
		calls.push({ name: nm ? nm[1] : 'tool', subject: subjectOf(mm[1]) });
	}

	/* Claude's own XML: <function_calls><invoke name="x"><parameter …> */
	const invoked = /<invoke name="([^"]+)">([\s\S]*?)<\/invoke>/gi;
	while ((mm = invoked.exec(text)) !== null)
		calls.push({ name: mm[1], subject: subjectOf(mm[2]) });
	return { prose: stripTools(text), calls };
}

function stripTools(text) {
	return String(text)
		.replace(/<observation[^>]*>[\s\S]*?<\/observation>/g, '')
		.replace(/<tool_call>[\s\S]*?<\/tool_call>/g, '')
		.replace(/<tool_name=[^>]*>[\s\S]*?<\/tool_name>/g, '')
		.replace(/<tool\b[^>]*>[\s\S]*?<\/tool>/g, '')
		.replace(/<write_file[^>]*>[\s\S]*?<\/write_file>/g, '')
		.replace(/<parameter[^>]*>[\s\S]*?<\/parameter>/g, '')
		.replace(/<\/?(invoke|function_calls|tool_call|tool_name|tool)[^>]*>/g, '')
		/* A response cut off mid-call leaves an unterminated block. Every rule
		   above needs a closing tag, so without this the truncated tail — and
		   everything after it — renders as raw markup. */
		.replace(/<(?:function_calls|invoke|tool_call|tool_name|tool|parameter|observation|write_file)\b[\s\S]*$/, '')
		.replace(/\n{3,}/g, '\n\n')
		.trim();
}

async function renderHistory(id) {
	try {
		const r = await fetch('/api/history?id=' + encodeURIComponent(id));
		const j = await r.json();
		(j.messages || []).forEach((msg) => {
			if (msg.role === 'user') {
				if (msg.content) add('turn user', 'you', msg.content);
				return;
			}
			if (msg.role === 'assistant') {
				/* Same shapes the live stream produces: chips for calls, prose for
				   prose. A transcript that shows raw XML while the live view shows
				   chips reads like two different applications. */
				const { prose, calls } = replayAssistant(msg.content);
				calls.forEach((c) => add('tool', '', '→ ' + c.name + '(' + (c.subject || '') + ')'));
				if (prose) add('turn model', 'hako', prose);
				return;
			}
			if (msg.role === 'tool') {
				/* Same chip the live stream draws, so a reloaded transcript shows
				   the work and not just the conclusion. */
				if (msg.content) add('tool', '', '→ ' + msg.content);
				return;
			}
			if (msg.content) add('turn system', '', msg.content);
		});
		if ((j.messages || []).length) {
			const sep = add('turn system', '', '── end of saved history ──');
			sep.style.color = 'var(--faint)';
		}
		log.scrollTop = log.scrollHeight;
	} catch (e) { add('turn error', '', 'could not load history for ' + id); }
}
async function resumeSession(id) {
	clearLog();
	state.session = id;             /* pre-set so the init event doesn't wipe the render */
	await post('/api/slash', ':resume ' + id);
	await post('/api/reset', '');   /* the transcript is on screen; drop stale replay */
	await renderHistory(id);
	loadSessions();
}

/* Rename writes a `<sid>.title` sidecar next to the transcript — hako's own jsonl
   is never touched, so the CLI keeps reading it unchanged. Empty name restores
   the first-message default. */
function renameSession(s) {
	const m = modal('rename session');
	const n = document.createElement('div');
	n.className = 'note';
	n.textContent = 'Give this conversation a name. Leave it empty to go back to using its first message.';
	m.body.appendChild(n);

	const wrap = document.createElement('div');
	wrap.style.padding = '.35rem .55rem';
	const inp = document.createElement('input');
	inp.value = s.title || '';
	inp.maxLength = 200;
	wrap.appendChild(inp);
	m.body.appendChild(wrap);

	const apply = async () => {
		m.close();
		const r = await post('/api/session/rename', s.id + '\n' + inp.value.trim());
		if (r && r.ok) loadSessions();
		else add('turn error', '', 'could not rename ' + s.id);
	};
	inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') apply(); });

	const g = document.createElement('div'); g.className = 'grow';
	m.foot.append(g, mb('cancel', '', m.close), mb('save', 'primary', apply));
	setTimeout(() => { inp.focus(); inp.select(); }, 0);
}

/* Deleting a transcript removes a real file from disk — confirm, and say where. */
function confirmDelete(s) {
	const m = modal('delete session');
	const n = document.createElement('div');
	n.className = 'note';
	n.textContent = 'Delete "' + (s.title || s.id) + '"?\n\nThis removes ' + s.id +
		'.jsonl from ~/.hako/projects/ on this machine. It cannot be undone, and the ' +
		'hako CLI will no longer see it either.';
	n.style.whiteSpace = 'pre-wrap';
	m.body.appendChild(n);
	const g = document.createElement('div'); g.className = 'grow';
	m.foot.append(g, mb('keep it', '', m.close), mb('delete', 'primary', async () => {
		m.close();
		const r = await post('/api/session/delete', s.id);
		if (r && r.ok) {
			if (s.id === state.session) { clearLog(); post('/api/slash', ':session new'); }
			loadSessions();
		} else add('turn error', '', 'could not delete ' + s.id);
	}));
}

/* ---------- sidebar ---------- */
function when(ts) {
	const d = new Date(ts * 1000), now = Date.now() / 1000;
	if (now - ts < 86400) return d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
	return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
}
async function loadSessions() {
	try {
		const r = await fetch('/api/sessions');
		const j = await r.json();
		state.dir = j.dir || '';
		dirEl.textContent = state.dir;
		sessionsEl.textContent = '';
		(j.sessions || []).sort((a, b) => b.mtime - a.mtime).forEach((s) => {
			const row = document.createElement('div');
			row.className = 'sessrow';

			const b = document.createElement('button');
			b.className = 'sess' + (s.id === state.session ? ' cur' : '') + (HAKO_WASM_MODE ? (REMOTE_ID ? ' k-code' : ' k-chat') : '');
			b.title = s.id;
			b.textContent = s.title || '(empty)';
			const w = document.createElement('span');
			w.className = 'when';
			w.textContent = s.id.slice(0, 8) + ' · ' + when(s.mtime);
			b.appendChild(w);
			b.addEventListener('click', () => { closeNav(); resumeSession(s.id); });

			const ren = document.createElement('button');
			ren.className = 'act ren';
			ren.title = 'rename this session';
			ren.textContent = '✎';
			ren.addEventListener('click', (e) => { e.stopPropagation(); renameSession(s); });

			const del = document.createElement('button');
			del.className = 'act del';
			del.title = 'delete this session';
			del.textContent = '×';
			del.addEventListener('click', (e) => { e.stopPropagation(); confirmDelete(s); });

			row.append(b, ren, del);
			sessionsEl.appendChild(row);
		});
		if (!(j.sessions || []).length)
			sessionsEl.appendChild(Object.assign(document.createElement('div'), { className: 'note', textContent: 'no sessions in this folder yet' }));
	} catch (e) {}
	loadFiles();
}

/* What the agent has written, where you can reach it. In the browser build the
   working directory is not a place any file manager can open, so a file is only
   really yours once it has been saved out. */
async function loadFiles() {
	if (!filesEl) return;
	try {
		const j = await (await fetch('/api/dirs?path=' + encodeURIComponent(state.dir || '.'))).json();
		const files = (j.files || []).sort((a, b) => a.name.localeCompare(b.name));
		filesEl.textContent = '';
		if (!files.length) {
			filesEl.appendChild(Object.assign(document.createElement('div'),
				{ className: 'note', textContent: 'nothing written yet' }));
			return;
		}
		files.slice(0, 60).forEach((f) => {
			const row = document.createElement('div');
			row.className = 'sessrow';
			const b = document.createElement('button');
			b.className = 'sess';
			b.title = f.name;
			b.textContent = f.name;
			const full = ((state.dir === '/' ? '' : state.dir) || '') + '/' + f.name;
			/* Native runs against a real disk, where the file is already reachable. */
			if (isWasm) b.addEventListener('click', () => saveOut(full, f.name));
			else b.disabled = true;
			row.appendChild(b);
			const sz = document.createElement('span');
			sz.className = 'sub';
			sz.textContent = fmtSize(f.bytes || 0);
			row.appendChild(sz);
			if (isWasm && !state.folder) {
				const x = document.createElement('button');
				x.className = 'act del';
				x.textContent = '×';
				x.title = 'delete ' + f.name;
				x.addEventListener('click', async () => {
					if (!confirm('Delete ' + f.name + '? This cannot be undone.')) return;
					await post('/api/file/delete', full);
					loadFiles();
				});
				row.appendChild(x);
			}
			filesEl.appendChild(row);
		});
	} catch (e) {}
}

/* ---------- event stream ---------- */
/* Everything the ring replays on connect describes the past. Live events start
   after a short settle, so a stale prompt cannot pop a box that is already dealt with. */
let replaying = true, settleTimer = setTimeout(() => { replaying = false; }, 1200);

const es = new EventSource('/api/events');
es.onopen = () => {                   /* also after a remote reconnect: the ring replays again */
	dot.classList.add('on'); clearLog(); renderMeta();
	replaying = true; clearTimeout(settleTimer); settleTimer = setTimeout(() => { replaying = false; }, 1200);
};
es.onerror = () => { dot.classList.remove('on'); meta.textContent = 'disconnected'; };
es.onmessage = (ev) => {
	let m;
	try { m = JSON.parse(ev.data); } catch (e) { return; }

	if (m.session && m.session !== state.session) {
		if (state.session) { clearLog(); post('/api/reset', ''); }
		state.session = m.session;
		loadSessions();
	}
	switch (m.type) {
		case 'init':
			state.provider = m.provider || ''; state.model = m.model || ''; state.turns = m.turns || 0;
			renderMeta(); loadSessions();
			break;
		case 'delta': {
			const stick = atBottom();
			if (!live) live = add('turn model live', 'hako', '');
			live.appendChild(document.createTextNode(m.text || ''));
			if (stick) log.scrollTop = log.scrollHeight;
			break;
		}
		case 'message':
			dropLive();
			if (m.role === 'user') { add('turn user', 'you', m.text || ''); setBusy(true); break; }
			if (m.role === 'system') {
				sniffState(m.text || '');                       /* always watch for state lines */
				add('turn system', '', m.text || '');
			} else {
				add('turn model', 'hako', m.text || '');
			}
			break;
		case 'input_request':
			/* Replayed from the ring after a reload? The handshake already told us
			   whether it is still outstanding — trust that, not the replay. */
			if (!replaying) askInput(m);
			break;
		case 'tool_request': askApproval(m); break;
		case 'choice_request': askChoice(m); break;
		case 'state':                       /* a menu pick: the status line, never the chat */
			state.provider = m.provider || ''; state.model = m.model || '';
			renderMeta();
			break;
		case 'choice_decision': {
			const box = askBoxes.get('c' + m.id);
			if (box && !box.classList.contains('settled')) settle(box, 'answered');
			break;
		}
		case 'tool_decision': {
			const box = askBoxes.get(String(m.id));
			if (box && !box.classList.contains('settled')) settle(box, m.answer);
			break;
		}
		case 'tool_start': dropLive(); add('tool', '', arrowed('→', m.display || 'tool')); break;
		case 'tool_end':   add(/^error:/.test(m.display || '') ? 'tool fail' : 'tool', '', arrowed('←', m.display || 'done')); break;
		case 'tool_result': {
			/* What the tool actually returned. A byte count is not an answer to
			   "what files are in this directory". */
			const el = add('tool result', '', m.text || '');
			el.style.whiteSpace = 'pre-wrap';
			break;
		}
		case 'done':
			dropLive();
			state.turns = m.turn || state.turns;
			renderMeta(); setBusy(false);
			settleOpenChoices();
			loadSessions();
			loadFiles();
			break;
		case 'error': dropLive(); add('turn error', '', m.text || 'error'); setBusy(false); break;
	}
};

/* ---------- input ---------- */
const UNSAFE = /^[:/](models?|providers?|theme|login(\s+api)?)\s*$/i;
const CLEARING = /^[:/](clear|sessions?\s+clear|session\s+new)\b/i;

form.addEventListener('submit', (e) => {
	e.preventDefault();
	if (busy) { if (caps.has('stop')) post('/api/stop', ''); return; }
	const text = input.value.trim();
	if (!text && !attached.length) return;
	input.value = ''; input.style.height = 'auto';

	if (UNSAFE.test(text)) {
		const which = text.replace(/^[:/]/, '').trim().toLowerCase().replace(/\s+/g, ' ');
		if (which === 'theme') openSettings();
		else if (which.startsWith('model')) openModelPicker();
		else if (which === 'login') openProviderPicker(null, 'oauth');
		else if (which === 'login api') openProviderPicker(null, 'key');
		else openProviderPicker();
		return;
	}
	setBusy(true);
	if (attached.length && !text.startsWith(':') && !text.startsWith('/')) {
		flushAttachments().then(({ paths, marks }) => {
			const words = [text, marks.join(' ')].filter(Boolean).join(' ');
			if (!words && !paths.length) { setBusy(false); return; }
			post('/api/prompt', paths.length ? words + '\n\nfiles: ' + paths.join(' ') : words);
		});
		return;
	}
	if (text.startsWith(':') || text.startsWith('/')) {
		post('/api/slash', text);
		if (CLEARING.test(text)) { clearLog(); post('/api/reset', ''); setBusy(false); }
	} else post('/api/prompt', text);
});

input.addEventListener('keydown', (e) => {
	/* Enter sends, Shift+Enter is a newline — the convention everywhere, and what
	   a hardware keyboard on a tablet expects. The old rule keyed off (hover:hover)
	   to detect "desktop", which made Enter insert a newline on an iPad with a
	   keyboard attached. The on-screen keyboard still offers its own return key
	   for multi-line input via Shift. */
	if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
		e.preventDefault();
		form.requestSubmit();
	}
});
input.addEventListener('input', () => {
	input.style.height = 'auto';
	input.style.height = Math.min(input.scrollHeight, 144) + 'px';
});

$('burger').addEventListener('click', () => document.body.classList.toggle('nav'));
$('btn-dir').addEventListener('click', () => { closeNav(); openBrowser(); });
/* Straight to the system picker — the browser's own file sheet is better than
   anything we can draw, and on iOS it is Files/Photos. Attaching a file that is
   already on the machine is what the working-directory browser is for. */
const devicePicker = document.createElement('input');
devicePicker.type = 'file';
devicePicker.multiple = true;
devicePicker.style.display = 'none';
devicePicker.addEventListener('change', () => {
	const chosen = Array.from(devicePicker.files || []);
	if (!chosen.length) return;
	chosen.forEach((f) => attach(f.name, f));   /* uploaded on send, not on pick */
	devicePicker.value = '';                    /* so the same file can be re-picked */
});
document.body.appendChild(devicePicker);
$('attach').addEventListener('click', () => devicePicker.click());
/* A pasted screenshot or a dropped file lands on the tray like a picked one.
   Pasted images are all called image.png, so each gets its own name. */
input.addEventListener('paste', (e) => {
	const files = Array.from((e.clipboardData && e.clipboardData.files) || []).filter(isImage);
	if (!files.length) return;
	e.preventDefault();
	files.forEach((f, i) => attach('pasted-' + Date.now().toString(36) + (i ? '-' + i : '') + '.' + (f.type.split('/')[1] || 'png'), f));
});
document.addEventListener('dragover', (e) => { if (e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files')) e.preventDefault(); });
document.addEventListener('drop', (e) => {
	const files = Array.from((e.dataTransfer && e.dataTransfer.files) || []);
	if (!files.length) return;
	e.preventDefault();
	files.forEach((f) => attach(f.name, f));
});
$('btn-settings').addEventListener('click', () => { closeNav(); openSettings(); });
$('btn-new').addEventListener('click', () => {
	closeNav(); clearLog(); post('/api/slash', ':session new'); post('/api/reset', '');
});
$('btn-restart').addEventListener('click', async () => {
	closeNav(); clearLog(); add('turn system', '', 'reloading this folder…');
	await post('/api/restart', ''); setBusy(false);
});
/* The drawer's scrim is body's own ::after, so a tap that lands on body is a tap
   outside the drawer. */
document.addEventListener('click', (e) => {
	if (e.target === document.body && document.body.classList.contains('nav')) closeNav();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeNav(); });

/* The on-screen keyboard shrinks the window without changing any CSS viewport
   unit, so the composer ends up underneath it. visualViewport reports the real
   visible box. iOS also pans that box down by about the keyboard's height to
   show the field, so the page sits at the box's offset, not at the top: sized
   alone, the composer landed at the top with blank space under it. A home-screen
   app on iOS reports 100dvh and innerHeight a status bar short while drawing
   under it, so there the screen is the height. */
if (window.visualViewport) {
	const vv = window.visualViewport;
	const full = () => navigator.standalone
		? (matchMedia('(orientation: landscape)').matches ? Math.min(screen.width, screen.height) : Math.max(screen.width, screen.height))
		: window.innerHeight;
	const isOpen = () => vv.height < window.innerHeight - 80;
	const pan = () => document.documentElement.style.setProperty('--vt', (isOpen() ? vv.offsetTop : 0) + 'px');
	const sync = () => {
		const open = isOpen();
		document.documentElement.style.setProperty('--vh', (open ? vv.height : full()) + 'px');
		pan();
		document.body.classList.toggle('kb', open);
		if (open) log.scrollTop = log.scrollHeight;
	};
	vv.addEventListener('resize', sync);
	vv.addEventListener('scroll', pan);
	window.addEventListener('resize', sync);
	sync();
}
input.addEventListener('focus', () => setTimeout(() => { log.scrollTop = log.scrollHeight; }, 250));

handshake().then(() => { loadSessions(); browserNotice(); });
window.hakoAccount.boot();
</script>
