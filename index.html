<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="The hako coding agent, compiled to WebAssembly and running in your browser tab. No account, no backend, no install; your key goes straight to the provider.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Mithraeum">
<meta property="og:url" content="https://hako.mithraeum.studio/">
<meta property="og:title" content="hako studio — the agent, in your browser tab">
<meta property="og:description" content="No account, no backend, no install. Your key goes straight to the provider; your work stays on your device.">
<meta property="og:image" content="https://hako.mithraeum.studio/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="スタジオ · hako studio, the agent in your browser tab — beside a screenshot of a session">
<meta name="twitter:card" content="summary_large_image">
<!-- Added to the home screen, this runs chromeless — which is the point: the
     phone is meant to be a real client, not a page you visit. -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="hako">
<!-- Real resources, not data: URIs — iOS ignores a data URI for a touch icon.
     hako --serve answers any /favicon* and /apple-touch-icon* from its embedded
     bundle; `make site` renames these to the icon's checksum, because browsers
     keep an icon by its address and the ス kept the old art's address. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180.png">
<link rel="icon" type="image/png" sizes="180x180" href="/favicon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>hako</title>
<style>
	:root {
		--bg:      #ffffff;
		--panel:   #f7f7f7;
		--panel-2: #ececec;
		--line:    #e3e3e3;
		--line-2:  #cccccc;
		--bone:    #1d1d1f;
		--gold:    #1d1d1f;
		--gold-dim:#8e8e93;
		--phos:    #636366;
		--dim:     #6e6e73;
		--faint:   #9a9aa0;
		--err:     #c9302c;
		--ink:     #ffffff;
		--mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
		--serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
		--sidebar: 268px;
		--col: 768px;
	}
	/* terminal, the default, before the script runs: the system's own light or dark */
	@media (prefers-color-scheme: dark) {
		:root { --bg:#1c1c1e; --panel:#232325; --panel-2:#2c2c2e; --line:#38383a; --line-2:#48484a; --bone:#e5e5e7;
		        --gold:#e5e5e7; --gold-dim:#8e8e93; --phos:#a1a1a6; --dim:#98989d; --faint:#6e6e73; --err:#ff6961; --ink:#1c1c1e; }
	}
	* { box-sizing: border-box; }
	html, body { height: 100%; margin: 0; }
	html { overflow: hidden; overscroll-behavior: none; }
	body {
		background: var(--bg); color: var(--bone);
		font: 14px/1.55 var(--mono);
		display: flex; overflow: hidden;
		-webkit-font-smoothing: antialiased;
		-webkit-text-size-adjust: 100%;   /* Safari inflates text in landscape otherwise */
		overscroll-behavior: none;
	}
	/* Dynamic viewport unit, because a mobile browser's chrome resizes the window:
	   100% leaves the composer under the URL bar. --vh and --vt are set from
	   visualViewport for the keyboard case, which no CSS unit tracks. */
	@supports (height: 100dvh) { html, body { height: 100dvh; } }
	body { position: fixed; left: 0; right: 0; top: var(--vt, 0); height: var(--vh, 100dvh); }
	button, .sess, .opt, .navrow, .card, .pill { touch-action: manipulation; }   /* no double-tap zoom */
	::-webkit-scrollbar { width: 9px; height: 9px; }
	::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 5px; }
	::-webkit-scrollbar-track { background: transparent; }
	svg.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

	button {
		font: inherit; cursor: pointer; border-radius: 6px; background: transparent;
		color: var(--bone); border: 1px solid var(--line-2); padding: .3rem .6rem; font-size: 12px;
	}
	button:hover { border-color: var(--gold-dim); color: var(--gold); }
	button:focus-visible { outline: 2px solid var(--gold); outline-offset: 1px; }
	button.primary { background: var(--gold); color: var(--ink); border-color: var(--gold); font-weight: 600; }
	button.primary:hover { filter: brightness(1.1); color: var(--ink); }
	button:disabled { opacity: .35; cursor: default; }
	.grow { flex: 1; }

	/* ---- the menu: wordmark and chat/code at the top, then rows, recents, the account ---- */
	aside {
		width: var(--sidebar); flex: none; background: var(--panel);
		border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0;
		padding-top: env(safe-area-inset-top);
	}
	.ib {
		display: inline-flex; align-items: center; justify-content: center; flex: none;
		width: 32px; height: 32px; padding: 0; border: 1px solid transparent; border-radius: 8px;
		color: var(--dim); background: transparent;
	}
	.ib:hover { color: var(--bone); background: var(--panel-2); border-color: transparent; }
	.shead { display: flex; align-items: center; gap: .35rem; padding: .55rem .55rem .5rem; min-height: 50px; }
	.wordmark { display: inline-flex; align-items: center; color: var(--gold); min-width: 0; }
	.wordmark svg { display: block; height: 17px; width: auto; overflow: visible; }
	.wordmark .off { fill: currentColor; opacity: .16; }
	.wordmark .on { fill: currentColor; }
	.modes { margin-left: auto; display: flex; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 10px; }
	.modes[hidden], .projects[hidden], .here[hidden], [hidden] { display: none !important; }
	.modes .ib { width: 32px; height: 28px; border-radius: 7px; }
	.modes .ib.on { background: var(--bg); color: var(--bone); box-shadow: 0 0 0 1px var(--line-2); }
	.rows { display: flex; flex-direction: column; gap: 1px; padding: .1rem .45rem .45rem; }
	.navrow {
		display: flex; align-items: center; gap: .65rem; width: 100%; text-align: left;
		border: 1px solid transparent; border-radius: 8px; padding: .42rem .55rem;
		color: var(--bone); font-size: 13px; background: transparent;
	}
	.navrow .i { color: var(--dim); }
	.navrow:hover { background: var(--panel-2); color: var(--bone); border-color: transparent; }
	.navrow:hover .i { color: var(--bone); }
	.searchbox { padding: 0 .1rem .2rem; }
	.searchbox input {
		width: 100%; font: inherit; font-size: 13px; color: var(--bone); background: var(--bg);
		border: 1px solid var(--line-2); border-radius: 8px; padding: .4rem .55rem;
	}
	.searchbox input:focus { outline: none; border-color: var(--gold-dim); }
	.recents { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 .45rem .5rem; }
	.label {
		font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
		color: var(--faint); margin-bottom: .35rem;
	}
	.recents .label { padding: .55rem .55rem .1rem; margin: 0; }
	.recents .note { padding: .35rem .55rem; }
	.sess {
		display: flex; align-items: baseline; gap: .5rem; width: 100%; text-align: left; background: transparent;
		border: 1px solid transparent; color: var(--bone); font: inherit; font-size: 13px;
		padding: .38rem .55rem; border-radius: 8px; cursor: pointer; min-width: 0;
	}
	.sess .nm { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
	.sess .when { flex: none; color: var(--faint); font-size: 10.5px; }
	.sess:hover { background: var(--panel-2); border-color: transparent; color: var(--bone); }
	.sess.cur { background: var(--panel-2); color: var(--gold); }
	/* signed in, a row says what it is: a code session (hako on a computer) or a chat in this browser */
	.sess.k-code::before, .sess.k-chat::before { flex: none; width: 1em; }
	.sess.k-code::before { content: '\25A3'; color: var(--gold); }
	.sess.k-chat::before { content: '\25CB'; color: var(--faint); }
	.sessrow { display: flex; align-items: stretch; gap: 1px; border-radius: 8px; }
	.sessrow .sess { flex: 1; min-width: 0; }
	.sessrow .act {
		flex: none; border: 1px solid transparent; background: transparent;
		color: var(--faint); padding: 0 .38rem; font-size: 13px; line-height: 1; border-radius: 6px;
	}
	@media (hover: hover) {
		.sessrow .act { visibility: hidden; }
		.sessrow:hover .act, .sessrow:focus-within .act { visibility: visible; }
	}
	.sessrow .act:hover { border-color: var(--line); }
	.sessrow .act.ren:hover { color: var(--gold); }
	.sessrow .act.del:hover { color: var(--err); }

	/* who is signed in, at the foot of the menu, like every app with accounts */
	.acct { margin-top: auto; border-top: 1px solid var(--line); padding: .4rem; }
	.acct button { display: flex; align-items: center; gap: .55rem; width: 100%; text-align: left; border-color: transparent; padding: .45rem .5rem; border-radius: 8px; }
	.acct button:hover { border-color: transparent; background: var(--panel-2); }
	.acct .who { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.acct .who span { display: block; color: var(--faint); font-size: 10px; }
	.ico { width: 18px; height: 18px; flex: none; }
	/* the sign-in choices: one wide button each, the provider's own mark on the left */
	.signin { display: flex; flex-direction: column; gap: .45rem; padding: .55rem; }
	.signin button { display: flex; align-items: center; justify-content: center; gap: .6rem; width: 100%; padding: .6rem .8rem; font-size: 13px; }
	.signin .or { text-align: center; color: var(--faint); font-size: 11px; }
	.acctinfo { display: flex; align-items: center; gap: .6rem; padding: .55rem; }
	.acctinfo .ico { width: 22px; height: 22px; }
	.acctinfo span { display: block; color: var(--faint); font-size: 11px; }
	/* a pair code: always dark on white, whatever the theme, so a camera reads it */
	.qr { display: block; width: min(220px, 64vw); height: auto; margin: .4rem auto; border-radius: 3px; }
	.modal input.pairlink { font-size: 11px; color: var(--faint); }

	/* ---- the page: header, then the conversation (or the landing), then the composer ---- */
	main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
	header {
		display: flex; align-items: center; gap: .45rem; padding: .45rem .7rem; min-height: 50px;
		padding-top: max(.45rem, env(safe-area-inset-top)); flex: none; background: var(--bg);
	}
	header .burger, header .hmark { display: none; }
	header .hmark { flex: none; }   /* never shrinks: a long title once ran under it on a phone */
	body.side-off header .burger, body.side-off header .hmark { display: inline-flex; }
	header .title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); font-size: 13px; padding-left: .2rem; }
	header .spacer { flex: 1; }
	header .dot { color: var(--err); font-size: 9px; }
	header .dot.on { color: var(--phos); }
	header .meta { color: var(--dim); font-size: 12px; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
	header .meta b { color: var(--bone); font-weight: 400; }
	.ind { display: flex; gap: .35rem; }
	.ind > * {
		border: 1px solid var(--line); border-radius: 99px; padding: .05rem .5rem; font-size: 11px;
		color: var(--dim); background: transparent; white-space: nowrap;
	}
	.ind .on::before { content: '\25CF\00a0'; color: var(--phos); font-size: 8px; vertical-align: 1px; }
	.ind button:hover { color: var(--gold); border-color: var(--gold-dim); }

	.stage { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
	#log {
		flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
		padding: .6rem max(.9rem, calc((100% - var(--col)) / 2)) 1.4rem;
	}
	.thinking { color: var(--gold); margin: 0 0 1rem; }
	.thinking .frame { display: inline-block; width: 1.2em; }
	.thinking .elapsed { color: var(--faint); }
	.turn { margin: 0 0 1rem; white-space: pre-wrap; word-break: break-word; }
	.turn .who { display: flex; align-items: center; gap: .4rem; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .25rem; }
	.user { background: var(--panel); border-radius: 12px; padding: .55rem .8rem .6rem; width: fit-content; max-width: 100%; margin-left: auto; }
	.user .who { color: var(--gold); }
	.model .who { color: var(--faint); }
	.md { white-space: normal; }
	.md > :last-child { margin-bottom: 0; }
	.md p, .md ul, .md ol, .md pre, .md blockquote, .md table { margin: 0 0 .65rem; }
	.md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: 1em; font-weight: 600; margin: .9rem 0 .4rem; }
	.md h1 { font-size: 1.15em; } .md h2 { font-size: 1.07em; }
	.md ul, .md ol { padding-left: 1.4rem; }
	.md li { margin: .15rem 0; }
	.md li.task { list-style: none; margin-left: -1.2rem; }
	.md code { background: var(--panel); border-radius: 4px; padding: .05em .3em; }
	.md pre { white-space: pre; overflow-x: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: .6rem .75rem; }
	.md pre code { background: none; padding: 0; }
	.md blockquote { border-left: 2px solid var(--line-2); padding-left: .75rem; color: var(--dim); }
	.md hr { border: 0; border-top: 1px solid var(--line); margin: .9rem 0; }
	.md table { border-collapse: collapse; display: block; overflow-x: auto; }
	.md th, .md td { border: 1px solid var(--line); padding: .25rem .55rem; text-align: left; }
	.md a { color: var(--gold); }
	.say {
		border: 0; padding: 2px; margin: -2px 0; width: 22px; height: 18px; border-radius: 5px;
		color: var(--faint); display: inline-flex; align-items: center; justify-content: center;
	}
	.say svg.i { width: 14px; height: 14px; }
	.say:hover, .say.on { color: var(--gold); background: var(--panel); }
	.system { color: var(--dim); }
	.error { color: var(--err); }
	.tool {
		color: var(--phos); border-left: 2px solid var(--line-2); padding-left: .6rem;
		margin: 0 0 .7rem; font-size: 13px; white-space: pre-wrap; word-break: break-word;
	}
	.tool.fail { color: var(--err); border-left-color: var(--err); }
	/* Tool output: quieter than the chip that announced it, but readable. */
	.tool.result {
		color: var(--bone); background: var(--panel); border-left-color: var(--gold-dim);
		padding: .5rem .6rem; margin: -.3rem 0 .8rem; max-height: 15rem; overflow: auto;
		font-size: 12.5px; border-radius: 0 6px 6px 0;
	}
	.ask { border: 1px solid var(--gold-dim); border-radius: 8px; background: var(--panel); padding: .65rem; margin: 0 0 .9rem; }
	.ask .head { color: var(--gold); }
	.ask .subj { display: block; color: var(--dim); margin: .2rem 0 .6rem; word-break: break-all; white-space: pre-wrap; }
	.ask .row { display: flex; flex-wrap: wrap; gap: .4rem; }
	.ask.settled { border-color: var(--line); opacity: .75; }
	.ask.settled .row { display: none; }
	.ask .verdict { color: var(--dim); font-size: 12px; margin-left: .5rem; }
	.turn a, .system a { color: var(--gold); }

	/* ---- the composer: one box, a + and send inside, chips under it ---- */
	form {
		flex: none; position: relative; width: 100%; max-width: calc(var(--col) + 1.8rem); margin: 0 auto;
		padding: .3rem .9rem; padding-bottom: max(.55rem, env(safe-area-inset-bottom));
	}
	body.kb form { padding-bottom: .5rem; }   /* the keyboard covers the home bar, so no inset over it */
	.cbox {
		display: flex; flex-direction: column; border: 1px solid var(--line-2); border-radius: 14px;
		background: var(--panel); transition: border-color .15s;
	}
	.cbox:focus-within { border-color: var(--gold-dim); }
	textarea {
		display: block; width: 100%; resize: none; min-height: 2.9rem; max-height: 12rem;
		padding: .7rem .85rem .15rem; font: inherit; color: var(--bone); background: transparent; border: 0;
	}
	textarea:focus { outline: none; }
	textarea::placeholder { color: var(--faint); }
	.crow { display: flex; align-items: center; gap: .35rem; padding: .25rem .45rem .45rem; }
	.attach { font-size: 18px; line-height: 1; width: 32px; height: 30px; padding: 0; color: var(--dim); border-color: transparent; border-radius: 8px; }
	.attach:hover { color: var(--gold); background: var(--panel-2); border-color: transparent; }
	#send { border-radius: 9px; padding: .3rem .8rem; }
	/* Attachments sit on top of the field, as chips you can drop one by one. */
	.tray { display: flex; flex-wrap: wrap; gap: .35rem; padding: .55rem .6rem 0; }
	.chip {
		display: inline-flex; align-items: center; gap: .4rem; max-width: 100%;
		border: 1px solid var(--line-2); border-radius: 6px; background: var(--bg);
		color: var(--bone); font-size: 12px; padding: .2rem .5rem;
	}
	.chip .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.chip .rm { color: var(--faint); cursor: pointer; border: 0; background: none; font: inherit; padding: 0 .1rem; }
	.chip .rm:hover { color: var(--err); }
	.pills { display: flex; align-items: center; gap: .2rem; padding: .35rem .25rem 0; min-width: 0; }
	.pill {
		display: inline-flex; align-items: center; gap: .35rem; min-width: 0; max-width: 46%;
		border: 0; background: transparent; color: var(--dim); font-size: 12px; padding: .2rem .4rem; border-radius: 6px;
	}
	.pill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.pill .i { width: 14px; height: 14px; }
	.pill:hover { color: var(--bone); background: var(--panel-2); }
	.pill:disabled { opacity: .6; }
	.pills .sep { color: var(--faint); }
	.pending {
		flex: none; width: 100%; max-width: calc(var(--col) + 1.8rem); margin: 0 auto; text-align: left; border: 0;
		border-top: 1px solid var(--gold-dim); background: var(--panel-2); color: var(--gold); font: inherit; font-size: 12px;
		padding: .5rem .9rem; cursor: pointer; border-radius: 0;
	}
	.pending:hover { background: var(--panel); color: var(--gold); }

	/* the command menu: what `:` and `/` can do, over the composer */
	.cmdmenu {
		position: absolute; left: .9rem; right: .9rem; bottom: calc(100% - .2rem); z-index: 5;
		background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px;
		box-shadow: 0 10px 30px rgba(0,0,0,.18); max-height: min(19rem, 42vh); overflow-y: auto;
		overscroll-behavior: contain; padding: .3rem;
	}
	.cmd {
		display: flex; align-items: baseline; gap: .6rem; width: 100%; text-align: left;
		border: 1px solid transparent; border-radius: 8px; padding: .38rem .55rem; font-size: 13px; color: var(--bone);
	}
	.cmd:hover { border-color: transparent; background: var(--panel-2); color: var(--bone); }
	.cmd.sel { background: var(--panel-2); border-color: var(--line-2); }
	.cmd .n { flex: none; color: var(--gold); }
	.cmd .a { flex: none; color: var(--faint); }
	.cmd .d { flex: 1; min-width: 0; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.cmd .c { flex: none; color: var(--faint); font-size: 10.5px; letter-spacing: .06em; }

	/* ---- the landing: a greeting, the composer centered under it, recent files ---- */
	.hello, .below { display: none; }
	body.landing #log { display: none; }
	body.landing .hello {
		display: flex; flex: 1 1 0; min-height: 0; flex-direction: column; justify-content: flex-end; align-items: center;
		padding: 1rem 1rem 1.5rem;
	}
	body.landing .below {
		display: block; flex: 1 1 0; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
		width: 100%; max-width: calc(var(--col) + 1.8rem); margin: 0 auto; padding: 1.1rem 1.15rem 1rem;
	}
	.greet {
		display: flex; align-items: center; justify-content: center; gap: .65rem; text-align: center;
		font-family: var(--serif); font-size: clamp(25px, 4vw, 36px); line-height: 1.2; letter-spacing: -.005em;
		color: var(--bone); text-wrap: balance;
	}
	.greet svg { width: 1.05em; height: 1.05em; flex: none; }
	.greet .mk-off { fill: var(--gold); opacity: .16; }
	.greet .mk-on { fill: var(--gold); }
	.hello .sub { color: var(--faint); font-size: 12px; margin-top: .55rem; text-align: center; }
	.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .5rem; }
	.card {
		display: flex; flex-direction: column; gap: .15rem; min-width: 0; text-align: left;
		border: 1px solid var(--line); border-radius: 10px; background: var(--panel); padding: .55rem .65rem;
	}
	.card:hover { border-color: var(--gold-dim); color: var(--bone); }
	.card .nm { color: var(--bone); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
	.card .sub { color: var(--faint); font-size: 11px; }
	.below .label { display: flex; padding: 0 .1rem; }
	/* code, before a session is open: pick one of your computers' folders */
	.chooser {
		width: min(520px, 100%); margin-top: 1.1rem; border: 1px solid var(--line); border-radius: 12px;
		background: var(--panel); overflow: hidden; text-align: left;
	}
	.chooser .pick {
		display: flex; align-items: center; gap: .65rem; width: 100%; border: 0; border-bottom: 1px solid var(--line);
		border-radius: 0; padding: .6rem .8rem; font-size: 13px; text-align: left; background: transparent; color: var(--bone);
	}
	.chooser .pick:last-child { border-bottom: 0; }
	.chooser .pick:hover { background: var(--panel-2); color: var(--bone); }
	.chooser .pick .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
	.chooser .pick .sub { color: var(--faint); font-size: 11px; }
	.chooser .pick .ok { color: var(--gold); visibility: hidden; }
	.chooser .pick.sel .ok { visibility: visible; }

	/* ---- sheets ---- */
	.scrim {

		align-items: center; justify-content: center; padding: 1rem; z-index: 40;
	}
	.modal {

		width: min(620px, 100%); max-height: 84vh; display: flex; flex-direction: column; overflow: hidden;
	}
	.modal h2 {
		margin: 0; padding: .65rem .8rem; font-size: 11px; letter-spacing: .14em;
		text-transform: uppercase; color: var(--gold); border-bottom: 1px solid var(--line);

	.modal .foot { padding: .5rem; border-top: 1px solid var(--line); display: flex; gap: .4rem; align-items: center; }
	.modal .foot .grow { flex: 1; }
	.modal input {
		width: 100%; font: inherit; color: var(--bone); background: var(--bg);
		border: 1px solid var(--line-2); border-radius: 6px; padding: .4rem .5rem;
	}
	.modal input:focus { outline: none; border-color: var(--gold); }
	.opt {
		display: block; width: 100%; text-align: left; border: 1px solid transparent;
		background: transparent; color: var(--bone); font: inherit; padding: .4rem .55rem;

	/* A touch screen keeps :hover on the last row tapped; styled like .sel, that read as two selected. */
	@media (hover: hover) { .opt:not(.sel):hover { background: var(--bg); } }
	.opt .tag { color: var(--phos); font-size: 11px; }

		.cmdmenu { left: .6rem; right: .6rem; }

		body.kb.landing .below { display: none; }

<script>
/* ---------- wasm mode ----------
   Two carriers, one UI. When a `hako --serve` backend is present the page talks
   to it over HTTP, exactly as before. When there is no backend — the hosted site,
   a USB stick, an offline tab — the same agent runs here as WebAssembly in a
   worker, and this shim answers the same /api/* calls locally. The UI does not
   know the difference, which is the point: one front end, three shells.

   The worker runs one agent instance per turn. State lives in OPFS, so sessions
   and credentials persist between turns exactly as files do natively. */
/* `make site` stamps this on the hosted bundle. The native binary serves the
   same file without it, so one page really is one page. */
const HAKO_WASM_MODE = document.querySelector('meta[name="hako-mode"]')?.content === 'wasm';

/* ---------- code: your terminal sessions, through the relay (RELAY.md) ----------
   Signed in, the hosted page lists your open code sessions (each a folder on
   one of your computers) and drives one. Every byte
   between this page and the computer is sealed by hako.wasm (the same Noise C
   the desktop runs); the relay routes ciphertext and holds no key that opens
   it. #remote=<id> turns this page into that computer's front end: the same
   /api calls the LAN page makes, carried in numbered streams. */
const RELAY_URL = document.querySelector('meta[name="hako-relay"]')?.content || 'https://relay.mithraeum.studio';
/* Back from GitHub or Google (?code=&state=, or ?error=): which one, the
   fragment this page had before it left (a #pair= or #link= in progress)
   and the invite typed. */
const SSO_NAMES = { google: 'Google', github: 'GitHub' };
const SSO_BACK = (() => {
	try {
		const q = new URLSearchParams(location.search), was = JSON.parse(sessionStorage.getItem('hako-sso') || 'null');
		if (!was || !SSO_NAMES[was.p] || !q.get('state') || !(q.get('code') || q.get('error'))) return null;
		sessionStorage.removeItem('hako-sso');
		history.replaceState(null, '', location.pathname + (was.hash || ''));
		return { p: was.p, code: q.get('code') || '', state: q.get('state'), error: q.get('error') || '', hash: was.hash || '', invite: was.invite || '' };
	} catch (e) { return null; }
})();
const HASH = SSO_BACK ? SSO_BACK.hash : typeof location === 'object' ? location.hash : '';
const REMOTE_ID = (HASH.match(/^#remote=([0-9a-f]{32})$/) || [])[1] || '';
const LINK = HASH.match(/^#link=([0-9a-f]{64})\.([0-9a-f]{64})$/);
const PAIR = HASH.match(/^#pair=([0-9a-f]{32})\.([0-9a-f]{64})$/);
const INVITE = (HASH.match(/^#invite=([a-z0-9-]{10,16})$/i) || [])[1] || '';

/* a test turns this on (window.hakoDebug) to see the streams; off, it costs nothing */
const hakoTrace = (...a) => { (window.hakoLog = window.hakoLog || []).push((performance.now() / 1000).toFixed(2) + ' ' + a.join(' ')); };
const hex = (b) => Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
const unhex = (s) => new Uint8Array((s.match(/../g) || []).map((x) => parseInt(x, 16)));
const bin = (b) => { let s = ''; for (let i = 0; i < b.length; i += 8192) s += String.fromCharCode.apply(null, b.subarray(i, i + 8192)); return s; };
const b64 = (b) => btoa(bin(new Uint8Array(b)));
const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
const b64u = (b) => b64(b).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = (s) => unb64(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4));
const cat = (...p) => { const o = new Uint8Array(p.reduce((n, x) => n + x.length, 0)); let i = 0; for (const x of p) { o.set(x, i); i += x.length; } return o; };

/* hako.wasm's hkw_* exports in this page (the worker has its own instance).
   Bytes go in through hkw_in and come back through hkw_out; views are made
   fresh per call, since a call may grow memory and detach an old one. */
const hk = {
	ex: null,
	async load() {
		if (this.ex) return;
		const v = document.querySelector('meta[name="hako-build"]')?.content;
		const mod = await WebAssembly.compile(await (await fetch('hako.wasm' + (v ? '?v=' + v : ''))).arrayBuffer());
		const imp = {};
		let mem = null;
		for (const d of WebAssembly.Module.imports(mod)) {
			imp[d.module] = imp[d.module] || {};
			if (d.kind !== 'function') continue;
			imp[d.module][d.name] = d.name === 'random_get'
				? (p, n) => { for (let o = 0; o < n; o += 65536) crypto.getRandomValues(new Uint8Array(mem.buffer, p + o, Math.min(65536, n - o))); return 0; }
				: () => 52;                                  /* ENOSYS: the crypto needs nothing else */
		}
		const inst = await WebAssembly.instantiate(mod, imp);
		mem = inst.exports.memory;
		this.ex = inst.exports;
	},
	run(fn, input, ...args) {
		if (input) new Uint8Array(this.ex.memory.buffer, this.ex.hkw_in_ptr(), input.length).set(input);
		return this.ex[fn](...args);
	},
	out(n) { return new Uint8Array(this.ex.memory.buffer, this.ex.hkw_out_ptr(), n).slice(); },
	random(n) { this.run('hkw_random', null, n); return this.out(n); },
};

/* This browser's account state, in its own IndexedDB: the device key, the
   account key K, the account id and the passkey's credential id. */
const kv = (mode, fn) => new Promise((resolve) => {
	const rq = indexedDB.open('hako-account', 1);
	rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
	rq.onerror = () => resolve(null);
	rq.onsuccess = () => {
		const tx = rq.result.transaction('kv', mode);
		const r = fn(tx.objectStore('kv'));
		tx.oncomplete = () => resolve(r && r.result);
		tx.onerror = () => resolve(null);
	};
});
const kvGet = (k) => kv('readonly', (st) => st.get(k));
const kvSet = (k, v) => kv('readwrite', (st) => st.put(v, k));
const kvClear = () => kv('readwrite', (st) => st.clear());

const relay = {
	token: '', id: '', acct: '', s: null, at: 0,
	async req(method, path, body) {
		const headers = this.token ? { Authorization: 'Bearer ' + this.token } : {};
		const r = await fetch(RELAY_URL + path, { method, headers, body: method === 'POST' ? (body || '') : undefined });
		return { status: r.status, text: (await r.text()).trim() };
	},
	/* the device key proves itself: MAC keyed by X25519(s, the relay's one-off key).
	   A token lives an hour on the relay; reuse it for ten minutes, since sign-ins are rate limited. */
	/* One sign-in at a time: the relay keeps one token per device, so two at
	   once leave this page holding the one the relay replaced (a 401). */
	signIn() {
		if (this.token && Date.now() - this.at < 600000) return Promise.resolve();
		return this.signing || (this.signing = this.signInOnce().finally(() => { this.signing = null; }));
	},
	/* A reload keeps this tab's token (sessionStorage ends with the tab), so reopening
	   a code session skips two trips to the relay. The device key in IndexedDB can
	   mint a token anyway, so keeping one here exposes nothing new. */
	kept() { try { return JSON.parse(sessionStorage.getItem('relay') || 'null'); } catch (e) { return null; } },
	keep(v) { try { if (v) sessionStorage.setItem('relay', JSON.stringify(v)); else sessionStorage.removeItem('relay'); } catch (e) {} },
	forget() { this.token = ''; this.at = 0; this.keep(null); },   /* a 401: the relay replaced it */
	async signInOnce() {
		await hk.load();
		this.s = await kvGet('device');
		if (!this.s) { this.s = hk.random(32); await kvSet('device', this.s); }
		hk.run('hkw_pub', this.s);
		const o = hk.out(48);
		this.pub = o.slice(0, 32);
		const k = this.kept();
		/* the account may have come after the token; a device bound from another one
		   knows it only from the relay, so that one signs in */
		const known = k && k.pub === hex(this.pub) && Date.now() - k.at < 600000 ? await kvGet('acct') : null;
		if (known) { Object.assign(this, { token: k.token, id: k.id, acct: known, at: k.at }); return; }
		this.token = '';
		const c = await this.req('POST', '/v1/auth/challenge', hex(this.pub));
		if (c.status !== 200) throw new Error('can\u2019t connect right now. try again in a moment');
		const [cid, epub] = c.text.split(' ');
		if (hk.run('hkw_proof', cat(this.s, unhex(epub), unhex(cid)))) throw new Error('sign-in didn\u2019t work, try again');
		const p = await this.req('POST', '/v1/auth/prove', cid + ' ' + hex(hk.out(32)));
		if (p.status !== 200) throw new Error('sign-in didn\u2019t work, try again');
		const [tok, id, acct] = p.text.split(' ');
		this.token = tok; this.id = id; this.acct = acct === '-' ? '' : acct; this.at = Date.now();
		this.keep({ pub: hex(this.pub), token: tok, id, at: this.at });
	},
	async send(to, frame) {
		const r = await this.req('POST', '/v1/up', to + ' ' + b64(frame) + '\n');
		return r.status === 200;
	},
};

/* ---- signing in: a passkey (its prf unlocks K) or an emailed code ---- */
const PRF_SALT = new TextEncoder().encode('hako account key v1');

async function waChallenge() {
	const r = await relay.req('POST', '/v1/webauthn/challenge');
	if (r.status !== 200) throw new Error('can\u2019t connect right now. try again in a moment');
	return unb64u(r.text);
}

const prfOf = (cred) => {
	const f = cred.getClientExtensionResults().prf?.results?.first;
	return f ? new Uint8Array(f) : null;
};

/* K under this passkey's prf, stored on the relay for the next device. */
async function storeWrapped(credId, prf, K) {
	hk.run('hkw_wrap', cat(prf, K));
	await relay.req('POST', '/v1/passkey/key', credId + ' ' + b64u(hk.out(72)));
}

async function passkeyLogin() {
	const cred = await navigator.credentials.get({ publicKey: {
		challenge: await waChallenge(), rpId: location.hostname, userVerification: 'required',
		extensions: { prf: { eval: { first: PRF_SALT } } } } });
	const r = cred.response, credId = b64u(cred.rawId);
	const res = await relay.req('POST', '/v1/passkey/login',
		[credId, b64u(r.clientDataJSON), b64u(r.authenticatorData), b64u(r.signature)].join(' '));
	if (res.status !== 200) throw new Error(res.status === 409 ? 'this browser is signed in to another account' : 'that passkey was not accepted');
	const [acct, wrapped] = res.text.split(' ');
	const prf = prfOf(cred);
	let K = (await kvGet('acct')) === acct ? await kvGet('k') : null;
	if (wrapped !== '-' && prf) {
		if (hk.run('hkw_unwrap', cat(prf, unb64u(wrapped)))) throw new Error('the passkey did not open your account key');
		K = hk.out(32);
	} else if (prf && K) await storeWrapped(credId, prf, K);
	relay.acct = acct;
	await kvSet('acct', acct); await kvSet('cred', credId);
	if (K) await kvSet('k', K);
	return { acct, K, prf: !!prf };
}

async function passkeyCreate(invite) {
	const cred = await navigator.credentials.create({ publicKey: {
		rp: { name: 'hako', id: location.hostname },
		user: { id: crypto.getRandomValues(new Uint8Array(16)), name: 'hako', displayName: 'hako' },
		challenge: await waChallenge(),
		pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
		authenticatorSelection: { residentKey: 'required', userVerification: 'required' },
		extensions: { prf: { eval: { first: PRF_SALT } } } } });
	const r = cred.response, spki = r.getPublicKey && r.getPublicKey();
	if (!spki) throw new Error('this browser can\u2019t make a passkey hako can use');
	const credId = b64u(cred.rawId);
	const res = await relay.req('POST', '/v1/passkey/register',
		[relay.acct ? '-' : (invite || '-'), credId, b64u(r.clientDataJSON), b64u(r.getAuthenticatorData()), b64u(spki)].join(' '));
	if (res.status !== 200) throw new Error(res.status === 403 ? (relay.acct ? 'that passkey didn\u2019t work' : 'that invite didn\u2019t work') : 'that passkey didn\u2019t work (' + res.status + ')');
	const fresh = !relay.acct;
	relay.acct = res.text;
	await kvSet('acct', relay.acct); await kvSet('cred', credId);
	let K = await kvGet('k');
	if (fresh || !K) { K = hk.random(32); await kvSet('k', K); }
	let prf = prfOf(cred);
	if (!prf) {                                     /* some browsers answer prf only on a sign-in */
		const again = await navigator.credentials.get({ publicKey: {
			challenge: await waChallenge(), rpId: location.hostname, userVerification: 'required',
			allowCredentials: [{ type: 'public-key', id: cred.rawId }], extensions: { prf: { eval: { first: PRF_SALT } } } } });
		prf = prfOf(again);
	}
	if (prf) await storeWrapped(credId, prf, K);
	return { acct: relay.acct, K, prf: !!prf };
}

/* The sign-ins this relay offers: its health line says "mail" with a mailer, "github" and "google" once set up. */
async function relayHealth() {
	try { return await (await fetch(RELAY_URL + '/v1/health')).text(); } catch (e) { return ''; }
}

/* The relay's answer to an email, GitHub or Google sign-in, "<account> <new|old>".
   Neither carries K: a new account makes one, an old one waits for a passkey or :remote pair. */
async function accountIn(text) {
	const [acct, made] = text.split(' ');
	if (made === 'new' || (await kvGet('acct')) !== acct) await kvSet('k', made === 'new' ? hk.random(32) : null);
	relay.acct = acct;
	await kvSet('acct', acct);
	return { acct, K: await kvGet('k') };
}

/* What this browser calls itself to the account's other devices, sealed under K like a computer's name. */
function browserName() {
	const u = navigator.userAgent, touchMac = /Macintosh/.test(u) && navigator.maxTouchPoints > 1;
	const dev = /iPhone/.test(u) ? 'iPhone' : /iPad/.test(u) || touchMac ? 'iPad' : /Android/.test(u) ? 'Android'
		: /Mac/.test(u) ? 'Mac' : /Windows/.test(u) ? 'Windows' : /Linux/.test(u) ? 'Linux' : 'browser';
	const app = /Edg\//.test(u) ? 'Edge' : /CriOS|Chrome\//.test(u) ? 'Chrome' : /FxiOS|Firefox\//.test(u) ? 'Firefox' : /Safari\//.test(u) ? 'Safari' : '';
	return app ? dev + ' \u00b7 ' + app : dev;
}

/* K lives only on the devices that hold it: computers and browsers each list a
   name sealed under it, and a passkey may keep it wrapped. When none of those
   exist, nothing is sealed under the account's K and no one can hand it over,
   so this browser makes a new one rather than wait for a pairing that cannot
   come. A browser that holds K then lists itself, once per device key. */
async function settleKey() {
	if (!relay.acct) return;
	let K = await kvGet('k');
	if (!K) {
		const [d, a] = await Promise.all([relay.req('GET', '/v1/devices'), relay.req('GET', '/v1/account')]);
		if (d.status !== 200 || a.status !== 200) return;
		const held = d.text.split('\n').some((l) => { const f = l.split(' '); return f[0] !== relay.id && f[3] && f[3] !== '-'; });
		if (held || a.text.split(' ')[1] !== '0') return;
		K = hk.random(32);
		await kvSet('k', K);
	}
	if ((await kvGet('named')) === relay.id) return;
	const name = new TextEncoder().encode('browser:' + browserName());
	const n = hk.run('hkw_name_seal', cat(K, name), 32 + name.length);
	if (n > 0 && (await relay.req('POST', '/v1/name', b64u(hk.out(n)))).status === 200) await kvSet('named', relay.id);
}

/* GitHub or Google (p) sends the browser back here with a code; the relay trades
   it for the account id. Which one, the fragment and the invite ride along in
   this tab's sessionStorage. */
async function ssoStart(p, invite, pick) {
	const r = await relay.req('POST', '/v1/' + p + '/start'), name = SSO_NAMES[p];
	if (r.status !== 200) throw new Error(r.status === 503 ? name + ' sign-in is off right now' : 'can\u2019t reach ' + name + ' sign-in (' + r.status + ')');
	sessionStorage.setItem('hako-sso', JSON.stringify({ p, hash: HASH, invite }));
	/* switching accounts: GitHub asks which of its accounts (Google always does) */
	location.href = r.text + (pick && p === 'github' ? '&prompt=select_account' : '');
}

async function ssoVerify(back) {
	const name = SSO_NAMES[back.p];
	if (back.error) throw new Error(back.error === 'access_denied' ? name + ' sign-in was cancelled' : name + ' said: ' + back.error);
	const r = await relay.req('POST', '/v1/' + back.p + '/verify', back.code + ' ' + back.state + ' ' + (back.invite || '-'));
	if (r.status === 402) throw Object.assign(new Error('a new account needs an invite code. type it below'), { invite: true });
	if (r.status === 409) throw new Error('this browser is signed in to another account');
	if (r.status !== 200) throw new Error(r.status === 403 ? 'that ' + name + ' sign-in expired. try again' : name + ' sign-in failed (' + r.status + ')');
	return accountIn(r.text);
}

async function emailStart(addr) {
	const r = await relay.req('POST', '/v1/email/start', addr.trim());
	if (r.status !== 200) throw new Error(r.status === 400 ? 'that address does not look right' : r.text || 'could not send a code');
}

async function emailVerify(code, invite) {
	const r = await relay.req('POST', '/v1/email/verify', code.trim() + ' ' + (invite.trim() || '-'));
	if (r.status === 402) throw Object.assign(new Error('a new account needs an invite code. type it below'), { invite: true });
	if (r.status !== 200) throw new Error(r.status === 403 ? 'wrong or expired code' : 'sign-in failed (' + r.status + ')');
	return accountIn(r.text);
}

/* A sign-in that stopped at "invite needed": the relay kept who it was for ten
   minutes, so the invite finishes it without asking GitHub, Google or the inbox again. */
async function inviteFinish(invite) {
	const r = await relay.req('POST', '/v1/invite', invite.trim() || '-');
	if (r.status === 402) throw new Error('that invite didn\u2019t work');
	if (r.status === 403) throw new Error('that sign-in expired. sign in again');
	if (r.status !== 200) throw new Error('sign-in failed (' + r.status + ')');
	return accountIn(r.text);
}

/* Another browser of this account opened this one's pair code: answer its ask
   (a 4 frame) with K and the account id sealed under the code's secret, as
   :remote pair does on a computer. Resolves with that device's id; one use. */
async function pairHost(secret, K, signal) {
	const r = await fetch(RELAY_URL + '/v1/down', { headers: { Authorization: 'Bearer ' + relay.token }, signal });
	if (!r.ok) throw new Error('can\u2019t connect right now');
	const rd = r.body.getReader(), dec = new TextDecoder();
	let buf = '';
	for (;;) {
		const v = await rd.read();
		if (v.done) throw new Error('the connection dropped. open add a device again');
		buf += dec.decode(v.value, { stream: true });
		let i;
		while ((i = buf.indexOf('\n')) >= 0) {
			const line = buf.slice(0, i), from = line.slice(0, 32);
			buf = buf.slice(i + 1);
			if (!/^[0-9a-f]{32} /.test(line) || line.slice(33) !== b64(new Uint8Array([4]))) continue;
			hk.run('hkw_link', cat(secret, K, new TextEncoder().encode(relay.acct)));
			if (await relay.send(from, cat(new Uint8Array([4]), hk.out(88)))) return from;
		}
	}
}

/* text as a QR code (hako.c's encoder), dark on light with its quiet zone. */
function qrSvg(text) {
	const t = new TextEncoder().encode(text), n = hk.run('hkw_qr', t, t.length);
	if (n <= 0) return null;
	const m = hk.out(n * n), z = 4;
	let d = '';
	for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y * n + x]) d += 'M' + (x + z) + ' ' + (y + z) + 'h1v1h-1z';
	const t2 = document.createElement('template');
	t2.innerHTML = '<svg class="qr" viewBox="0 0 ' + (n + 2 * z) + ' ' + (n + 2 * z) + '" shape-rendering="crispEdges" role="img" aria-label="pair code">'
		+ '<rect width="100%" height="100%" fill="#fff"/><path fill="#000" d="' + d + '"/></svg>';
	return t2.content.firstChild;
}

/* The link page (#link=<computer pub>.<secret>): bind that computer to this
   account, then send it K sealed under the secret from this URL's fragment,
   which no server ever saw. */
async function linkComputer(pubHex, secretHex) {
	const K = await kvGet('k');
	if (!K) throw new Error('this browser does not hold your account key yet. add it from a device that has it (account, add a device), or use your passkey, then open this link again');
	const b = await relay.req('POST', '/v1/bind', pubHex);
	if (b.status !== 200) throw new Error(b.status === 409 ? 'that computer is linked to another account' : 'could not link (' + b.status + ')');
	hk.run('hkw_id', unhex(pubHex));
	const id = hex(hk.out(16));
	hk.run('hkw_link', cat(unhex(secretHex), K, new TextEncoder().encode(relay.acct)));
	if (!(await relay.send(id, cat(new Uint8Array([3]), hk.out(88))))) throw new Error('couldn\u2019t reach that computer, try again');
	history.replaceState(null, '', location.pathname);    /* the secret leaves the address bar */
}

/* The pair page (#pair=<computer id>.<secret>, from :remote pair's QR code):
   ask that hako for K, which it seals under the secret in this URL's fragment,
   so the relay carrying the answer cannot open it. One use, ten minutes. */
async function pairDevice(idHex, secretHex) {
	const ctl = new AbortController();
	try {
		await relay.signIn();
		if (!relay.acct) throw new Error('sign in first');
		const r = await fetch(RELAY_URL + '/v1/down', { headers: { Authorization: 'Bearer ' + relay.token }, signal: ctl.signal });
		if (!r.ok) throw new Error('can\u2019t connect right now');
		const rd = r.body.getReader(), dec = new TextDecoder();
		const answer = (async () => {
			let buf = '';
			for (;;) {
				let v;
				try { v = await rd.read(); } catch (e) { return null; }
				if (v.done) return null;
				buf += dec.decode(v.value, { stream: true });
				let i;
				while ((i = buf.indexOf('\n')) >= 0) {
					const line = buf.slice(0, i); buf = buf.slice(i + 1);
					if (line === '! offline ' + idHex) return null;
					if (!line.startsWith(idHex + ' ')) continue;
					const f = unb64(line.slice(33));
					if (f[0] === 4 && f.length === 89) return f.subarray(1);
				}
			}
		})();
		await new Promise((res) => setTimeout(res, 150));
		if (!(await relay.send(idHex, new Uint8Array([4])))) throw new Error('couldn\u2019t reach that computer, try again');
		const m = await Promise.race([answer, new Promise((res) => setTimeout(() => res(null), 10000))]);
		if (!m) throw new Error('no answer. a code works once, for 10 minutes: run :remote pair again');
		if (hk.run('hkw_link_open', cat(unhex(secretHex), m))) throw new Error('that code doesn\u2019t match. run :remote pair again');
		const o = hk.out(48), acct = new TextDecoder().decode(o.subarray(32)).replace(/\0+$/, '');
		if (acct !== relay.acct) throw new Error('that computer is signed in to a different account');
		await kvSet('k', o.slice(0, 32));
		await kvSet('acct', relay.acct);
	} finally {
		ctl.abort();
		history.replaceState(null, '', location.pathname);    /* the secret leaves the address bar */
	}
}

/* The account's open code sessions: each seals "code:<host>\t<folder>" under
   K, so only a device holding K can tell a session from a browser, or read it. */
async function codeSessions() {
	const K = await kvGet('k');
	if (!relay.acct || !K) return [];
	const r = await relay.req('GET', '/v1/devices');
	if (r.status !== 200) return [];
	const out = [];
	for (const l of r.text.split('\n').filter(Boolean)) {
		const [id, , online, sealed] = l.split(' ');
		if (!sealed || sealed === '-') continue;
		const blob = unb64u(sealed), n = hk.run('hkw_name_open', cat(K, blob), 32 + blob.length);
		const name = n > 0 ? new TextDecoder().decode(hk.out(n)) : '';
		if (online !== '1' || !name.startsWith('code:')) continue;
		const [host, dir] = name.slice(5).split('\t');
		out.push({ id, host: host || 'computer', dir: dir || '', name: (dir || '').split('/').filter(Boolean).pop() || host });
	}
	return out;
}

/* ---- the remote carrier: this page's /api, sealed, to one computer ---- */
let remote = null;
if (REMOTE_ID) {
	const enc = new TextEncoder(), dec = new TextDecoder();
	const streams = new Map();
	let nextSid = 1, ready = null, outq = [], sending = false;
	let gen = 0, reader = null, heard = Date.now(), coming = false;

	/* One upload at a time keeps the frames in order. Frames queued in the same
	   moment (the handshake's last message and the first requests) wait a tick
	   to go as one upload instead of one trip each. */
	const flush = async () => {
		if (sending) return;
		sending = true;
		await new Promise((r) => setTimeout(r, 0));
		while (outq.length) {
			const batch = outq.splice(0, 32).map((f) => REMOTE_ID + ' ' + b64(f) + '\n').join('');
			let r;
			try { r = await relay.req('POST', '/v1/up', batch); } catch (e) { break; }
			if (r.status === 401) { relay.forget(); if (reader) reader.cancel().catch(() => {}); break; }   /* reconnects, signed in again */
		}
		sending = false;
	};
	const frame = (kind, body) => { outq.push(cat(new Uint8Array([kind]), body)); flush(); };
	/* sealed in send order, so the computer's nonce count stays in step */
	const sendOp = (sid, op, data) => {
		const p = cat(new Uint8Array([sid >>> 24, (sid >>> 16) & 255, (sid >>> 8) & 255, sid & 255, op]), data || new Uint8Array(0));
		const n = hk.run('hkw_seal', p, p.length);
		if (n > 0) frame(2, hk.out(n));
	};

	let hsWait = null;
	const onFrame = (f) => {
		if (f[0] === 1 && hsWait) { const w = hsWait; hsWait = null; w(f.subarray(1)); return; }
		if (f[0] !== 2) return;
		const n = hk.run('hkw_open', f.subarray(1), f.length - 1);
		if (n < 5) return;
		const p = hk.out(n);
		const sid = ((p[0] << 24) | (p[1] << 16) | (p[2] << 8) | p[3]) >>> 0, st = streams.get(sid);
		if (window.hakoDebug) hakoTrace('[remote] frame sid', sid, 'op', p[4], 'len', n - 5, st ? '' : '(no stream)');
		if (!st) return;
		if (p[4] === 1) st.data(p.subarray(5)); else { streams.delete(sid); st.end(); }
	};

	const down = async () => {
		const r = await fetch(RELAY_URL + '/v1/down', { headers: { Authorization: 'Bearer ' + relay.token } });
		if (r.status === 401) relay.forget();   /* the next try signs in again */
		if (!r.ok) throw new Error('can\u2019t connect right now');
		const rd = r.body.getReader(), mine = ++gen;
		reader = rd; heard = Date.now();
		let buf = '';
		(async () => {
			for (;;) {
				let value, done;
				try { ({ value, done } = await rd.read()); } catch (e) { break; }   /* a reload or a dropped network */
				if (done) break;
				heard = Date.now();
				if (window.hakoDebug) hakoTrace('[remote] down', value.length);
				buf += dec.decode(value, { stream: true });
				let i;
				while ((i = buf.indexOf('\n')) >= 0) {
					const line = buf.slice(0, i); buf = buf.slice(i + 1);
					if (line.startsWith(REMOTE_ID + ' ')) onFrame(unb64(line.slice(33)));
					else if (line === '! offline ' + REMOTE_ID && hsWait) { const w = hsWait; hsWait = null; w(null); }
				}
			}
			if (mine === gen) lost();
		})();
	};

	const fatal = (m) => Object.assign(new Error(m), { fatal: true });
	const connect = async () => {
		if (window.hakoDebug) hakoTrace('[remote] connect');
		await relay.signIn();
		const K = await kvGet('k');
		if (!relay.acct || !K) throw fatal('sign in on this device first');
		await down();                          /* the relay lists the stream before it answers, so frames can go now */
		hk.run('hkw_session', cat(relay.s, K));
		const msg2 = new Promise((r) => { hsWait = r; setTimeout(() => { if (hsWait === r) { hsWait = null; r(null); } }, 8000); });
		frame(1, hk.out(hk.run('hkw_hs_write', null, 0)));
		const m2 = await msg2;
		if (!m2) throw new Error('that computer is not answering. is :remote on?');
		if (hk.run('hkw_hs_read', m2, m2.length) < 0) throw fatal('that computer has a different account key');
		frame(1, hk.out(hk.run('hkw_hs_write', null, 0)));
		if (!hk.ex.hkw_ready()) throw new Error('the session did not finish');
	};
	ready = connect();

	/* The stream died (a network change, a phone waking up): connect again in
	   the background, and every open EventSource reopens and replays. Only a
	   key problem gives up; a computer that is asleep is retried. */
	const lost = () => {
		if (coming) return;
		coming = true;
		outq.length = 0;                       /* sealed for the old session */
		ready = (async () => {
			for (let wait = 300; ; wait = Math.min(wait * 2, 15000)) {
				await new Promise((r) => setTimeout(r, wait));
				while (document.hidden) await new Promise((r) => document.addEventListener('visibilitychange', r, { once: true }));
				try { await connect(); coming = false; window.dispatchEvent(new Event('hako-remote-back')); return; }
				catch (e) {
					if (window.hakoDebug) hakoTrace('[remote] retry', e.message);
					if (e.fatal) { coming = false; window.dispatchEvent(new CustomEvent('hako-remote-lost', { detail: e.message })); throw e; }
					window.dispatchEvent(new CustomEvent('hako-remote-retry', { detail: e.message }));
				}
			}
		})();
		ready.catch(() => {});
		for (const st of streams.values()) st.end(true);
		streams.clear();
	};
	/* A phone back from sleep can hold a stream that died without a word: the
	   relay writes every 25 s, so a longer silence means it is gone. */
	const stale = () => { if (!coming && reader && !document.hidden && Date.now() - heard > 40000) reader.cancel().catch(() => {}); };
	document.addEventListener('visibilitychange', stale);
	window.addEventListener('online', stale);
	setInterval(stale, 10000);

	/* one HTTP exchange over a new stream; the reply ends when the computer closes it */
	const open = async (head, body, onData, onEnd) => {
		await ready;
		const sid = nextSid++;
		streams.set(sid, { data: onData, end: onEnd });
		if (window.hakoDebug) hakoTrace('[remote] open', sid, head.split('\r\n')[0]);
		const req = cat(enc.encode(head), body || new Uint8Array(0));
		for (let o = 0; o < req.length || o === 0; o += 48000) { sendOp(sid, 1, req.subarray(o, o + 48000)); if (!req.length) break; }
		return sid;
	};
	const reqHead = (method, url, n) => method + ' ' + url + ' HTTP/1.1\r\nHost: relay\r\nContent-Type: text/plain\r\nContent-Length: ' + n + '\r\n\r\n';

	const origFetch = window.fetch.bind(window);
	const asking = new Map();   /* GETs on their way: the page asks for the same list from several places at once */
	window.fetch = async (input, init) => {
		const url = typeof input === 'string' ? input : input.url;
		if (window.hakoDebug) hakoTrace('[remote] fetch', url);
		if (!url.startsWith('/api/')) return origFetch(input, init);
		const method = (init && init.method) || 'GET';
		if (method !== 'GET') return carry(method, url, init);
		let p = asking.get(url);
		if (!p) { p = carry(method, url, init).finally(() => asking.delete(url)); asking.set(url, p); }
		return (await p).clone();
	};
	const carry = async (method, url, init) => {
		let body = init && init.body != null ? init.body : null;
		body = body == null ? null : typeof body === 'string' ? enc.encode(body) : new Uint8Array(await new Response(body).arrayBuffer());
		const parts = [];
		await new Promise((resolve, reject) => {
			open(reqHead(method, url, body ? body.length : 0), body, (d) => parts.push(d.slice()), (lost) => (lost ? reject(new Error('connection lost')) : resolve()))
				.catch(reject);
		});
		const all = cat(...parts), text = bin(all.subarray(0, Math.min(all.length, 4096)));
		const he = text.indexOf('\r\n\r\n');
		const status = parseInt(text.slice(9, 12), 10) || 502;
		const headers = new Headers();
		for (const l of text.slice(0, he).split('\r\n').slice(1)) { const c = l.indexOf(':'); if (c > 0) headers.append(l.slice(0, c), l.slice(c + 1).trim()); }
		return new Response(status === 204 ? null : all.subarray(he + 4), { status, headers });
	};

	/* /api/events, parsed as it streams */
	window.EventSource = class {
		constructor(url) {
			this.onopen = null; this.onmessage = null; this.onerror = null;
			const fail = () => { if (this.onerror) this.onerror(new Event('error')); };
			const start = () => {
				let buf = '', head = true;
				const td = new TextDecoder();
				open(reqHead('GET', url, 0), null, (d) => {
					buf += td.decode(d, { stream: true });
					if (head) { const i = buf.indexOf('\r\n\r\n'); if (i < 0) return; buf = buf.slice(i + 4); head = false; if (this.onopen) this.onopen(); }
					let i;
					while ((i = buf.indexOf('\n\n')) >= 0) {
						const ev = buf.slice(0, i); buf = buf.slice(i + 2);
						const data = ev.split('\n').filter((l) => l.startsWith('data: ')).map((l) => l.slice(6)).join('\n');
						if (data && this.onmessage) this.onmessage({ data });
					}
				}, (dropped) => { fail(); if (dropped && !this.closed) start(); }).catch(fail);   /* the reopen waits for the new session */
			};
			start();
		}
		close() { this.closed = true; }
	};
	remote = { ready };
}

/* ---- the account sheet ---- */
/* The providers' own marks (GitHub's octicon, Google's G), a key for a passkey,
   an envelope for email. Fixed strings, never built from input. */
const ICONS = {

			let obj;
			try { obj = JSON.parse(m.line); } catch (e) { return; }
			if (collecting) {
				if (obj.type === 'message' && obj.role === 'system') { collecting.lines.push(obj.text || ''); return; }
				if (obj.type === 'done') { collecting.finish(); return; }
				return;                       /* a collected command speaks to us, not the transcript */
			}
			emit(obj);
			if (obj.type === 'done' && askAfterTurn) {
				const q = askAfterTurn;
				askAfterTurn = null;
				emit({ type: 'input_request', prompt: q.prompt, hidden: q.hidden });
			}
			return;
		}
		if (m.type === 'log') console.debug('[hako]', m.line);
		if (m.type === 'error') emit({ type: 'error', text: m.error });
	};
	worker.postMessage({ type: 'boot', wasmUrl: 'hako.wasm' });

	const run = (lines) => worker.postMessage({ type: 'run', lines });

	/* Some routes need data only the agent has (its provider table, its model
	   catalog). Rather than copy that into JS — where it would drift the moment
	   hako.c changed — run the command and collect what it prints. */
	/* Request/response over postMessage: routes that read stored state ask the
	   worker and await the matching reply. */
	let askSeq = 0;
	const asking = new Map();
	const ask = (type, extra) => new Promise((resolve) => {
		const id = ++askSeq;
		asking.set(id, resolve);
		worker.postMessage({ type, id, ...extra });
		setTimeout(() => { if (asking.has(id)) { asking.delete(id); resolve(null); } }, 4000);
	});

	/* The agent announces its provider and model in every init event, and only a
	   turn produces one. Run a silent command at boot so the header is right
	   before the user touches anything. */
	whenConfig.then(() => runCollect(':session'));

	let collecting = null;
	const runCollect = (cmd) => new Promise((resolve) => {
		const lines = [];
		collecting = { lines, resolve };
		const done = () => { collecting = null; resolve(lines); };
		const timer = setTimeout(done, 5000);
		collecting.finish = () => { clearTimeout(timer); done(); };
		run([JSON.stringify({ type: 'slash', cmd })]);
	});

	/* The UI's HTTP calls, answered in-page. Same routes, same shapes. */
	const routes = {
		'/api/state': async () => (await whenConfig, {
			awaiting_code: pendingCode ? 1 : 0,
			version: (agentVersion || '') + ' wasm' + (buildId ? ' b' + buildId.slice(-5) : ''),
			dir: workDir, home: folderName ? workDir : WORKSPACE,
			root: folderName ? '' : WORKSPACE, places: [],
			folder: folderName,
			provider: config.provider, model: config.model, session: curSession, turns: 0,
			busy: 0, yolo: 0,
			awaiting_input: (pendingKey || pendingCode) ? 1 : 0,
			input_hidden: pendingKey ? 1 : 0,
			input_prompt: pendingKey ? ('paste your ' + pendingKey + ' API key')
			            : pendingCode ? 'paste the code shown on that page' : '',
			caps: ['prompt', 'slash', 'input', 'events', 'models', 'providers', 'sessions',
			       'history', 'rename', 'delete', 'dirs', 'files', 'open', 'mkdir',
			       'upload', 'save', 'wasm']
			      .concat(window.showDirectoryPicker ? ['pickfolder'] : []),
		}),
		'/api/sessions': async () => {
			const r = await ask('sessions');
			return { dir: workDir, current: curSession,
			         sessions: (r && r.sessions) || [] };
		},
		'/api/dirs': async (query) => {
			const r = await ask('dirs', { path: query.get('path') || workDir });
			return r || { path: workDir, dirs: [], files: [] };
		},
		'/api/models': async () => {
			const lines = await runCollect(':models list');
			const catalog = lines
				.map((l) => l.trim().replace(/^[◎●*>]\s*/, ''))
				.filter((l) => l && !/\s/.test(l));
			return { installed: [], found: [], known: [], catalog, provider: config.provider, model: config.model };
		},
		'/api/providers': async () => {
			const lines = await runCollect(':providers list');
			const providers = [];
			for (const l of lines) {
				const m = l.match(/^\s*([◎*\s]*)\s*([a-z][a-z0-9-]+)\s{2,}(.+)$/);
				if (m) providers.push({
					name: m[2], desc: m[3].trim(), kind: 'key',
					saved: m[1].includes('*'), active: m[1].includes('◎'),
				});
			}
			return { active: config.provider, providers };
		},
	};

	const origFetch = window.fetch.bind(window);
	window.fetch = async (input, init) => {
		const url = typeof input === 'string' ? input : input.url;
		if (!url.startsWith('/api/')) return origFetch(input, init);
		const path = url.split('?')[0];
		const query = new URLSearchParams(url.split('?')[1] || '');
		const body = init && init.body ? String(init.body) : '';

		if (path === '/api/prompt') {
			emit({ type: 'message', role: 'user', text: body });   /* the agent never replays it */
			if (!config.has_key) { pendingPrompt = body; needKey(config.provider || 'gemini'); return json({ ok: true }); }
			run([JSON.stringify({ type: 'prompt', text: body })]);
			return json({ ok: true });
		}
		if (path === '/api/slash') {
			/* `:login` opens an OAuth loopback the browser cannot host, so in this
			   build it becomes what it can be: paste a key. The key is written to
			   the agent's own ~/.hakorc in OPFS and never touches this page again. */
			/* Switching sessions is navigation, not conversation. */
			if (!/^[:/](resume|session)\b/.test(body)) emit({ type: 'message', role: 'user', text: body });
			const m = body.match(/^[:/]login\s+(\S+)(?:\s+(.*))?$/);
			if (m) {
				const p = m[1], rest = (m[2] || '').trim();

				/* OAuth cannot complete from a web page for any provider here: the
				   token endpoints refuse cross-origin requests. Anthropic's allows
				   only console.anthropic.com; GitHub's device endpoint sends no CORS
				   headers at all. The key-paste variants have no such problem. */
				const OAUTH_BLOCKED = {
					anthropic: 'anthropic-api',
					chatgpt: 'openai',
					codex: 'openai',
					openrouter: 'openrouter-api',
					copilot: null,
					'github-models': null,
				};
				if (p in OAUTH_BLOCKED) {
					const alt = OAUTH_BLOCKED[p];
					emit({ type: 'message', role: 'system',
					       text: p + ' signs in with OAuth, and its token endpoint refuses requests from a '
					           + 'web page. Run `hako --serve` on a machine to use it there.'
					           + (alt ? ' Here, `:login ' + alt + '` takes an API key.' : '') });
					endTurn();
					return json({ ok: true });
				}
				needKey(p);
				return json({ ok: true });
			}
			const res = body.match(/^[:/]resume\s+(\S+)/);
			if (res) { await ask('session-use', { session: res[1] }); curSession = res[1]; endTurn(); return json({ ok: true }); }
			if (/^[:/]session\s+new\b/.test(body)) {
				await ask('session-use', { session: null });
				curSession = '';
				emit({ type: 'message', role: 'system', text: 'new session' });
				endTurn();
				return json({ ok: true });
			}
			run([JSON.stringify({ type: 'slash', cmd: body })]);
			return json({ ok: true });
		}
		if (path === '/api/input') {
			if (pendingCode) {
				const provider = pendingCode;
				pendingCode = null;
				if (body) run([JSON.stringify({ type: 'slash', cmd: ':login ' + provider + ' ' + body })]);
				else { emit({ type: 'message', role: 'system', text: '(no code entered)' }); endTurn(); }
				return json({ ok: true });
			}
			if (pendingKey) {
				const provider = pendingKey;
				pendingKey = null;
				if (body) {
					/* Config first, then the provider switch, then whatever the user
					   was originally trying to do — in one run, so the key is in
					   place before the turn that needs it. */
					worker.postMessage({ type: 'config', patch: { ai_provider: provider, ai_api_key: body } });
					emit({ type: 'message', role: 'system', text: 'key saved for ' + provider + ' — stored on this device only' });
					const lines = [JSON.stringify({ type: 'slash', cmd: ':provider ' + provider })];
					if (pendingPrompt) { lines.push(JSON.stringify({ type: 'prompt', text: pendingPrompt })); pendingPrompt = null; }
					run(lines);
				} else {
					pendingPrompt = null;
					emit({ type: 'message', role: 'system', text: '(no key entered)' });
					endTurn();
				}
			}
			return json({ ok: true });
		}
		if (path === '/api/events') return sse();
		if (path === '/api/session/delete') {
			await ask('session-delete', { session: body });
			if (curSession === body) curSession = '';
			return json({ ok: true });
		}
		if (path === '/api/session/rename') {
			const nl = body.indexOf('\n');
			await ask('session-rename', { session: body.slice(0, nl), title: body.slice(nl + 1) });
			return json({ ok: true });
		}
		if (path === '/api/upload') {
			/* Text only: the store holds strings. */
			const name = (query.get('name') || 'file').split('/').pop();
			const into = query.get('dir') || workDir;
			const buf = new Uint8Array(await init.body.arrayBuffer());
			if (buf.includes(0)) {
				emit({ type: 'message', role: 'system',
				       text: name + ' looks binary — the browser build stores text files only' });
				return json({ ok: false });
			}
			const text = new TextDecoder().decode(buf);
			const r = await ask('file-write', { path: into.replace(/\/$/, '') + '/' + name, text });
			if (r && r.ok) emit({ type: 'message', role: 'system',
			                      text: 'added ' + name + ' (' + buf.length + ' bytes) to ' + into });
			return json({ ok: !!(r && r.ok) });
		}
		if (path === '/api/find') return json({ candidates: [] });
		if (path === '/api/file/delete') {
			const r = await ask('file-delete', { path: body });
			return json({ ok: !!(r && r.ok) });
		}
		if (path === '/api/file') {
			const r = await ask('file-read', { path: query.get('path') || '' });
			if (!r || r.text === null || r.text === undefined) return new Response('', { status: 404 });
			return new Response(r.text, { headers: { 'Content-Type': 'text/plain' } });
		}
		if (path === '/api/mkdir') {
			await ask('mkdir', { path: body });
			return json({ ok: true });
		}
		if (path === '/api/open') {
			const target = body || '/work';
			const r = await ask('open', { path: target });
			workDir = (r && r.path) || target;
			/* Re-announce, so the header and sessions reflect the new folder. */
			run([JSON.stringify({ type: 'slash', cmd: ':sessions' })]);
			return json({ ok: true });
		}
		if (path.startsWith('/api/history')) {
			const id = query.get('id') || '';
			const r = await ask('history', { session: id });
			return json({ messages: (r && r.messages) || [] });
		}
		const fn = routes[path];
		return json(fn ? await fn(query) : { ok: true });
	};

	/* No HTTP body can carry a directory handle, so this is not a route. */
	window.hakoMountFolder = async (handle) => {
		const r = await mountFolder(handle);
		if (handle) await rememberFolder(handle); else await forgetFolder();
		return !!(r && r.path);
	};

	const json = (o) => new Response(JSON.stringify(o), { headers: { 'Content-Type': 'application/json' } });

	/* Ask for a key using the same box the native build uses for OAuth codes. */
	/* Where each provider hands out a key. The native build opens this in a
	   browser; here the page is the browser, so it goes in the message. */
	const KEY_URL = {
		gemini: 'https://aistudio.google.com/apikey',
		openai: 'https://platform.openai.com/api-keys',
		'anthropic-api': 'https://console.anthropic.com/settings/keys',
		anthropic: 'https://console.anthropic.com/settings/keys',
		groq: 'https://console.groq.com/keys',
		deepseek: 'https://platform.deepseek.com/api_keys',
		mistral: 'https://console.mistral.ai/api-keys',
		cerebras: 'https://cloud.cerebras.ai',
		openrouter: 'https://openrouter.ai/keys',
		nous: 'https://portal.nousresearch.com',
		xai: 'https://console.x.ai',
		together: 'https://api.together.ai/settings/api-keys',
		fireworks: 'https://fireworks.ai/api-keys',
	};

	/* Anything that answers without running the agent must still end the turn:
	   the UI's spinner stops on `done`, and without one it spins forever. */
	const endTurn = () => emit({ type: 'done', turn: 0, in: 0, out: 0, session: '' });

	const needKey = (provider) => {
		if (!provider || provider === 'none') {
			emit({ type: 'message', role: 'system',
			       text: 'This runs entirely in your browser, so it needs a provider and your own API key. '
			           + 'Pick a provider first: :provider, or settings.' });
			endTurn();
			return;
		}
		pendingKey = provider;
		const url = KEY_URL[provider];
		emit({ type: 'message', role: 'system',
		       text: 'This runs entirely in your browser, so it needs your own API key. '
		           + 'It is stored on this device and sent only to ' + provider + '.' });
		if (url) emit({ type: 'message', role: 'system', text: 'Get one here: ' + url });
		emit({ type: 'input_request', prompt: 'paste your ' + provider + ' API key', hidden: 1 });
		endTurn();
	};

	/* EventSource wants a stream; give it one fed by the worker. */
	const sse = () => new Response(new ReadableStream({
		start(controller) {
			const enc = new TextEncoder();
			const push = (o) => controller.enqueue(enc.encode('data: ' + JSON.stringify(o) + '\n\n'));
			ring.forEach(push);
			listeners.push(push);
		},
	}), { headers: { 'Content-Type': 'text/event-stream' } });

	/* EventSource itself cannot be intercepted by patching fetch, so give the UI
	   one that reads from the same in-page stream. */
	window.EventSource = class {
		constructor() {
			this.onopen = null; this.onmessage = null; this.onerror = null;
			setTimeout(() => {
				if (this.onopen) this.onopen();
				ring.forEach((o) => this.onmessage && this.onmessage({ data: JSON.stringify(o) }));
				listeners.push((o) => this.onmessage && this.onmessage({ data: JSON.stringify(o) }));
			}, 0);
		}
		close() {}
	};
}

const TERMINAL = {

	const p = (h) => [1, 3, 5].map((i) => parseInt(h.slice(i, i + 2), 16));

		else if (m[2] !== undefined || m[3] !== undefined) el('strong', m[2] !== undefined ? m[2] : m[3]);
		else if (m[4] !== undefined) el('del', m[4]);
		else if (m[5] !== undefined) el('em', m[5]);
		else if (m[7] !== undefined) el('em', m[7]);

		if (f) {

			flush(); const h = document.createElement('h' + f[1].length); mdInline(h, f[2]); out.appendChild(h); continue;
