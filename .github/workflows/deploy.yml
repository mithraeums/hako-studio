name: build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [agent-updated]
  schedule:
    - cron: '17 6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/mithraeums/hako-code/main/hako.c -o hako.c
          printf 'hako.c: %s lines\n' "$(wc -l < hako.c | tr -d ' ')"
          grep -m1 'define HAKO_VERSION' hako.c

      - name: Build
        run: |
          make site \
            WASI_DIR=$HOME/wasi-sdk \
            WASI_URL=https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz

      - name: Check
        run: make check

      - name: Domain
        run: echo 'hako.mithraeum.studio' > dist/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
