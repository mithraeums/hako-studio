name: release

# A tag publishes a GitHub release: the built site (the same files the deploy serves, ready
# to host anywhere static) and that version's CHANGELOG section as the notes. Run it by hand
# with a tag to release one that was tagged before this workflow existed.
on:
  push:
    tags:
      - "v0.*"
      - "v[1-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

# no AppleDouble ._ files in the tarball
env:
  COPYFILE_DISABLE: 1

jobs:
  release:
    name: publish release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then t=$INPUT_TAG; else t=${GITHUB_REF#refs/tags/}; fi
          case "$t" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "not a version tag: $t"; exit 1;; esac
          case "$t" in *[!v0-9.]*) echo "not a version tag: $t"; exit 1;; esac
          echo "tag=$t" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Fetch the agent
        run: |
          curl -fsSL https://raw.githubusercontent.com/mithraeums/hako-code/main/hako.c -o hako.c
          grep -m1 'define HAKO_VERSION' hako.c

      - name: Build
        run: |
          make site \
            WASI_DIR=$HOME/wasi-sdk \
            WASI_URL=https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-33/wasi-sdk-33.0-x86_64-linux.tar.gz

      - name: Check
        run: make check

      - name: Package
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          tar -czf hako-studio-site.tar.gz -C dist .
          sha256sum hako-studio-site.tar.gz > hako-studio-site.sha256
          awk -v h="## [$TAG]" 'index($0, h) == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "CHANGELOG.md has no [$TAG] section"; exit 1; }
          printf '\nthe site, built: `hako-studio-site.tar.gz` (any static host serves it; `hako --serve` carries the same page)\n' >> notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: hako studio ${{ steps.tag.outputs.tag }}
          body_path: notes.md
          files: |
            hako-studio-site.tar.gz
            hako-studio-site.sha256
